<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Mode // TestArena</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="center-content">
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/storage.js?v=4"></script>
  <script src="js/utils.js"></script>
  <script>
    if (!window.Storage || typeof Storage.initFirebase !== 'function') {
      document.write('<script src="js/storage.js?v=4&t=' + Date.now() + '\"><\/script>');
    }
    Storage.initFirebase();
    (function () {
      const user = Utils.requireAuth();
      if (!user) return;

      const testId = Utils.getQueryParam('id');
      const test = Storage.getTest(testId);

      if (!test) {
        window.location.href = 'tests.html';
        return;
      }

      // Game State
      let currentQuestion = 0;
      let answers = new Array(test.questions.length).fill(-1);
      let timeLeft = test.timeLimit;
      let startTime = 0;
      let timerInterval = null;
      let finished = false;

      // Color/Shape mapping
      const optionConfigs = [
        { color: 'var(--red)', shape: 'shape-triangle', shadow: 'var(--red-shadow)' },
        { color: 'var(--blue)', shape: 'shape-diamond', shadow: 'var(--blue-shadow)' },
        { color: 'var(--yellow)', shape: 'shape-circle', shadow: 'var(--yellow-shadow)' },
        { color: 'var(--green)', shape: 'shape-square', shadow: 'var(--green-shadow)' }
      ];

      showStartScreen();

      function showStartScreen() {
        document.getElementById('app').innerHTML = `
          <div class="card fade-in" style="text-align:center; max-width:600px; width:100%; margin: 0 auto; border-top: 12px solid var(--blue);">
            <div style="font-size:1rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:10px;">${t('ready_to_play')}</div>
            <h1 style="color:var(--text-main); text-shadow:none; margin-bottom:20px; font-size:clamp(2rem, 5vw, 3rem); line-height:1.1;">${Utils.escapeHtml(test.title)}</h1>
            
            <div style="display:flex; justify-content:center; gap:20px; margin-bottom:40px;">
              <div style="background:#f4f4f4; padding:10px 20px; border-radius:8px; font-weight:800; color:#555;">
                <span style="font-size:1.5rem; display:block;">${test.questions.length}</span>
                <span style="font-size:0.8rem; text-transform:uppercase;">${t('questions')}</span>
              </div>
              <div style="background:#f4f4f4; padding:10px 20px; border-radius:8px; font-weight:800; color:#555;">
                <span style="font-size:1.5rem; display:block;">${Utils.formatTime(test.timeLimit)}</span>
                <span style="font-size:0.8rem; text-transform:uppercase;">${t('time_limit')}</span>
              </div>
            </div>

            <button id="startBtn" class="btn btn-primary btn-block" style="font-size:1.5rem; padding:24px;">${t('start_challenge')}</button>
            <a href="tests.html" class="btn btn-outline btn-block" style="margin-top:15px; border:none; color:#888;">${t('cancel')}</a>
          </div>
        `;
        document.getElementById('startBtn').addEventListener('click', startTest);
      }

      function startTest() {
        startTime = Date.now();
        if (user.role !== 'admin') {
          const sessionId = Storage.generateId();
          window._testSessionId = sessionId;
          Storage.saveSession({
            id: sessionId,
            userName: user.name,
            userGroup: user.group || '',
            testId: test.id,
            testTitle: test.title,
            startedAt: startTime,
          });
        }
        startTimer();
        renderQuestion();
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          if (!finished) {
            timeLeft--;
            const el = document.getElementById('timer');
            if (el) {
              el.textContent = timeLeft;
              if (timeLeft <= 10) {
                el.style.background = 'var(--red)';
                el.style.color = 'white';
                el.style.animation = 'pulse 0.5s infinite';
              }
            }
            if (timeLeft <= 0) finishTest();
          }
        }, 1000);
      }

      function renderQuestion() {
        if (finished) return;
        const q = test.questions[currentQuestion];

        document.getElementById('app').innerHTML = `
          <div class="container slide-in" style="padding-top:20px; max-width:900px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
              <div style="color:white; font-weight:900; font-size:1.4rem; background:rgba(0,0,0,0.3); padding:8px 20px; border-radius:30px; font-family:var(--font-display);">
                ${currentQuestion + 1} / ${test.questions.length}
              </div>
              
              <div id="timer" class="timer-circle">${timeLeft}</div>
              
              <button onclick="finishTest()" class="btn btn-outline" style="padding:8px 20px; font-size:0.9rem; border-width:2px; height:auto; border-bottom-width:4px;">${t('quit')}</button>
            </div>

            <div class="question-card ${q.imageUrl ? 'question-card--with-img' : ''}">
              ${q.imageUrl ? `
                <div class="question-image-wrap">
                  <img src="${Utils.escapeHtml(q.imageUrl)}" class="question-image" alt="Question image" onerror="this.parentElement.style.display='none'">
                </div>
                <div class="question-card__text">${Utils.escapeHtml(q.text)}</div>
              ` : Utils.escapeHtml(q.text)}
            </div>

            <div class="answer-grid">
              ${q.options.map((opt, i) => {
          const cfg = optionConfigs[i % 4];
          return `
                  <button onclick="selectAnswer(${i})" class="btn answer-btn pop-in" 
                    style="background:${cfg.color}; border-bottom-color:${cfg.shadow}; animation-delay:${i * 0.1}s;">
                    <span class="shape-icon ${cfg.shape}"></span>
                    <span>${Utils.escapeHtml(opt)}</span>
                  </button>
                `;
        }).join('')}
            </div>
          </div>
        `;
      }

      window.selectAnswer = function (index) {
        if (finished) return;
        answers[currentQuestion] = index;

        if (currentQuestion < test.questions.length - 1) {
          currentQuestion++;
          renderQuestion();
        } else {
          finishTest();
        }
      };

      function finishTest() {
        if (finished) return;
        finished = true;
        clearInterval(timerInterval);
        if (window._testSessionId) Storage.removeSession(window._testSessionId);

        const timeSpent = Math.round((Date.now() - startTime) / 1000);
        let correctCount = 0;
        const questionResults = test.questions.map((q, i) => {
          const isCorrect = answers[i] === q.correct;
          if (isCorrect) correctCount++;
          return { questionId: q.id, selected: answers[i], correct: q.correct, isCorrect };
        });

        const score = Math.round((correctCount / test.questions.length) * 100);
        const result = {
          id: Storage.generateId(),
          testId: test.id,
          testTitle: test.title,
          userName: user.name,
          userGroup: user.group || '',
          score,
          correctCount,
          totalQuestions: test.questions.length,
          timeSpent,
          answers: questionResults,
          completedAt: Date.now(),
        };

        if (user.role !== 'admin') {
          Storage.saveResult(result);
        }
        showResults(result);
      }
      window.finishTest = finishTest;

      function showResults(result) {
        const resultColor = result.score >= 70 ? 'var(--green)' : 'var(--red)';
        const title = result.score >= 90 ? t('legendary') : result.score >= 70 ? t('great_job') : t('keep_trying');

        document.getElementById('app').innerHTML = `
          <div class="container center-content fade-in">
            <div class="card" style="text-align:center; max-width:500px; width:100%; border-top:12px solid ${resultColor}; padding:40px;">
              <h1 style="color:#222; font-size:clamp(2.5rem, 5vw, 3.5rem); text-shadow:none; margin-bottom:10px;">${title}</h1>
              
              <div style="font-size:6rem; font-weight:900; color:${resultColor}; margin:20px 0; line-height:1; font-family:var(--font-display); text-shadow: 4px 4px 0 rgba(0,0,0,0.1);">
                ${result.score}%
              </div>

              <div style="display:flex; justify-content:center; gap:20px; font-size:1.2rem; font-weight:800; color:#555; margin-bottom:40px;">
                <div style="background:#f4f4f4; padding:15px; border-radius:12px; min-width:100px;">
                  <div style="font-size:0.8rem; text-transform:uppercase; color:#999; margin-bottom:5px;">${t('correct')}</div>
                  <div>${result.correctCount}/${result.totalQuestions}</div>
                </div>
                <div style="background:#f4f4f4; padding:15px; border-radius:12px; min-width:100px;">
                  <div style="font-size:0.8rem; text-transform:uppercase; color:#999; margin-bottom:5px;">${t('time')}</div>
                  <div>${Utils.formatTime(result.timeSpent)}</div>
                </div>
              </div>

              ${user.role === 'admin'
                ? `<a href="admin.html" class="btn btn-primary btn-block" style="margin-bottom:15px; font-size:1.2rem; padding:18px;">&#8592; ${t('game_master')}</a>`
                : `<a href="leaderboard.html?test=${test.id}" class="btn btn-primary btn-block" style="margin-bottom:15px; font-size:1.2rem; padding:18px;">${t('view_leaderboard')}</a>
              <a href="tests.html" class="btn btn-outline btn-block" style="border:2px solid #ddd; color:#888;">${t('back_to_lobby')}</a>`
              }
            </div>
          </div>
        `;
      }
    })();
  </script>
</body>

</html>
