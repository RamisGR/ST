<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Mode // TestArena</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="center-content">
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Utils.requireAuth();
      if (!user) return;

      const testId = Utils.getQueryParam('id');
      const test = Storage.getTest(testId);

      if (!test) {
        window.location.href = 'tests.html';
        return;
      }

      // Game State
      let currentQuestion = 0;
      let answers = new Array(test.questions.length).fill(-1);
      let timeLeft = test.timeLimit;
      let startTime = 0;
      let timerInterval = null;
      let finished = false;

      // Color/Shape mapping
      const optionConfigs = [
        { color: 'var(--red)', shape: 'shape-triangle', shadow: 'var(--red-shadow)', label: 'var(--red)' },
        { color: 'var(--blue)', shape: 'shape-diamond', shadow: 'var(--blue-shadow)', label: 'var(--blue)' },
        { color: 'var(--yellow)', shape: 'shape-circle', shadow: 'var(--yellow-shadow)', label: '#333' },
        { color: 'var(--green)', shape: 'shape-square', shadow: 'var(--green-shadow)', label: 'white' }
      ];

      showStartScreen();

      function showStartScreen() {
        document.getElementById('app').innerHTML = `
          <div class="card fade-in" style="text-align:center; max-width:600px; width:100%; margin: 0 auto; border-top: 10px solid var(--primary);">
            <h1 style="color:var(--text-main); text-shadow:none; margin-bottom:10px; font-size:2.5rem;">${Utils.escapeHtml(test.title)}</h1>
            <p style="font-size:1.2rem; color:#666; margin-bottom:30px; font-weight:700;">
              <span style="background:#eee; padding:5px 10px; border-radius:6px;">${test.questions.length} Questions</span>
              <span style="background:#eee; padding:5px 10px; border-radius:6px;">${Utils.formatTime(test.timeLimit)}</span>
            </p>
            
            <div style="font-size:6rem; margin-bottom:30px;">🚀</div>

            <button id="startBtn" class="btn btn-primary btn-block" style="font-size:1.5rem; padding:20px; box-shadow: 0 6px 0 var(--blue-shadow);">Start Challenge</button>
            <a href="tests.html" class="btn btn-outline btn-block" style="margin-top:15px; border:none; color:#888;">Cancel</a>
          </div>
        `;
        document.getElementById('startBtn').addEventListener('click', startTest);
      }

      function startTest() {
        startTime = Date.now();
        const sessionId = Storage.generateId();
        window._testSessionId = sessionId;
        Storage.saveSession({
          id: sessionId,
          userName: user.name,
          userGroup: user.group,
          testId: test.id,
          testTitle: test.title,
          startedAt: startTime,
        });

        startTimer();
        renderQuestion();
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          if (!finished) {
            timeLeft--;
            const el = document.getElementById('timer');
            if (el) {
              el.textContent = timeLeft;
              if (timeLeft <= 10) {
                el.style.background = 'var(--red)';
                el.style.animation = 'pulse 0.5s infinite';
              }
            }
            if (timeLeft <= 0) finishTest();
          }
        }, 1000);
      }

      function renderQuestion() {
        if (finished) return;
        const q = test.questions[currentQuestion];

        document.getElementById('app').innerHTML = `
          <div class="container slide-in" style="padding-top:20px; max-width:800px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
              <div style="color:white; font-weight:700; font-size:1.2rem; background:rgba(0,0,0,0.3); padding:5px 15px; border-radius:20px;">
                ${currentQuestion + 1} / ${test.questions.length}
              </div>
              <div id="timer" class="timer-circle" style="width:70px; height:70px; font-size:1.8rem; margin:0; box-shadow:0 0 15px rgba(0,0,0,0.3);">${timeLeft}</div>
              <button onclick="finishTest()" style="background:rgba(255,255,255,0.2); border:none; color:white; font-weight:700; cursor:pointer; padding:8px 15px; border-radius:6px;">Quit</button>
            </div>

            <div class="question-card" style="font-size:1.8rem; margin-bottom:30px; min-height:150px; display:flex; align-items:center; justify-content:center;">
              ${Utils.escapeHtml(q.text)}
            </div>

            <div class="answer-grid" style="grid-template-columns: 1fr 1fr; gap:20px; height:auto;">
              ${q.options.map((opt, i) => {
          const cfg = optionConfigs[i % 4];
          return `
                  <button onclick="selectAnswer(${i})" class="btn pop-in" 
                    style="background:${cfg.color}; border-bottom-color:${cfg.shadow}; color:white;
                           height:120px; font-size:1.3rem; padding:20px; width:100%; display:flex; align-items:center; justify-content:center;
                           text-align:center; white-space:normal; line-height:1.2;">
                    <span class="shape-icon ${cfg.shape}" style="background:rgba(0,0,0,0.2); position:absolute; left:15px; top:15px;"></span>
                    <span>${Utils.escapeHtml(opt)}</span>
                  </button>
                `;
        }).join('')}
            </div>
          </div>
        `;
      }

      window.selectAnswer = function (index) {
        if (finished) return;
        answers[currentQuestion] = index;

        if (currentQuestion < test.questions.length - 1) {
          currentQuestion++;
          renderQuestion();
        } else {
          finishTest();
        }
      };

      function finishTest() {
        if (finished) return;
        finished = true;
        clearInterval(timerInterval);
        if (window._testSessionId) Storage.removeSession(window._testSessionId);

        const timeSpent = Math.round((Date.now() - startTime) / 1000);
        let correctCount = 0;
        const questionResults = test.questions.map((q, i) => {
          const isCorrect = answers[i] === q.correct;
          if (isCorrect) correctCount++;
          return { questionId: q.id, selected: answers[i], correct: q.correct, isCorrect };
        });

        const score = Math.round((correctCount / test.questions.length) * 100);
        const result = {
          id: Storage.generateId(),
          testId: test.id,
          testTitle: test.title,
          userName: user.name,
          userGroup: user.group,
          score,
          correctCount,
          totalQuestions: test.questions.length,
          timeSpent,
          answers: questionResults,
          completedAt: Date.now(),
        };

        Storage.saveResult(result);
        showResults(result);
      }

      function showResults(result) {
        const resultColor = result.score >= 70 ? 'var(--green)' : 'var(--red)';
        const title = result.score >= 90 ? 'Legendary!' : result.score >= 70 ? 'Great Job!' : 'Keep Trying!';

        document.getElementById('app').innerHTML = `
          <div class="container center-content fade-in">
            <div class="card" style="text-align:center; max-width:500px; width:100%; border-top:10px solid ${resultColor}; padding:40px;">
              <h1 style="color:#333; font-size:2.5rem; text-shadow:none; margin-bottom:10px;">${title}</h1>
              
              <div style="font-size:6rem; font-weight:900; color:${resultColor}; margin:20px 0; line-height:1;">
                ${result.score}%
              </div>

              <div style="display:flex; justify-content:center; gap:30px; font-size:1.2rem; font-weight:700; color:#666; margin-bottom:40px;">
                <div style="background:#f5f5f5; padding:10px 20px; border-radius:10px;">
                  <div style="font-size:0.9rem; text-transform:uppercase; color:#999;">Correct</div>
                  <div>${result.correctCount}/${result.totalQuestions}</div>
                </div>
                <div style="background:#f5f5f5; padding:10px 20px; border-radius:10px;">
                  <div style="font-size:0.9rem; text-transform:uppercase; color:#999;">Time</div>
                  <div>${Utils.formatTime(result.timeSpent)}</div>
                </div>
              </div>

              <a href="leaderboard.html?test=${test.id}" class="btn btn-primary btn-block" style="margin-bottom:15px; font-size:1.2rem; padding:18px;">View Leaderboard</a>
              <a href="tests.html" class="btn btn-outline btn-block" style="border:2px solid #ddd; color:#888;">Back to Lobby</a>
            </div>
          </div>
        `;
      }
    })();
  </script>
  <style>
    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</body>

</html>
