<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hall of Fame // TestArena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-weight: 900;
      color: white;
      font-size: 1.2rem;
    }

    .rank-1-badge {
      background: #D89E00;
      box-shadow: 0 3px 0 #A67900;
    }

    .rank-2-badge {
      background: #C0C0C0;
      box-shadow: 0 3px 0 #999;
    }

    .rank-3-badge {
      background: #CD7F32;
      box-shadow: 0 3px 0 #A05A18;
    }

    .rank-other-badge {
      background: #eee;
      color: #888;
    }

    .podium-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 350px;
      margin-bottom: 40px;
      gap: 15px;
    }

    .battle-podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100px;
    }

    .podium-bar {
      width: 100%;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10px;
      color: white;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .podium-rank-1 {
      height: 200px;
      background: #D89E00;
      order: 2;
      z-index: 2;
    }

    .podium-rank-2 {
      height: 140px;
      background: #C0C0C0;
      order: 1;
    }

    .podium-rank-3 {
      height: 100px;
      background: #CD7F32;
      order: 3;
    }

    .rank-1 {
      order: 2;
      transform: translateY(-20px);
    }

    .rank-2 {
      order: 1;
    }

    .rank-3 {
      order: 3;
    }
  </style>
</head>

<body>
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();

    (function () {
      const user = Utils.requireAuth();
      if (!user) return;

      const selectedTestId = Utils.getQueryParam('test');
      let liveSessions = [];

      // Initial render must happen before listeners to setup container
      render();

      Storage.onResultsChange(() => { renderLeaderboardContent(); });
      Storage.onSessionsChange((sessions) => {
        liveSessions = sessions;
        renderLiveBar();
      });

      function render() {
        const tests = Storage.getTests();

        document.getElementById('app').innerHTML = `
          <header style="padding: 20px 0; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:1.5rem; font-weight:900; color:white; text-shadow:0 2px 0 rgba(0,0,0,0.2);">TestArena</div>
            <a href="tests.html" class="btn btn-outline" style="border:none; color:white; background:rgba(255,255,255,0.2);">Back</a>
          </header>

          <div class="container fade-in">
            <h1 style="margin-bottom:20px;">Hall of Fame</h1>
            
            <div id="live-bar-container"></div>

            <div class="tabs" style="justify-content:center; flex-wrap:wrap; gap:10px; margin-bottom:30px;">
              <button class="tab ${!selectedTestId ? 'active' : ''}" onclick="window.location.href='leaderboard.html'">
                Global
              </button>
              ${tests.map(t => `
                <button class="tab ${selectedTestId === t.id ? 'active' : ''}"
                        onclick="window.location.href='leaderboard.html?test=${t.id}'">
                  ${Utils.escapeHtml(t.title)}
                </button>
              `).join('')}
            </div>

            <div id="leaderboard-content">
              ${selectedTestId ? renderTestLeaderboard(selectedTestId) : renderOverallLeaderboard()}
            </div>
          </div>
        `;

        // Render content immediately
        renderLeaderboardContent();
        renderLiveBar();
      }

      function renderLiveBar() {
        const container = document.getElementById('live-bar-container');
        if (!container) return;

        const relevant = selectedTestId
          ? liveSessions.filter(s => s.testId === selectedTestId)
          : liveSessions;

        if (relevant.length === 0) {
          container.innerHTML = '';
          return;
        }

        container.innerHTML = `
          <div style="background:white; padding:15px; border-radius:12px; margin-bottom:30px; text-align:center; box-shadow:0 6px 0 rgba(0,0,0,0.1);">
            <div style="font-weight:900; color:var(--primary); margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;">
              <span style="color:var(--red); animation:blink 1s infinite;">●</span> Live Now [${relevant.length}]
            </div>
            <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px;">
              ${relevant.map(s => `
                <div class="avatar" style="width:40px; height:40px; font-size:1rem; border:none; background:#eee; color:#333;" title="${Utils.escapeHtml(s.userName)}">
                  ${s.userName.charAt(0).toUpperCase()}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderTestLeaderboard(testId) {
        const test = Storage.getTest(testId);
        if (!test) return '';

        const results = Storage.getResultsForTest(testId);
        if (results.length === 0) {
          return `<div class="card empty-state" style="text-align:center; font-weight:700;">No scores yet. Be the first!</div>`;
        }

        const bestByUser = {};
        results.forEach(r => {
          if (!bestByUser[r.userName] || r.score > bestByUser[r.userName].score ||
            (r.score === bestByUser[r.userName].score && r.timeSpent < bestByUser[r.userName].timeSpent)) {
            bestByUser[r.userName] = r;
          }
        });

        const sorted = Object.values(bestByUser).sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return a.timeSpent - b.timeSpent;
        });

        const top3 = sorted.slice(0, 3);

        // Pad with nulls for layout if less than 3
        const p1 = top3[0];
        const p2 = top3[1] || null;
        const p3 = top3[2] || null;

        let podiumHtml = '';
        if (p1) {
          podiumHtml = `
            <div class="podium-container">
              ${p2 ? `
                <div class="battle-podium-item rank-2">
                  <div class="avatar" style="background:#C0C0C0; color:white; margin-bottom:10px; border:2px solid white;">${p2.userName.charAt(0)}</div>
                  <div style="font-weight:700; color:white; margin-bottom:5px; text-shadow:0 2px 4px rgba(0,0,0,0.3);">${Utils.escapeHtml(p2.userName)}</div>
                  <div class="podium-bar podium-rank-2 pop-in" style="animation-delay:0.2s;">
                    <span>#2</span>
                  </div>
                </div>
              ` : ''}
              
              <div class="battle-podium-item rank-1">
                <div class="avatar" style="background:#D89E00; color:white; margin-bottom:10px; width:70px; height:70px; font-size:2rem; border:4px solid white;">${p1.userName.charAt(0)}</div>
                <div style="font-weight:700; color:white; margin-bottom:5px; font-size:1.2rem; text-shadow:0 2px 4px rgba(0,0,0,0.3);">
                  ${Utils.escapeHtml(p1.userName)}
                  <div style="font-size:0.9rem; opacity:0.9;">${p1.score}%</div>
                </div>
                <div class="podium-bar podium-rank-1 pop-in">
                  <span style="font-size:2rem;">🏆</span>
                </div>
              </div>

              ${p3 ? `
                <div class="battle-podium-item rank-3">
                  <div class="avatar" style="background:#CD7F32; color:white; margin-bottom:10px; border:2px solid white;">${p3.userName.charAt(0)}</div>
                  <div style="font-weight:700; color:white; margin-bottom:5px; text-shadow:0 2px 4px rgba(0,0,0,0.3);">${Utils.escapeHtml(p3.userName)}</div>
                  <div class="podium-bar podium-rank-3 pop-in" style="animation-delay:0.4s;">
                    <span>#3</span>
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }

        return `
          ${podiumHtml}
          <div class="card" style="margin-top:20px; padding:0;">
            <table class="leaderboard-table">
              <tr>
                <th style="width:80px; text-align:center;">Rank</th>
                <th>Player</th>
                <th>Group</th>
                <th style="text-align:right;">Score</th>
              </tr>
              ${sorted.map((r, i) => `
                <tr style="${r.userName === user.name ? 'background:#f0fbfd; font-weight:bold;' : ''}">
                  <td style="text-align:center;">
                    <span class="rank-badge ${i === 0 ? 'rank-1-badge' : i === 1 ? 'rank-2-badge' : i === 2 ? 'rank-3-badge' : 'rank-other-badge'}" style="width:30px; height:30px; font-size:1rem;">${i + 1}</span>
                  </td>
                  <td>${Utils.escapeHtml(r.userName)}</td>
                  <td style="color:#888;">${Utils.escapeHtml(r.userGroup || '-')}</td>
                  <td style="text-align:right; font-weight:900; color:${r.score >= 90 ? 'var(--green)' : 'var(--text-main)'};">${r.score}%</td>
                </tr>
              `).join('')}
            </table>
          </div>
        `;
      }

      function renderOverallLeaderboard() {
        const allResults = Storage.getResults();
        if (allResults.length === 0) return `<div class="card empty-state">No records yet.</div>`;

        const userStats = {};
        allResults.forEach(r => {
          if (!userStats[r.userName]) userStats[r.userName] = { name: r.userName, totalScore: 0, count: 0 };
          userStats[r.userName].totalScore += r.score;
          userStats[r.userName].count++;
        });

        const sorted = Object.values(userStats)
          .map(s => ({ ...s, avg: Math.round(s.totalScore / s.count) }))
          .sort((a, b) => b.avg - a.avg);

        return `
          <div class="card" style="padding:0;">
            <h3 style="padding:20px; margin:0; text-align:center; border-bottom:1px solid #eee;">Overall Legends</h3>
            <table class="leaderboard-table">
              <tr><th style="text-align:center;">Rank</th><th>Player</th><th style="text-align:right;">Avg Score</th></tr>
              ${sorted.map((s, i) => `
                <tr style="${s.name === user.name ? 'background:#f0fbfd; font-weight:bold;' : ''}">
                   <td style="text-align:center;">
                     <span class="rank-badge ${i < 3 ? 'rank-' + (i + 1) + '-badge' : 'rank-other-badge'}" style="width:30px; height:30px; font-size:1rem;">${i + 1}</span>
                   </td>
                   <td>${Utils.escapeHtml(s.name)}</td>
                   <td style="text-align:right; font-weight:900;">${s.avg}%</td>
                </tr>
              `).join('')}
            </table>
          </div>
        `;
      }

      function renderLeaderboardContent() {
        const el = document.getElementById('leaderboard-content');
        if (el) el.innerHTML = selectedTestId ? renderTestLeaderboard(selectedTestId) : renderOverallLeaderboard();
      }

    })();
  </script>
</body>

</html>
