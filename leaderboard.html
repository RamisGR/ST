<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard // TestArena</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .leaderboard-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      align-items: center;
      padding: 15px 20px;
      background: white;
      margin-bottom: 15px;
      border-radius: 16px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
      font-weight: 700;
      color: #333;
    }

    .leaderboard-row:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 0 20px 15px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 2px;
    }
  </style>
</head>

<body class="center-content">
  <div id="app" class="container" style="max-width:800px;"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Utils.requireAuth();
      if (!user) return;

      const testId = Utils.getQueryParam('test');
      const allTests = Storage.getTests();
      const test = testId ? Storage.getTest(testId) : null;
      let results = [];

      if (testId) {
        results = Storage.getResultsForTest(testId);
        // Sort results: highest score, then lowest time
        results.sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return a.timeSpent - b.timeSpent;
        });
      }

      render();

      function render() {
        if (!testId) {
          // Show test selector if no test selected
          document.getElementById('app').innerHTML = `
            <div class="fade-in">
              <div style="display:flex; align-items:center; gap:20px; margin-bottom:40px;">
                <a href="tests.html" class="btn btn-outline" style="color:white; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); padding:10px 20px;">${t('back')}</a>
                <div style="display:flex; align-items:center; gap:15px;">${renderLangSwitcher()}<h1 style="font-size:clamp(2rem, 5vw, 3rem); margin:0; line-height:1; color:white;">${t('hall_of_fame')}</h1></div>
              </div>
              ${(() => {
                const folders = Storage.getFolders();
                const byFolder = {};
                allTests.forEach(test => {
                  const fid = test.folderId || '__unfiled__';
                  if (!byFolder[fid]) byFolder[fid] = [];
                  byFolder[fid].push(test);
                });
                const sections = [
                  { id: '__unfiled__', name: t('folder_unfiled'), color: '#bbb' },
                  ...folders.map(f => ({ id: f.id, name: f.name, color: f.color || 'var(--blue)' })),
                ].filter(section => (byFolder[section.id] || []).length);

                return sections.map(section => `
                  <details open class="card" style="margin-bottom:14px; padding:0; overflow:hidden;">
                    <summary style="cursor:pointer; list-style:none; background:${section.color}; color:white; font-weight:900; padding:12px 16px;">${Utils.escapeHtml(section.name)} (${byFolder[section.id].length})</summary>
                    <div class="test-grid" style="padding:14px;">
                      ${byFolder[section.id].map(test => `
                        <a href="leaderboard.html?test=${test.id}" class="card" style="text-decoration:none; color:inherit; border-top:8px solid ${section.color}; transition:transform 0.2s;">
                          <h2 style="margin:0 0 10px 0;">${Utils.escapeHtml(test.title)}</h2>
                          <div style="color:#666; font-weight:700;">${t('view_rankings')}</div>
                        </a>
                      `).join('')}
                    </div>
                  </details>
                `).join('');
              })()}
            </div>
          `;
          return;
        }

        document.getElementById('app').innerHTML = `
          <div class="fade-in">
            <div style="display:flex; align-items:center; gap:20px; margin-bottom:40px;">
              <a href="tests.html" class="btn btn-outline" style="color:white; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); padding:10px 20px; font-weight:700;">${t('back')}</a>
              <div>
                <div style="font-size:1rem; color:rgba(255,255,255,0.7); font-weight:800; text-transform:uppercase; letter-spacing:1px;">${t('leaderboard')}</div>
                <h1 style="font-size:clamp(1.5rem, 5vw, 3rem); margin:0; line-height:1; color:white; text-shadow:0 3px 0 rgba(0,0,0,0.2);">${Utils.escapeHtml(test ? test.title : 'Details')}</h1>
              </div>
            </div>

            <div style="background:rgba(255,255,255,0.1); backdrop-filter:blur(20px); border-radius:24px; padding:30px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
               ${results.length === 0 ? `
                 <div style="text-align:center; padding:60px; color:white;">
                   <div style="font-size:5rem; opacity:0.3; margin-bottom:20px;">🏆</div>
                   <div style="font-size:2rem; font-weight:800; margin-bottom:10px;">${t('no_champions')}</div>
                   <p style="font-size:1.2rem; opacity:0.8;">${t('first_conquer')}</p>
                   <a href="test.html?id=${testId}" class="btn btn-primary" style="margin-top:30px; font-size:1.2rem; padding:15px 30px;">${t('start_challenge')}</a>
                 </div>
               ` : `
                 <div class="leaderboard-header">
                   <div style="text-align:center;">${t('rank')}</div>
                   <div>${t('player')}</div>
                   <div style="text-align:right;">${t('score')}</div>
                 </div>

                 <div style="max-height:60vh; overflow-y:auto; padding-right:10px;">
                   ${results.map((r, i) => {
          const isMe = r.userName === user.name;
          const rank = i + 1;
          let rankBadge = `<div class="rank-badge rank-other-badge" style="background:#eee; color:#888;">${rank}</div>`;

          if (rank === 1) rankBadge = `<div class="rank-badge rank-1-badge">1</div>`;
          else if (rank === 2) rankBadge = `<div class="rank-badge rank-2-badge">2</div>`;
          else if (rank === 3) rankBadge = `<div class="rank-badge rank-3-badge">3</div>`;

          const meStyle = isMe ? 'border:3px solid var(--blue); transform:scale(1.02); z-index:5;' : '';

          return `
                       <div class="leaderboard-row slide-in" style="${meStyle} animation-delay:${i * 0.05}s;">
                         <div style="display:flex; justify-content:center;">${rankBadge}</div>
                         <div style="display:flex; align-items:center; gap:15px; overflow:hidden;">
                           <div class="avatar" style="width:40px; height:40px; font-size:1.2rem; flex-shrink:0; background:${isMe ? 'var(--blue)' : '#f0f0f0'}; color:${isMe ? 'white' : '#555'}; border:none; box-shadow:none;">
                             ${r.userName.charAt(0).toUpperCase()}
                           </div>
                           <div style="display:flex; flex-direction:column; overflow:hidden;">
                             <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:1.1rem; ${isMe ? 'color:var(--blue); font-weight:900;' : ''}">
                               ${Utils.escapeHtml(r.userName)} ${isMe ? t('you') : ''}
                             </span>
                             <span style="font-size:0.8rem; color:#999; font-weight:600;">${t('time')}: ${Utils.formatTime(r.timeSpent)}</span>
                           </div>
                         </div>
                         <div style="text-align:right;">
                           <div style="font-family:var(--font-display); font-size:1.5rem; color:${rank <= 3 ? '#222' : '#666'}; line-height:1;">${r.score}%</div>
                         </div>
                       </div>
                     `;
        }).join('')}
                 </div>
               `}
            </div>
          </div>
        `;
      }
    })();
  </script>
</body>

</html>
