<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг — TestArena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .live-indicator {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    .live-bar {
      background: linear-gradient(135deg, rgba(0,184,148,0.1), rgba(0,206,201,0.1));
      border: 1px solid rgba(0,184,148,0.3);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .live-bar-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--success);
    }
    .live-user {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-input);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin: 3px 4px;
    }
    .auto-refresh-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-left: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();

    (function() {
      const user = Utils.requireAuth();
      if (!user) return;

      const selectedTestId = Utils.getQueryParam('test');
      let liveSessions = [];

      // Initial render
      render();

      // Real-time: re-render leaderboard when results change
      Storage.onResultsChange(() => {
        renderLeaderboardContent();
      });

      // Real-time: track who is currently taking a test
      Storage.onSessionsChange((sessions) => {
        liveSessions = sessions;
        renderLiveBar();
      });

      function render() {
        const tests = Storage.getTests();

        document.getElementById('app').innerHTML = `
          ${Utils.renderHeader(user, 'leaderboard')}
          <div class="container fade-in">
            <div style="display:flex; align-items:center; flex-wrap:wrap; margin:24px 0 16px;">
              <h2>Рейтинг участников</h2>
              ${Storage.isOnline() ? `
                <span class="auto-refresh-note">
                  <span class="live-indicator"></span> Обновляется автоматически
                </span>
              ` : ''}
            </div>

            <div id="live-bar-container"></div>

            <div style="margin-bottom:24px;">
              <div class="tabs">
                <button class="tab ${!selectedTestId ? 'active' : ''}" onclick="window.location.href='leaderboard.html'">
                  Общий
                </button>
                ${tests.map(t => `
                  <button class="tab ${selectedTestId === t.id ? 'active' : ''}"
                          onclick="window.location.href='leaderboard.html?test=${t.id}'">
                    ${Utils.escapeHtml(t.title)}
                  </button>
                `).join('')}
              </div>
            </div>

            <div id="leaderboard-content">
              ${selectedTestId ? renderTestLeaderboard(selectedTestId) : renderOverallLeaderboard()}
            </div>
          </div>
        `;
      }

      function renderLeaderboardContent() {
        const el = document.getElementById('leaderboard-content');
        if (!el) return;
        el.innerHTML = selectedTestId ? renderTestLeaderboard(selectedTestId) : renderOverallLeaderboard();
      }

      function renderLiveBar() {
        const container = document.getElementById('live-bar-container');
        if (!container) return;

        // Filter sessions for current test (or all)
        const relevant = selectedTestId
          ? liveSessions.filter(s => s.testId === selectedTestId)
          : liveSessions;

        if (relevant.length === 0) {
          container.innerHTML = '';
          return;
        }

        container.innerHTML = `
          <div class="live-bar">
            <div class="live-bar-title">
              <span class="live-indicator"></span>
              Сейчас проходят тест: ${relevant.length} чел.
            </div>
            <div>
              ${relevant.map(s => `
                <span class="live-user">
                  <span class="live-indicator"></span>
                  ${Utils.escapeHtml(s.userName)}
                  ${s.testTitle ? `<small style="color:var(--text-muted);">— ${Utils.escapeHtml(s.testTitle)}</small>` : ''}
                </span>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderTestLeaderboard(testId) {
        const test = Storage.getTest(testId);
        if (!test) return '<div class="empty-state"><p>Тест не найден</p></div>';

        const results = Storage.getResultsForTest(testId);
        if (results.length === 0) {
          return `
            <div class="empty-state">
              <div class="empty-state-icon">&#127942;</div>
              <p>Пока никто не прошёл этот тест. Будьте первым!</p>
              <a href="test.html?id=${testId}" class="btn btn-primary" style="margin-top:16px;">Пройти тест</a>
            </div>
          `;
        }

        // Best result per user
        const bestByUser = {};
        results.forEach(r => {
          if (!bestByUser[r.userName] || r.score > bestByUser[r.userName].score ||
              (r.score === bestByUser[r.userName].score && r.timeSpent < bestByUser[r.userName].timeSpent)) {
            bestByUser[r.userName] = r;
          }
        });

        const sorted = Object.values(bestByUser).sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return a.timeSpent - b.timeSpent;
        });

        return `
          <div class="card">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th style="text-align:center;">#</th>
                  <th>Участник</th>
                  <th>Группа</th>
                  <th style="text-align:right;">Результат</th>
                  <th style="text-align:right;">Время</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map((r, i) => `
                  <tr class="${r.userName === user.name ? 'highlight-row' : ''}">
                    <td class="rank-cell rank-${i + 1}">${i < 3 ? ['&#129351;', '&#129352;', '&#129353;'][i] : i + 1}</td>
                    <td class="name-cell">${Utils.escapeHtml(r.userName)}</td>
                    <td style="color:var(--text-muted);">${Utils.escapeHtml(r.userGroup || '—')}</td>
                    <td class="score-cell">${r.score}% <small style="color:var(--text-muted);">(${r.correctCount}/${r.totalQuestions})</small></td>
                    <td class="time-cell">${Utils.formatTime(r.timeSpent)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <p style="color:var(--text-muted); font-size:0.85rem; margin-top:12px;">
            Показан лучший результат каждого участника. Всего попыток: ${results.length}
          </p>
        `;
      }

      function renderOverallLeaderboard() {
        const allResults = Storage.getResults();
        if (allResults.length === 0) {
          return `
            <div class="empty-state">
              <div class="empty-state-icon">&#127942;</div>
              <p>Результатов пока нет. Пройдите тест, чтобы попасть в рейтинг!</p>
              <a href="tests.html" class="btn btn-primary" style="margin-top:16px;">К тестам</a>
            </div>
          `;
        }

        // Aggregate: average score per user across all tests
        const userStats = {};
        allResults.forEach(r => {
          if (!userStats[r.userName]) {
            userStats[r.userName] = {
              name: r.userName,
              group: r.userGroup,
              totalScore: 0,
              testsCompleted: 0,
              totalTime: 0,
              totalCorrect: 0,
              totalQuestions: 0,
            };
          }
          const s = userStats[r.userName];
          s.totalScore += r.score;
          s.testsCompleted++;
          s.totalTime += r.timeSpent;
          s.totalCorrect += r.correctCount;
          s.totalQuestions += r.totalQuestions;
        });

        const sorted = Object.values(userStats)
          .map(s => ({
            ...s,
            avgScore: Math.round(s.totalScore / s.testsCompleted),
          }))
          .sort((a, b) => {
            if (b.avgScore !== a.avgScore) return b.avgScore - a.avgScore;
            return a.totalTime - b.totalTime;
          });

        return `
          <div class="card">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th style="text-align:center;">#</th>
                  <th>Участник</th>
                  <th>Группа</th>
                  <th style="text-align:right;">Средний балл</th>
                  <th style="text-align:right;">Тестов</th>
                  <th style="text-align:right;">Общее время</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map((s, i) => `
                  <tr class="${s.name === user.name ? 'highlight-row' : ''}">
                    <td class="rank-cell rank-${i + 1}">${i < 3 ? ['&#129351;', '&#129352;', '&#129353;'][i] : i + 1}</td>
                    <td class="name-cell">${Utils.escapeHtml(s.name)}</td>
                    <td style="color:var(--text-muted);">${Utils.escapeHtml(s.group || '—')}</td>
                    <td class="score-cell">${s.avgScore}%</td>
                    <td style="text-align:right;">${s.testsCompleted}</td>
                    <td class="time-cell">${Utils.formatTime(s.totalTime)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
