<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global_Ranking // TestArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .live-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--primary);
      margin-right: 6px;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from {
        opacity: 1;
      }

      to {
        opacity: 0.3;
      }
    }

    .live-bar {
      border: 2px solid var(--primary);
      background: var(--bg);
      padding: 16px;
      margin-bottom: 24px;
    }

    .live-bar-title {
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: var(--primary);
      display: flex;
      align-items: center;
    }

    .live-user {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--text);
      padding: 4px 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      margin: 4px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();

    (function () {
      const user = Utils.requireAuth();
      if (!user) return;

      const selectedTestId = Utils.getQueryParam('test');
      let liveSessions = [];

      // Initial render
      render();

      // Real-time: re-render leaderboard when results change
      Storage.onResultsChange(() => {
        renderLeaderboardContent();
      });

      // Real-time: track who is currently taking a test
      Storage.onSessionsChange((sessions) => {
        liveSessions = sessions;
        renderLiveBar();
      });

      function render() {
        const tests = Storage.getTests();

        document.getElementById('app').innerHTML = `
          ${Utils.renderHeader(user, 'leaderboard')}
          <div class="container fade-in">
            <div style="display:flex; align-items:center; justify-content: space-between; flex-wrap:wrap; margin:0 0 24px;">
              <h2 style="margin:0;">GLOBAL_RANKING</h2>
              ${Storage.isOnline() ? `
                <div class="mono" style="font-size: 0.8rem; color: var(--primary);">
                   ● LIVE_DATA_STREAM_ACTIVE
                </div>
              ` : ''}
            </div>

            <div id="live-bar-container"></div>

            <div style="margin-bottom:32px;">
              <div class="tabs">
                <button class="tab ${!selectedTestId ? 'active' : ''}" onclick="window.location.href='leaderboard.html'">
                  OVERALL_STANDING
                </button>
                ${tests.map(t => `
                  <button class="tab ${selectedTestId === t.id ? 'active' : ''}"
                          onclick="window.location.href='leaderboard.html?test=${t.id}'">
                    ${Utils.escapeHtml(t.title)}
                  </button>
                `).join('')}
              </div>
            </div>

            <div id="leaderboard-content">
              ${selectedTestId ? renderTestLeaderboard(selectedTestId) : renderOverallLeaderboard()}
            </div>
          </div>
        `;
      }

      function renderLeaderboardContent() {
        const el = document.getElementById('leaderboard-content');
        if (!el) return;
        el.innerHTML = selectedTestId ? renderTestLeaderboard(selectedTestId) : renderOverallLeaderboard();
      }

      function renderLiveBar() {
        const container = document.getElementById('live-bar-container');
        if (!container) return;

        // Filter sessions for current test (or all)
        const relevant = selectedTestId
          ? liveSessions.filter(s => s.testId === selectedTestId)
          : liveSessions;

        if (relevant.length === 0) {
          container.innerHTML = '';
          return;
        }

        container.innerHTML = `
          <div class="live-bar">
            <div class="live-bar-title">
              <span class="live-indicator"></span>
              ACTIVE_AGENTS [${relevant.length}]
            </div>
            <div>
              ${relevant.map(s => `
                <span class="live-user">
                  ${Utils.escapeHtml(s.userName)}
                  ${s.testTitle ? `<span style="color:var(--text-muted); border-left: 1px solid var(--text-muted); padding-left: 6px; margin-left: 2px;">${Utils.escapeHtml(s.testTitle)}</span>` : ''}
                </span>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderTestLeaderboard(testId) {
        const test = Storage.getTest(testId);
        if (!test) return '<div class="empty-state"><p>MODULE NOT FOUND</p></div>';

        const results = Storage.getResultsForTest(testId);
        if (results.length === 0) {
          return `
            <div class="empty-state">
              <div class="empty-state-icon">!</div>
              <p>NO DATA RECORDS.</p>
              <a href="test.html?id=${testId}" class="btn" style="margin-top:16px;">INITIATE SEQUENCE</a>
            </div>
          `;
        }

        // Best result per user
        const bestByUser = {};
        results.forEach(r => {
          if (!bestByUser[r.userName] || r.score > bestByUser[r.userName].score ||
            (r.score === bestByUser[r.userName].score && r.timeSpent < bestByUser[r.userName].timeSpent)) {
            bestByUser[r.userName] = r;
          }
        });

        const sorted = Object.values(bestByUser).sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return a.timeSpent - b.timeSpent;
        });

        return `
          <div class="card">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th style="text-align:center;">RANK</th>
                  <th>AGENT</th>
                  <th>UNIT</th>
                  <th style="text-align:right;">RATING</th>
                  <th style="text-align:right;">TIME</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map((r, i) => `
                  <tr class="${r.userName === user.name ? 'highlight-row' : ''}" style="${r.userName === user.name ? 'background: var(--bg-secondary);' : ''}">
                    <td class="rank-cell rank-${i + 1}">${i + 1}</td>
                    <td class="name-cell" style="font-weight: 700;">${Utils.escapeHtml(r.userName)}</td>
                    <td class="mono" style="color:var(--text-muted); text-transform:uppercase;">${Utils.escapeHtml(r.userGroup || '—')}</td>
                    <td class="score-cell">${r.score}% <small class="mono" style="color:var(--text-muted); font-size: 0.8em;">(${r.correctCount}/${r.totalQuestions})</small></td>
                    <td class="time-cell">${Utils.formatTime(r.timeSpent)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <p class="mono" style="color:var(--text-muted); font-size:0.8rem; margin-top:12px; text-transform:uppercase;">
            Displaying optimal performance records. Total attempts: ${results.length}
          </p>
        `;
      }

      function renderOverallLeaderboard() {
        const allResults = Storage.getResults();
        if (allResults.length === 0) {
          return `
            <div class="empty-state">
              <div class="empty-state-icon">!</div>
              <p>NO RECORDS FOUND.</p>
              <a href="tests.html" class="btn" style="margin-top:16px;">VIEW MODULES</a>
            </div>
          `;
        }

        // Aggregate: average score per user across all tests
        const userStats = {};
        allResults.forEach(r => {
          if (!userStats[r.userName]) {
            userStats[r.userName] = {
              name: r.userName,
              group: r.userGroup,
              totalScore: 0,
              testsCompleted: 0,
              totalTime: 0,
              totalCorrect: 0,
              totalQuestions: 0,
            };
          }
          const s = userStats[r.userName];
          s.totalScore += r.score;
          s.testsCompleted++;
          s.totalTime += r.timeSpent;
          s.totalCorrect += r.correctCount;
          s.totalQuestions += r.totalQuestions;
        });

        const sorted = Object.values(userStats)
          .map(s => ({
            ...s,
            avgScore: Math.round(s.totalScore / s.testsCompleted),
          }))
          .sort((a, b) => {
            if (b.avgScore !== a.avgScore) return b.avgScore - a.avgScore;
            return a.totalTime - b.totalTime;
          });

        return `
          <div class="card">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th style="text-align:center;">RANK</th>
                  <th>AGENT</th>
                  <th>UNIT</th>
                  <th style="text-align:right;">AVG_RATING</th>
                  <th style="text-align:right;">L_COUNT</th>
                  <th style="text-align:right;">TOTAL_TIME</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map((s, i) => `
                  <tr class="${s.name === user.name ? 'highlight-row' : ''}" style="${s.name === user.name ? 'background: var(--bg-secondary);' : ''}">
                    <td class="rank-cell rank-${i + 1}">${i + 1}</td>
                    <td class="name-cell" style="font-weight: 700;">${Utils.escapeHtml(s.name)}</td>
                    <td class="mono" style="color:var(--text-muted); text-transform:uppercase;">${Utils.escapeHtml(s.group || '—')}</td>
                    <td class="score-cell">${s.avgScore}%</td>
                    <td class="mono" style="text-align:right;">${s.testsCompleted}</td>
                    <td class="time-cell">${Utils.formatTime(s.totalTime)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    })();
  </script>
</body>

</html>
