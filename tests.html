<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Challenge // TestArena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .user-header-block {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Utils.requireAuth();
      if (!user) return;

      render();

      function render() {
        // Header
        const headerHtml = `
          <header style="padding: 30px 0; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap; gap:20px;">
            <div style="font-size: clamp(2rem, 8vw, 3rem); font-weight: 900; color: white; text-shadow: 0 4px 0 rgba(0,0,0,0.2); letter-spacing:-1px;">
              TEST ARENA
            </div>
            <div class="user-header-block">
              <div style="text-align:right; color:white;">
                <div style="font-weight:900; font-size:1.1rem;">${Utils.escapeHtml(user.name)}</div>
                <div style="font-size:0.8rem; opacity:0.8; font-weight:700;">${Utils.escapeHtml(user.group || 'Player')}</div>
              </div>
              <div class="avatar" style="width:50px; height:50px; font-size:1.5rem; border:3px solid white; box-shadow:none; margin:0;">${user.name.charAt(0).toUpperCase()}</div>
              <button onclick="Storage.logout()" class="btn btn-danger" style="padding: 10px 20px; font-size:0.9rem; margin-left:10px; border-width:2px;">Quit</button>
            </div>
          </header>
        `;

        const tests = Storage.getTests();
        const userResults = Storage.getUserResults(user.name);
        const completedTestIds = new Set(userResults.map(r => r.testId));

        // Colors for cards to cycle through
        const colors = ['var(--red)', 'var(--blue)', 'var(--yellow)', 'var(--green)'];

        document.getElementById('app').innerHTML = `
          ${headerHtml}
          <div class="fade-in">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px;">
              <h2 style="text-align:left; margin:0; font-size:clamp(1.5rem, 5vw, 2.5rem); text-shadow:none; line-height:1; color:white; opacity:0.9;">Challenges</h2>
              
              <a href="battle.html" class="btn btn-warning" style="font-size:1.1rem; padding:15px 30px; transform:rotate(-2deg); box-shadow: 0 6px 0 var(--yellow-shadow); border:none; border-bottom:5px solid var(--yellow-shadow); color:var(--text-main);">
                <span class="shape-icon shape-triangle" style="background:#333; width:20px; height:20px; vertical-align:middle; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); margin-right:10px;"></span>
                BATTLE MODE
              </a>
            </div>

            ${tests.length === 0 ? `
              <div class="card empty-state" style="text-align:center; padding: 80px;">
                <div style="font-size:6rem; margin-bottom:20px; opacity:0.3;">?</div>
                <p style="font-size:2rem; font-weight:800; color:#888;">No challenges available yet!</p>
              </div>
            ` : `
              <div class="test-grid">
                ${tests.map((test, index) => {
          const completed = completedTestIds.has(test.id);
          const myResult = userResults.find(r => r.testId === test.id);
          // Fixed logic: find result matches test id
          const myTestResult = userResults.find(r => r.testId === test.id);
          const color = colors[index % colors.length];

          // Score badge
          let scoreBadge = '';
          if (completed && myTestResult) {
            const score = myTestResult.score;
            const badgeColor = score >= 90 ? 'var(--yellow)' : score >= 70 ? 'var(--green)' : 'var(--red)';
            scoreBadge = `<div style="position:absolute; top:-15px; right:-10px; background:${badgeColor}; color:white; font-weight:900; padding:8px 15px; border-radius:20px; box-shadow:0 4px 0 rgba(0,0,0,0.2); transform:rotate(5deg); font-family:var(--font-display); z-index:10; border:2px solid white;">${score}%</div>`;
          }

          return `
                    <div class="card" style="border-top: 12px solid ${color}; padding: 30px; display:flex; flex-direction:column; justify-content:space-between; min-height:280px; transition:transform 0.2s; position:relative;">
                      ${scoreBadge}
                      <div style="margin-bottom:20px;">
                        <h3 style="font-size:1.7rem; font-weight:900; margin-bottom:15px; color:#222; line-height:1.2;">${Utils.escapeHtml(test.title)}</h3>
                        <div style="display:flex; gap:10px; font-size:0.9rem; color:#666; font-weight:800; flex-wrap:wrap;">
                          <span style="background:#f4f4f4; padding:8px 12px; border-radius:8px;">${test.questions.length} Qs</span>
                          <span style="background:#f4f4f4; padding:8px 12px; border-radius:8px;">${Utils.formatTime(test.timeLimit)}</span>
                        </div>
                      </div>
                      
                      <div style="display:grid; grid-template-columns: 1fr auto; gap: 15px;">
                        <button onclick="startTest('${test.id}')" class="btn" style="background:${color}; color:white; width:100%; border-bottom-color: rgba(0,0,0,0.2);">
                          ${completed ? 'Replay' : 'Play'}
                        </button>
                        <a href="leaderboard.html?test=${test.id}" class="btn btn-outline" style="padding:0 20px;" title="Leaderboard">
                          <span style="font-size:1.4rem;">🏆</span>
                        </a>
                      </div>
                    </div>
                  `;
        }).join('')}
              </div>
            `}
          </div>
        `;
      }

      window.startTest = function (testId) { window.location.href = `test.html?id=${testId}`; };
    })();
  </script>
</body>

</html>
