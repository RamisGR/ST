<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestArena - Game Lobby</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="center-content">
  <div id="app" class="container">
    <div class="hero fade-in">
      <h1>TestArena</h1>
      <div class="card" style="max-width: 400px; margin: 0 auto; transform: rotate(-1deg);">
        <div style="text-align:center; color: #888; font-weight: 700; margin-bottom: 20px; text-transform:uppercase;">
          Enter Nickname
        </div>

        <form id="loginForm">
          <div class="form-group">
            <input type="text" id="username" class="form-control" placeholder="Nickname" required maxlength="15"
              autocomplete="off" style="font-size: 1.5rem; text-align:center;">
          </div>
          <div class="form-group">
            <input type="text" id="group" class="form-control" placeholder="Group (Optional)" maxlength="10"
              autocomplete="off" style="text-align:center;">
          </div>
          <button type="submit" class="btn btn-block btn-primary" style="font-size: 1.2rem; padding: 20px;">Enter
            Lobby</button>
        </form>
      </div>

      <div style="margin-top: 30px; text-align: center;">
        <a href="admin.html"
          style="color: rgba(255,255,255,0.5); font-weight: 700; font-size: 0.9rem; text-decoration: none; border: none;">Teacher
          Login &rarr;</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Check if logged in
    const user = Storage.getUser();
    if (user) {
      window.location.href = 'tests.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('username').value.trim();
      const group = document.getElementById('group').value.trim();

      if (name) {
        Storage.setUser({ name, group, role: 'student' });
        window.location.href = 'tests.html';
      }
    });
  </script>
</body>

</html>
