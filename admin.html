<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin_Console // TestArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="app" class="container"></div>

  <!-- Modal for confirmation -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal">
      <div class="card-header">
        <span>CONFIRM ACTION</span>
        <span style="color:var(--danger)">CAUTION</span>
      </div>
      <h2 id="modalTitle" style="margin-bottom: var(--gap); font-size: 2rem;">Confirm?</h2>
      <p id="modalText" class="mono" style="margin-bottom: var(--gap);"></p>
      <div class="modal-actions" style="display:flex; gap:12px; justify-content: flex-end;">
        <button id="modalCancel" class="btn btn-outline">CANCEL</button>
        <button id="modalConfirm" class="btn"
          style="background:var(--danger); color:white; border:none;">EXECUTE</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Utils.requireAuth();
      if (!user || user.role !== 'admin') {
        window.location.href = 'index.html';
        return;
      }

      let currentTab = 'tests'; // 'tests' | 'editor' | 'results' | 'settings'
      let editingTest = null;

      render();

      function render() {
        // Custom Header for Admin
        const headerHtml = `
          <header style="padding: 24px 0; border-bottom: 2px solid var(--text); margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; text-transform: uppercase;">
              TestArena <span style="color: var(--primary)">//</span> ADMIN
            </div>
            <div style="font-family: var(--font-mono); font-size: 0.9rem;">
              OPERATOR: ${Utils.escapeHtml(user.name)}
              <a href="#" onclick="Storage.logout()" style="margin-left: 12px; color: var(--danger); border-bottom: 1px solid currentColor;">LOGOUT</a>
            </div>
          </header>
        `;

        document.getElementById('app').innerHTML = `
          ${headerHtml}
          <div class="fade-in">
            <div class="tabs">
              <button class="tab ${currentTab === 'tests' ? 'active' : ''}" onclick="switchTab('tests')">TEST_MODULES</button>
              <button class="tab ${currentTab === 'editor' ? 'active' : ''}" onclick="switchTab('editor')">
                ${editingTest ? 'EDIT_MODE' : 'CREATE_NEW'}
              </button>
              <button class="tab ${currentTab === 'results' ? 'active' : ''}" onclick="switchTab('results')">DATA_LOGS</button>
              <button class="tab ${currentTab === 'settings' ? 'active' : ''}" onclick="switchTab('settings')">SYSTEM</button>
            </div>

            <div id="tabContent"></div>
          </div>
        `;

        switch (currentTab) {
          case 'tests': renderTestsList(); break;
          case 'editor': renderEditor(); break;
          case 'results': renderResults(); break;
          case 'settings': renderSettings(); break;
        }
      }

      window.switchTab = function (tab) {
        currentTab = tab;
        if (tab === 'editor' && !editingTest) {
          editingTest = createEmptyTest();
        }
        render();
      };

      // ——— Tests List ———
      function renderTestsList() {
        const tests = Storage.getTests();
        document.getElementById('tabContent').innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <p class="mono" style="color:var(--text-muted);">TOTAL_MODULES: <span style="color:var(--text); font-weight:700;">${tests.length}</span></p>
            <button onclick="createNewTest()" class="btn">+ INITIALIZE TEST</button>
          </div>
          ${tests.length === 0 ? `
            <div class="empty-state">
              <div class="empty-state-icon">!</div>
              <p>NO MODULES FOUND. INITIALIZE NEW SEQUENCE.</p>
            </div>
          ` : `
            <div class="test-grid" style="border-top: none; padding-top: 0;">
              ${tests.map(test => {
          const results = Storage.getResultsForTest(test.id);
          return `
                  <div class="test-card">
                    <div>
                      <div class="test-card-title" style="font-size: 1.5rem;">${Utils.escapeHtml(test.title)}</div>
                      <div class="test-card-meta" style="flex-direction: column; gap: 4px; border-top:none; margin: 12px 0;">
                        <span>Q_COUNT: ${test.questions.length}</span>
                        <span>T_LIMIT: ${Utils.formatTime(test.timeLimit)}</span>
                        <span>ATTEMPTS: ${results.length}</span>
                      </div>
                    </div>
                    <div class="test-card-actions" style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                      <button onclick="editTest('${test.id}')" class="btn btn-outline" style="padding: 8px;">EDIT</button>
                      <button onclick="confirmDeleteTest('${test.id}', '${Utils.escapeHtml(test.title).replace(/'/g, "\\'")}')" class="btn btn-outline" style="padding: 8px; color: var(--danger); border-color: var(--danger);">DELETE</button>
                    </div>
                  </div>
                `;
        }).join('')}
            </div>
          `}
        `;
      }

      window.createNewTest = function () {
        editingTest = createEmptyTest();
        currentTab = 'editor';
        render();
      };

      window.editTest = function (id) {
        editingTest = JSON.parse(JSON.stringify(Storage.getTest(id)));
        currentTab = 'editor';
        render();
      };

      window.confirmDeleteTest = function (id, title) {
        showConfirmModal(`DELETE MODULE "${title}"?`, 'IRREVERSIBLE DATA LOSS. CONFIRM DELETION.', () => {
          Storage.deleteTest(id);
          Utils.showNotification('MODULE DELETED', 'success');
          render();
        });
      };

      // ——— Editor ———
      function createEmptyTest() {
        return {
          id: Storage.generateId(),
          title: '',
          description: '',
          timeLimit: 300,
          createdAt: Date.now(),
          questions: [createEmptyQuestion()],
        };
      }

      function createEmptyQuestion() {
        return {
          id: Storage.generateId(),
          text: '',
          options: ['', '', '', ''],
          correct: 0,
        };
      }

      function renderEditor() {
        if (!editingTest) return;
        const t = editingTest;
        document.getElementById('tabContent').innerHTML = `
          <div class="card">
            <div class="card-header">
              <span>MODULE CONFIGURATION</span>
              <span>ID: ${t.id.substring(0, 8)}</span>
            </div>
            <div class="form-group">
              <label>Designation (Title)</label>
              <input type="text" id="testTitle" class="form-control" value="${Utils.escapeHtml(t.title)}" placeholder="e.g. JS_BASICS_V1">
            </div>
            <div class="form-group">
              <label>Briefing (Description)</label>
              <textarea id="testDesc" class="form-control" rows="2" style="font-size: 1rem; font-family: var(--font-body);">${Utils.escapeHtml(t.description || '')}</textarea>
            </div>
            <div class="form-group">
              <label>Time Constraint (Seconds)</label>
              <input type="number" id="testTime" class="form-control" value="${t.timeLimit}" min="30" max="7200" style="max-width:200px;">
            </div>
          </div>

          <h3 style="margin-bottom:24px; border-bottom: 2px solid var(--text); padding-bottom: 12px;">Data Points (${t.questions.length})</h3>

          <div id="questionsList">
            ${t.questions.map((q, qi) => renderQuestionEditor(q, qi)).join('')}
          </div>

          <button onclick="addQuestion()" class="btn btn-outline btn-block" style="margin:24px 0;">
            + APPEND DATA POINT
          </button>

          <div style="display:grid; grid-template-columns: 2fr 1fr; gap:12px; margin-top:40px; padding-top: 20px; border-top: 2px solid var(--text);">
            <button onclick="saveTest()" class="btn" style="background: var(--primary); color: white;">SAVE MODULE</button>
            <button onclick="switchTab('tests')" class="btn btn-outline">DISCARD</button>
          </div>
        `;

        document.getElementById('testTitle').addEventListener('input', (e) => { editingTest.title = e.target.value; });
        document.getElementById('testDesc').addEventListener('input', (e) => { editingTest.description = e.target.value; });
        document.getElementById('testTime').addEventListener('input', (e) => { editingTest.timeLimit = parseInt(e.target.value) || 300; });
      }

      function renderQuestionEditor(q, qi) {
        return `
          <div class="card" data-qi="${qi}" style="box-shadow: none; border-color: #E5E5E5;">
            <div class="card-header" style="border-bottom: 1px solid #E5E5E5; margin-bottom: 12px; padding-bottom: 8px;">
              <span>POINT_${qi + 1}</span>
              ${editingTest.questions.length > 1 ? `
                <button class="remove-question-btn" onclick="removeQuestion(${qi})" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:700;">REMOVE</button>
              ` : ''}
            </div>
            <div class="form-group">
              <input type="text" class="form-control q-text" data-qi="${qi}"
                     value="${Utils.escapeHtml(q.text)}" placeholder="Query Text..." style="font-size: 1.2rem;">
            </div>
            <div class="options-editor">
              ${q.options.map((opt, oi) => `
                <div class="option-editor-row" style="margin-bottom: 8px;">
                  <input type="radio" name="correct_${qi}" value="${oi}" ${q.correct === oi ? 'checked' : ''}
                         onchange="setCorrect(${qi}, ${oi})" style="width: 24px; height: 24px; accent-color: var(--primary);">
                  <input type="text" class="form-control q-option" data-qi="${qi}" data-oi="${oi}"
                         value="${Utils.escapeHtml(opt)}" placeholder="Option ${String.fromCharCode(65 + oi)}" style="font-size: 1rem; padding: 12px;">
                  <span class="correct-label mono" style="width: 30px; text-align: center;">${q.correct === oi ? 'TRUE' : ''}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      document.addEventListener('input', (e) => {
        if (e.target.classList.contains('q-text')) {
          const qi = parseInt(e.target.dataset.qi);
          if (editingTest && editingTest.questions[qi]) {
            editingTest.questions[qi].text = e.target.value;
          }
        }
        if (e.target.classList.contains('q-option')) {
          const qi = parseInt(e.target.dataset.qi);
          const oi = parseInt(e.target.dataset.oi);
          if (editingTest && editingTest.questions[qi]) {
            editingTest.questions[qi].options[oi] = e.target.value;
          }
        }
      });

      window.setCorrect = function (qi, oi) {
        if (editingTest && editingTest.questions[qi]) editingTest.questions[qi].correct = oi;
        renderEditor();
      };
      window.addQuestion = function () {
        editingTest.questions.push(createEmptyQuestion());
        renderEditor();
        const list = document.getElementById('questionsList');
        if (list) list.lastElementChild.scrollIntoView({ behavior: 'smooth' });
      };
      window.removeQuestion = function (qi) {
        editingTest.questions.splice(qi, 1);
        renderEditor();
      };
      window.saveTest = function () {
        const t = editingTest;
        if (!t.title.trim()) { Utils.showNotification('TITLE_REQUIRED', 'error'); return; }
        if (t.questions.some(q => !q.text.trim())) { Utils.showNotification('MISSING_QUERY_TEXT', 'error'); return; }
        if (t.questions.some(q => q.options.some(o => !o.trim()))) { Utils.showNotification('INCOMPLETE_OPTIONS', 'error'); return; }
        Storage.saveTest(t);
        Utils.showNotification('MODULE_SAVED', 'success');
        editingTest = null;
        currentTab = 'tests';
        render();
      };

      // ——— Results ———
      function renderResults() {
        const tests = Storage.getTests();
        const allResults = Storage.getResults();

        document.getElementById('tabContent').innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <p class="mono">TOTAL_RECORDS: ${allResults.length}</p>
            ${allResults.length > 0 ? `
              <button onclick="confirmClearResults()" class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);">PURGE ALL DATA</button>
            ` : ''}
          </div>

          ${tests.map(test => {
          const results = Storage.getResultsForTest(test.id);
          if (results.length === 0) return '';
          return `
              <div class="card" style="margin-bottom:24px;">
                <div class="card-header">
                  <span>${Utils.escapeHtml(test.title)}</span>
                  <span>COUNT: ${results.length}</span>
                </div>
                <table class="leaderboard-table">
                  <thead>
                    <tr>
                      <th style="text-align:center;">RANK</th>
                      <th>IDENTIFIER</th>
                      <th>UNIT</th>
                      <th style="text-align:right;">RATING</th>
                      <th style="text-align:right;">TIME</th>
                      <th style="text-align:right;">TIMESTAMP</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${results.map((r, i) => `
                      <tr>
                        <td class="rank-cell rank-${i + 1}">${i + 1}</td>
                        <td class="name-cell">${Utils.escapeHtml(r.userName)}</td>
                        <td class="mono" style="color:var(--text-muted);">${Utils.escapeHtml(r.userGroup || '—')}</td>
                        <td class="score-cell">${r.score}%</td>
                        <td class="time-cell">${Utils.formatTime(r.timeSpent)}</td>
                        <td class="mono" style="color:var(--text-muted); text-align:right; font-size:0.85rem;">${new Date(r.completedAt).toLocaleDateString()}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
        }).join('') || '<div class="empty-state"><div class="empty-state-icon">!</div><p>NO DATA RECORDS</p></div>'}
        `;
      }

      window.confirmClearResults = function () {
        showConfirmModal('PURGE ALL DATA?', 'IRREVERSIBLE. CONFIRM.', () => {
          Storage.clearAllResults();
          Utils.showNotification('DATABASE PURGED', 'success');
          render();
        });
      };

      // ——— Settings ———
      function renderSettings() {
        const currentPassword = localStorage.getItem('ct_admin_password') || 'admin';
        document.getElementById('tabContent').innerHTML = `
          <div class="card" style="max-width:500px;">
            <div class="card-header">SYSTEM CONFIG</div>
            <div class="form-group">
              <label>Administrator Key</label>
              <input type="text" id="adminPass" class="form-control" value="${Utils.escapeHtml(currentPassword)}">
            </div>
            <button onclick="saveSettings()" class="btn btn-block">SAVE CONFIG</button>

            <div style="margin-top:40px; padding-top:20px; border-top:2px solid var(--danger);">
              <h3 style="margin-bottom:12px; color:var(--danger); font-family:var(--font-mono);">DANGER ZONE</h3>
              <button onclick="confirmResetAll()" class="btn btn-block" style="background:var(--danger); color:white;">FACTORY RESET</button>
            </div>
          </div>
        `;
      }

      window.saveSettings = function () {
        const pass = document.getElementById('adminPass').value.trim();
        if (!pass) { Utils.showNotification('KEY_REQUIRED', 'error'); return; }
        localStorage.setItem('ct_admin_password', pass);
        Utils.showNotification('CONFIG SAVED', 'success');
      };

      window.confirmResetAll = function () {
        showConfirmModal('FACTORY RESET?', 'COMPLETE SYSTEM WIPE. CONFIRM.', () => {
          Storage.resetAllData();
          Utils.showNotification('SYSTEM RESET', 'success');
          render();
        });
      };

      function showConfirmModal(title, text, onConfirm) {
        const modal = document.getElementById('confirmModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalText').textContent = text;
        modal.classList.add('active');
        const confirmBtn = document.getElementById('modalConfirm');
        const cancelBtn = document.getElementById('modalCancel');
        const cleanup = () => {
          modal.classList.remove('active');
          confirmBtn.replaceWith(confirmBtn.cloneNode(true));
          cancelBtn.replaceWith(cancelBtn.cloneNode(true));
        };
        document.getElementById('modalConfirm').addEventListener('click', () => { cleanup(); onConfirm(); });
        document.getElementById('modalCancel').addEventListener('click', cleanup);
        modal.addEventListener('click', (e) => { if (e.target === modal) cleanup(); });
      }
    })();
  </script>
</body>

</html>
