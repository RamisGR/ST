<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master // TestArena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-header {
      background: #333;
      color: white;
      padding: 15px 30px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: white;
      font-weight: 800;
      color: #888;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      text-transform: uppercase;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
    }

    .tab-btn.active {
      background: var(--blue);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--blue-shadow);
    }

    .editor-section {
      background: white;
      padding: 30px;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
    }

    .q-card {
      background: #f9f9f9;
      padding: 20px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 2px solid #eee;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body class="center-content">
  <div id="app" class="container" style="max-width:1000px;"></div>

  <!-- Modal for confirmation -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal">
      <div class="card-header"
        style="background:var(--red); color:white; padding:10px 20px; border-radius:10px 10px 0 0; font-weight:900;">
        CONFIRM ACTION
      </div>
      <div style="padding:20px;">
        <h2 id="modalTitle" style="margin-bottom: 15px; font-size: 1.5rem; color:#333;">Confirm?</h2>
        <p id="modalText" style="margin-bottom: 25px; color:#666; font-size:1.1rem;"></p>
        <div class="modal-actions" style="display:flex; gap:12px; justify-content: flex-end;">
          <button id="modalCancel" class="btn btn-outline" style="color:#555; border-color:#ccc;">Cancel</button>
          <button id="modalConfirm" class="btn btn-danger">Yes, I'm sure</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <!-- SheetJS for Excel import -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();

    // Initialize Firebase Storage for image uploads
    window.firebaseStorage = null;
    try {
      if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
        window.firebaseStorage = firebase.storage();
      }
    } catch (e) { console.warn('[TestArena] Firebase Storage unavailable:', e.message); }

    (function () {
      // Check if already admin
      let user = Storage.getUser();

      if (user && user.role === 'admin') {
        // Already logged in as admin, proceed
        initAdmin(user);
      } else {
        // Show admin login form
        showAdminLogin();
      }

      function showAdminLogin() {
        document.getElementById('app').innerHTML = `
          <div class="fade-in" style="text-align:center; max-width:400px; width:90%; margin:0 auto;">
            <h1 style="font-size:clamp(2rem, 5vw, 3rem); margin-bottom:10px; color:white; text-shadow:0 4px 0 rgba(0,0,0,0.2);">GAME MASTER</h1>
            <p style="color:rgba(255,255,255,0.7); margin-bottom:30px; font-weight:700;">Teacher Console Access</p>
            
            <div class="card" style="border-top:12px solid var(--yellow); padding:30px; text-align:left;">
                <div class="form-group">
                  <label>Your Name</label>
                  <input type="text" id="adminName" class="form-control" placeholder="Teacher name"
                    value="${user ? Utils.escapeHtml(user.name) : ''}" style="text-align:center; font-weight:700;">
                </div>
                <div class="form-group">
                  <label>Admin Password</label>
                  <input type="password" id="adminPassword" class="form-control" placeholder="Enter password"
                    style="text-align:center; font-weight:700; letter-spacing:3px;">
                </div>
                <button type="button" id="adminLoginBtn" class="btn btn-block" style="background:var(--yellow); color:#333; font-size:1.2rem; padding:18px; border-bottom:5px solid var(--yellow-shadow);">
                  Enter Console
                </button>
              <div id="loginError" style="color:white; font-weight:700; text-align:center; margin-top:15px; padding:12px; border-radius:8px; background:var(--red); display:none;"></div>
            </div>

            <a href="${user ? 'tests.html' : 'index.html'}" class="btn" style="background:rgba(255,255,255,0.1); border:none; color:rgba(255,255,255,0.6); margin-top:20px; font-size:0.9rem;">${user ? 'Back to Lobby' : 'Back to Login'}</a>
          </div>
        `;

        function tryAdminLogin() {
          const name = document.getElementById('adminName').value.trim();
          const pass = document.getElementById('adminPassword').value.trim();

          if (!name) {
            showLoginError('Enter your name');
            return;
          }
          if (!pass) {
            showLoginError('Enter password');
            return;
          }

          const correctPass = localStorage.getItem('ct_admin_password') || 'admin';

          if (pass === correctPass) {
            user = { name, role: 'admin' };
            Storage.setUser(user);
            initAdmin(user);
          } else {
            showLoginError('Wrong password!');
          }
        }

        function showLoginError(msg) {
          const errEl = document.getElementById('loginError');
          errEl.textContent = msg;
          errEl.style.display = 'block';
          errEl.style.animation = 'none';
          errEl.offsetHeight;
          errEl.style.animation = 'popIn 0.3s';
        }

        document.getElementById('adminLoginBtn').addEventListener('click', tryAdminLogin);
        document.getElementById('adminPassword').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') tryAdminLogin();
        });
      }

      function initAdmin(user) {
        let currentTab = 'tests';
        let editingTest = null;

        function render() {
          // Custom Header for Admin
          const headerHtml = `
          <div class="admin-header">
            <div style="font-weight: 900; font-size: 1.4rem; text-transform: uppercase; letter-spacing:1px;">
              TEST ARENA <span style="opacity:0.5; margin:0 5px;">//</span> <span style="color:var(--yellow);">GAME MASTER</span>
            </div>
            <div style="font-weight: 700; font-size: 0.9rem; display:flex; align-items:center; gap:15px;">
              <span>${Utils.escapeHtml(user.name)}</span>
              <button onclick="Storage.logout()" class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.3); padding:5px 15px; font-size:0.8rem;">LOGOUT</button>
            </div>
          </div>
        `;

          document.getElementById('app').innerHTML = `
          ${headerHtml}
          <div class="fade-in">
            <nav class="tab-nav">
              <button class="tab-btn ${currentTab === 'tests' ? 'active' : ''}" onclick="switchTab('tests')">Challenges</button>
              <button class="tab-btn ${currentTab === 'editor' ? 'active' : ''}" onclick="switchTab('editor')">
                ${editingTest ? 'Edit Challenge' : 'Create New'}
              </button>
              <button class="tab-btn ${currentTab === 'results' ? 'active' : ''}" onclick="switchTab('results')">Results</button>
              <button class="tab-btn ${currentTab === 'settings' ? 'active' : ''}" onclick="switchTab('settings')">Settings</button>
            </nav>

            <div id="tabContent"></div>
          </div>
        `;

          switch (currentTab) {
            case 'tests': renderTestsList(); break;
            case 'editor': renderEditor(); break;
            case 'results': renderResults(); break;
            case 'settings': renderSettings(); break;
          }
        }

        window.switchTab = function (tab) {
          currentTab = tab;
          if (tab === 'editor' && !editingTest) {
            editingTest = createEmptyTest();
          }
          render();
        };

        // ——— Tests List ———
        function renderTestsList() {
          const tests = Storage.getTests();
          document.getElementById('tabContent').innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px;">
            <p style="color:#666; font-weight:700;">Total Challenges: ${tests.length}</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button onclick="document.getElementById('excelImportInput').click()" class="btn btn-outline" style="padding:10px 16px; font-size:0.9rem; background:#f0fff4; border-color:var(--green); color:var(--green);">
                &#x1F4CA; Import Excel
              </button>
              <input type="file" id="excelImportInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importFromExcel(this)">
              <button onclick="createNewTest()" class="btn btn-primary" style="padding:10px 20px;">+ New Challenge</button>
            </div>
          </div>
          ${tests.length === 0 ? `
            <div class="empty-state card" style="text-align:center; padding:50px;">
              <div style="font-size:4rem; margin-bottom:10px;">📭</div>
              <p style="font-size:1.5rem; font-weight:700; color:#555;">No challenges found.</p>
              <p style="color:#888;">Create your first challenge to get started!</p>
            </div>
          ` : `
            <div style="display:grid; gap:20px;">
              ${tests.map(test => {
            const results = Storage.getResultsForTest(test.id);
            return `
                  <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; padding:20px;">
                    <div>
                      <h3 style="margin:0 0 5px 0; font-size:1.3rem; color:#333;">${Utils.escapeHtml(test.title)}</h3>
                      <div style="font-size:0.9rem; color:#888; font-weight:600;">
                        ${test.questions.length} Questions • ${Utils.formatTime(test.timeLimit)} • ${results.length} Attempts
                      </div>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                      <button onclick="previewTest('${test.id}')" class="btn btn-outline" style="padding:8px 15px; background:#f0f9ff; border-color:var(--blue); color:var(--blue);">&#9654; Preview</button>
                      <button onclick="startBattle('${test.id}')" class="btn btn-outline" style="padding:8px 15px; background:#fff8e1; border-color:#f59e0b; color:#b45309;">&#9876; Battle</button>
                      <button onclick="editTest('${test.id}')" class="btn btn-outline" style="padding: 8px 15px;">Edit</button>
                      <button onclick="confirmDeleteTest('${test.id}', '${Utils.escapeHtml(test.title).replace(/'/g, "\\'")}')" class="btn btn-danger" style="padding: 8px 15px;">Delete</button>
                    </div>
                  </div>
                `;
          }).join('')}
            </div>
          `}
        `;
        }

        window.previewTest = function (testId) {
          window.open('test.html?id=' + testId, '_blank');
        };

        window.startBattle = function (testId) {
          window.open('battle.html?test=' + testId, '_blank');
        };

        window.createNewTest = function () {
          editingTest = createEmptyTest();
          currentTab = 'editor';
          render();
        };

        window.editTest = function (id) {
          editingTest = JSON.parse(JSON.stringify(Storage.getTest(id)));
          currentTab = 'editor';
          render();
        };

        window.confirmDeleteTest = function (id, title) {
          showConfirmModal(`Delete "${title}"?`, 'This cannot be undone. All results for this challenge will also be lost.', () => {
            Storage.deleteTest(id);
            Utils.showNotification('Challenge deleted!', 'success');
            render();
          });
        };

        // ——— Editor ———
        function createEmptyTest() {
          return {
            id: Storage.generateId(),
            title: '',
            description: '',
            timeLimit: 300,
            createdAt: Date.now(),
            questions: [createEmptyQuestion()],
          };
        }

        function createEmptyQuestion() {
          return {
            id: Storage.generateId(),
            text: '',
            options: ['', '', '', ''],
            correct: 0,
          };
        }

        function renderEditor() {
          if (!editingTest) return;
          // Expose references so global image-upload handlers can access closure state
          window._editingTestRef = editingTest;
          window._rerenderEditor = renderEditor;
          const t = editingTest;
          document.getElementById('tabContent').innerHTML = `
          <div class="editor-section">
            <h2 style="margin-bottom:20px; color:#333;">Challenge Settings</h2>
            <div class="form-group">
              <label>Title</label>
              <input type="text" id="testTitle" class="form-control" value="${Utils.escapeHtml(t.title)}" placeholder="e.g. History Trivia" style="font-weight:700;">
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="testDesc" class="form-control" rows="2" placeholder="Brief instruction...">${Utils.escapeHtml(t.description || '')}</textarea>
            </div>
            <div class="form-group">
              <label>Time Limit (Seconds)</label>
              <input type="number" id="testTime" class="form-control" value="${t.timeLimit}" min="30" max="7200" style="max-width:150px;">
            </div>
          

            <h2 style="margin:40px 0 20px; color:#333; display:flex; justify-content:space-between; align-items:center;">
              <span>Questions (${t.questions.length})</span>
              <button onclick="addQuestion()" class="btn btn-success" style="padding:8px 15px; font-size:0.9rem;">+ Add Question</button>
            </h2>

            <div id="questionsList">
              ${t.questions.map((q, qi) => renderQuestionEditor(q, qi)).join('')}
            </div>

            <div style="display:flex; justify-content:flex-end; gap:15px; margin-top:40px; padding-top: 20px; border-top: 2px solid #eee;">
               <button onclick="switchTab('tests')" class="btn btn-outline" style="color:#666; border-color:#ccc;">Discard</button>
               <button onclick="saveTest()" class="btn btn-primary" style="padding:12px 30px; font-size:1.1rem;">Save Challenge</button>
            </div>
          </div>
        `;

          document.getElementById('testTitle').addEventListener('input', (e) => { editingTest.title = e.target.value; });
          document.getElementById('testDesc').addEventListener('input', (e) => { editingTest.description = e.target.value; });
          document.getElementById('testTime').addEventListener('input', (e) => { editingTest.timeLimit = parseInt(e.target.value) || 300; });
        }

        function renderQuestionEditor(q, qi) {
          const imgSection = q.imageUrl ? `
            <div id="imgZone_${qi}" class="img-upload-zone">
              <div class="img-preview">
                <img src="${Utils.escapeHtml(q.imageUrl)}" alt="Question image">
                <button class="img-preview-remove" onclick="removeQuestionImage(${qi})" title="Remove image">&times;</button>
              </div>
            </div>
          ` : `
            <div id="imgZone_${qi}" class="img-upload-zone">
              <div class="img-drop-area"
                   onclick="document.getElementById('imgFileInput_${qi}').click()"
                   ondragover="event.preventDefault(); this.classList.add('drag-over')"
                   ondragleave="this.classList.remove('drag-over')"
                   ondrop="event.preventDefault(); this.classList.remove('drag-over'); handleImgDrop(event, ${qi})">
                <span class="img-drop-icon">&#x1F5BC;</span>
                <strong style="display:block;">Add Image (optional)</strong>
                <span class="img-drop-hint">Click or drag &amp; drop &middot; PNG, JPG, GIF, WebP</span>
              </div>
              <input type="file" accept="image/*" id="imgFileInput_${qi}" style="display:none" onchange="handleImgUpload(this, ${qi})">
            </div>
          `;

          return `
          <div class="q-card" data-qi="${qi}">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
              <span style="font-weight:800; color:#888;">Question ${qi + 1}</span>
              ${editingTest.questions.length > 1 ? `
                <button onclick="removeQuestion(${qi})" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:700;">Remove</button>
              ` : ''}
            </div>
            <div class="form-group">
              <input type="text" class="form-control q-text" data-qi="${qi}"
                     value="${Utils.escapeHtml(q.text)}" placeholder="Enter question text here..." style="font-weight:600;">
            </div>
            ${imgSection}
            <div class="options-editor" style="margin-top:16px;">
              ${q.options.map((opt, oi) => `
                <div class="option-row">
                  <input type="radio" name="correct_${qi}" value="${oi}" ${q.correct === oi ? 'checked' : ''}
                         onchange="setCorrect(${qi}, ${oi})" style="width: 20px; height: 20px; accent-color: var(--green); cursor:pointer;">
                  <input type="text" class="form-control q-option" data-qi="${qi}" data-oi="${oi}"
                         value="${Utils.escapeHtml(opt)}" placeholder="Option ${String.fromCharCode(65 + oi)}" style="border:1px solid ${q.correct === oi ? 'var(--green)' : '#ddd'};">
                </div>
              `).join('')}
            </div>
          </div>
        `;
        }

        document.addEventListener('input', (e) => {
          if (e.target.classList.contains('q-text')) {
            const qi = parseInt(e.target.dataset.qi);
            if (editingTest && editingTest.questions[qi]) {
              editingTest.questions[qi].text = e.target.value;
            }
          }
          if (e.target.classList.contains('q-option')) {
            const qi = parseInt(e.target.dataset.qi);
            const oi = parseInt(e.target.dataset.oi);
            if (editingTest && editingTest.questions[qi]) {
              editingTest.questions[qi].options[oi] = e.target.value;
            }
          }
        });

        window.setCorrect = function (qi, oi) {
          if (editingTest && editingTest.questions[qi]) editingTest.questions[qi].correct = oi;
          renderEditor();
        };
        window.addQuestion = function () {
          editingTest.questions.push(createEmptyQuestion());
          renderEditor();
          setTimeout(() => {
            const list = document.getElementById('questionsList');
            if (list) list.lastElementChild.scrollIntoView({ behavior: 'smooth' });
          }, 100);
        };
        window.removeQuestion = function (qi) {
          editingTest.questions.splice(qi, 1);
          renderEditor();
        };
        window.saveTest = function () {
          const t = editingTest;
          if (!t.title.trim()) { Utils.showNotification('Title is required!', 'error'); return; }
          if (t.questions.some(q => !q.text.trim())) { Utils.showNotification('Some questions are empty!', 'error'); return; }
          if (t.questions.some(q => q.options.some(o => !o.trim()))) { Utils.showNotification('Some options are empty!', 'error'); return; }
          Storage.saveTest(t);
          Utils.showNotification('Challenge Saved Successfully!', 'success');
          editingTest = null;
          currentTab = 'tests';
          render();
        };

        // ——— Results ———
        function renderResults() {
          const tests = Storage.getTests();
          const allResults = Storage.getResults();

          document.getElementById('tabContent').innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <p style="color:#666; font-weight:700;">Total Records: ${allResults.length}</p>
            ${allResults.length > 0 ? `
              <button onclick="confirmClearResults()" class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);">Clear All History</button>
            ` : ''}
          </div>

          ${tests.map(test => {
            const results = Storage.getResultsForTest(test.id);
            if (results.length === 0) return '';
            return `
              <div class="card" style="margin-bottom:30px; padding:0; overflow:hidden;">
                <div class="card-header" style="background:#f9f9f9; padding:15px 20px; font-weight:800; color:#444; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                  <span>${Utils.escapeHtml(test.title)}</span>
                  <span style="background:var(--blue); color:white; padding:2px 8px; border-radius:10px; font-size:0.8rem;">${results.length}</span>
                </div>
                <table class="leaderboard-table" style="width:100%; border-collapse:collapse;">
                  <thead>
                    <tr style="background:white; border-bottom:2px solid #eee; text-align:left; color:#888; font-size:0.9rem;">
                      <th style="padding:12px 20px;">Rank</th>
                      <th style="padding:12px;">Player</th>
                      <th style="padding:12px;">Group</th>
                      <th style="padding:12px; text-align:right;">Score</th>
                      <th style="padding:12px; text-align:right;">Time</th>
                      <th style="padding:12px; text-align:right;">Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${results.map((r, i) => `
                      <tr style="border-bottom:1px solid #f9f9f9;">
                        <td style="padding:12px 20px;"><strong>${i + 1}</strong></td>
                        <td style="padding:12px; color:#333; font-weight:700;">${Utils.escapeHtml(r.userName)}</td>
                        <td style="padding:12px; color:#888;">${Utils.escapeHtml(r.userGroup || '-')}</td>
                        <td style="padding:12px; text-align:right; color:var(--blue); font-weight:800;">${r.score}%</td>
                        <td style="padding:12px; text-align:right; font-family:monospace;">${Utils.formatTime(r.timeSpent)}</td>
                        <td style="padding:12px; text-align:right; color:#999; font-size:0.85rem;">${new Date(r.completedAt).toLocaleDateString()}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
          }).join('') || '<div class="empty-state card" style="text-align:center; padding:40px;"><p>No results recorded yet.</p></div>'}
        `;
        }

        window.confirmClearResults = function () {
          showConfirmModal('Clear All History?', 'This will permanently delete all student results. Challenges will remain.', () => {
            Storage.clearAllResults();
            Utils.showNotification('History cleared!', 'success');
            render();
          });
        };

        // ——— Settings ———
        function renderSettings() {
          const currentPassword = localStorage.getItem('ct_admin_password') || 'admin';
          document.getElementById('tabContent').innerHTML = `
          <div class="card" style="max-width:500px; margin:0 auto; padding:30px;">
            <h2 style="margin-bottom:25px; color:#333;">System Configuration</h2>
            <div class="form-group">
              <label>Admin Password</label>
              <input type="text" id="adminPass" class="form-control" value="${Utils.escapeHtml(currentPassword)}">
            </div>
            <button onclick="saveSettings()" class="btn btn-primary btn-block" style="margin-top:20px;">Save Configuration</button>

            <div style="margin-top:50px; padding-top:25px; border-top:2px solid #eee;">
              <h3 style="margin-bottom:15px; color:var(--danger);">Danger Zone</h3>
              <p style="color:#666; margin-bottom:15px; font-size:0.9rem;">Resetting the system will delete ALL challenges and ALL results. This provides a fresh start.</p>
              <button onclick="confirmResetAll()" class="btn btn-block btn-outline" style="color:var(--danger); border-color:var(--danger);">Factory Reset</button>
            </div>
          </div>
        `;
        }

        window.saveSettings = function () {
          const pass = document.getElementById('adminPass').value.trim();
          if (!pass) { Utils.showNotification('Password required!', 'error'); return; }
          localStorage.setItem('ct_admin_password', pass);
          Utils.showNotification('Settings saved!', 'success');
        };

        window.confirmResetAll = function () {
          showConfirmModal('Factory Reset?', 'WARNING: This will delete ALL challenges and results. Are you sure?', () => {
            Storage.resetAllData();
            Utils.showNotification('System reset successfully', 'success');
            render();
          });
        };

        function showConfirmModal(title, text, onConfirm) {
          const modal = document.getElementById('confirmModal');
          document.getElementById('modalTitle').textContent = title;
          document.getElementById('modalText').textContent = text;
          modal.classList.add('active');

          const confirmBtn = document.getElementById('modalConfirm');
          const cancelBtn = document.getElementById('modalCancel');

          // Clone to remove old listeners
          const newConfirm = confirmBtn.cloneNode(true);
          const newCancel = cancelBtn.cloneNode(true);
          confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
          cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

          const cleanup = () => {
            modal.classList.remove('active');
          };

          newConfirm.addEventListener('click', () => { cleanup(); onConfirm(); });
          newCancel.addEventListener('click', cleanup);
          modal.addEventListener('click', (e) => { if (e.target === modal) cleanup(); });
        }

        // Used by Excel import to open test in editor
        window.openImportedTest = function (test) {
          editingTest = test;
          currentTab = 'editor';
          render();
        };

        render();
      } // end initAdmin

      // ——— Image Upload Helpers (global) ———
      window.handleImgUpload = async function (input, qi) {
        const file = input.files[0];
        if (!file) return;

        const zone = document.getElementById('imgZone_' + qi);
        if (zone) {
          zone.innerHTML = '<div style="padding:14px; text-align:center; color:var(--blue); font-weight:700; background:#e8f0fe; border-radius:var(--radius-md); font-size:0.9rem;">Uploading image\u2026</div>';
        }

        const editingTest = window._editingTestRef;
        if (!editingTest) return;

        const q = editingTest.questions[qi];
        let uploadedViaStorage = false;

        if (window.firebaseStorage) {
          let uploadTask = null;
          try {
            const safeName = file.name.replace(/[^\w.\-]/g, '_');
            const path = 'questions/' + editingTest.id + '/' + q.id + '/' + Date.now() + '_' + safeName;
            const storageRef = window.firebaseStorage.ref(path);
            uploadTask = storageRef.put(file);

            const snapshot = await Promise.race([
              uploadTask,
              new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
            ]);
            const url = await snapshot.ref.getDownloadURL();
            q.imageUrl = url;
            uploadedViaStorage = true;
          } catch (e) {
            if (uploadTask) try { uploadTask.cancel(); } catch (_) {}
            // CORS, timeout or other error — fall back to Base64
            console.warn('[TestArena] Firebase Storage upload failed, falling back to Base64:', e.message);
          }
        }

        if (!uploadedViaStorage) {
          // Base64 fallback: works without CORS configuration
          if (file.size > 500 * 1024) {
            Utils.showNotification('Изображение сохранено локально. Для лучшей производительности используйте файлы < 500KB или настройте Firebase Storage CORS.', 'warning');
          }
          await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (evt) => { q.imageUrl = evt.target.result; resolve(); };
            reader.onerror = () => { Utils.showNotification('Failed to read image', 'error'); resolve(); };
            reader.readAsDataURL(file);
          });
        }

        // Trigger re-render via the exposed render function
        if (window._rerenderEditor) window._rerenderEditor();
      };

      window.handleImgDrop = function (event, qi) {
        const file = event.dataTransfer.files[0];
        if (!file || !file.type.startsWith('image/')) {
          Utils.showNotification('Please drop an image file', 'error');
          return;
        }
        window.handleImgUpload({ files: [file] }, qi);
      };

      window.removeQuestionImage = function (qi) {
        const editingTest = window._editingTestRef;
        if (editingTest && editingTest.questions[qi]) {
          editingTest.questions[qi].imageUrl = null;
          if (window._rerenderEditor) window._rerenderEditor();
        }
      };

      // ——— Excel Import (global) ———
      window.importFromExcel = function (input) {
        const file = input.files[0];
        if (!file) return;
        input.value = '';

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            if (typeof XLSX === 'undefined') {
              alert('Excel library not loaded. Please check your internet connection.');
              return;
            }
            const wb = XLSX.read(e.target.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

            if (!rows || rows.length < 2) {
              alert('The file appears to be empty or has too few rows.');
              return;
            }

            // Row 1: test title (cell A1)
            const testTitle = String(rows[0][0] || '').trim() || 'Imported Test';

            // Auto-detect if row 2 is a header row (column F is not a valid answer)
            let startRow = 1;
            if (rows[1] && !_isValidAnswer(String(rows[1][5] || ''))) {
              startRow = 2;
            }

            const questions = [];
            for (let i = startRow; i < rows.length; i++) {
              const row = rows[i];
              const text = String(row[0] || '').trim();
              if (!text) continue;

              const options = [
                String(row[1] || '').trim(),
                String(row[2] || '').trim(),
                String(row[3] || '').trim(),
                String(row[4] || '').trim(),
              ].filter(o => o);

              if (options.length < 2) continue;

              const correctRaw = String(row[5] || '1').trim().toUpperCase();
              let correct = 0;
              if (['A', 'B', 'C', 'D'].includes(correctRaw)) {
                correct = correctRaw.charCodeAt(0) - 65;
              } else {
                correct = Math.max(0, (parseInt(correctRaw) || 1) - 1);
              }
              correct = Math.min(correct, options.length - 1);

              questions.push({ id: Storage.generateId(), text, options, correct });
            }

            if (questions.length === 0) {
              alert('No valid questions found.\n\nExpected format:\nRow 1: Test title (cell A1)\nRow 2: (optional header)\nRows 3+: Question | Option A | Option B | Option C | Option D | Correct (A/B/C/D or 1/2/3/4)');
              return;
            }

            const test = {
              id: Storage.generateId(),
              title: testTitle,
              description: 'Imported from Excel',
              timeLimit: 300,
              createdAt: Date.now(),
              questions,
            };

            Storage.saveTest(test);
            Utils.showNotification('\u2705 Imported ' + questions.length + ' questions!', 'success');

            if (window.openImportedTest) window.openImportedTest(test);
          } catch (err) {
            alert('Error reading file: ' + err.message);
          }
        };
        reader.onerror = function () { alert('Failed to read the file.'); };
        reader.readAsArrayBuffer(file);
      };

      function _isValidAnswer(val) {
        return /^[ABCD1234]$/i.test(val.trim());
      }
    })();
  </script>
</body>
