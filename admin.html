<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master // TestArena</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-header {
      background: #333;
      color: white;
      padding: 15px 30px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: white;
      font-weight: 800;
      color: #888;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      text-transform: uppercase;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
    }

    .tab-btn.active {
      background: var(--blue);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--blue-shadow);
    }

    .editor-section {
      background: white;
      padding: 30px;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
    }

    .q-card {
      background: #f9f9f9;
      padding: 20px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 2px solid #eee;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    /* Two-column image upload zone */
    .img-drop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 2px dashed #ccc;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #f8f8ff;
      transition: border-color 0.2s, background 0.2s;
    }
    .img-upload-zone.drag-over .img-drop-grid {
      border-color: var(--blue);
      background: rgba(19,104,206,0.05);
    }
    .img-drop-half {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #888;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      gap: 4px;
    }
    .img-drop-half:hover { background: rgba(19,104,206,0.07); color: var(--blue); }
    .img-drop-half--left { border-right: 1px dashed #ddd; }
  </style>
</head>

<body class="center-content">
  <div id="app" class="container" style="max-width:1000px;"></div>

  <!-- Modal for confirmation -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal">
      <div class="card-header"
        style="background:var(--red); color:white; padding:10px 20px; border-radius:10px 10px 0 0; font-weight:900;"
        id="modalHeader">CONFIRM ACTION
      </div>
      <div style="padding:20px;">
        <h2 id="modalTitle" style="margin-bottom: 15px; font-size: 1.5rem; color:#333;">Confirm?</h2>
        <p id="modalText" style="margin-bottom: 25px; color:#666; font-size:1.1rem;"></p>
        <div class="modal-actions" style="display:flex; gap:12px; justify-content: flex-end;">
          <button id="modalCancel" class="btn btn-outline" style="color:#555; border-color:#ccc;">${t('cancel')}</button>
          <button id="modalConfirm" class="btn btn-danger">${t('yes_sure')}</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <!-- SheetJS for Excel import -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();

    // Initialize Firebase Storage for image uploads
    window.firebaseStorage = null;
    try {
      if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
        window.firebaseStorage = firebase.storage();
      }
    } catch (e) { console.warn('[TestArena] Firebase Storage unavailable:', e.message); }

    (function () {
      // Check if already admin
      let user = Storage.getUser();

      if (user && user.role === 'admin') {
        // Already logged in as admin, proceed
        initAdmin(user);
      } else {
        // Show admin login form
        showAdminLogin();
      }

      function showAdminLogin() {
        document.getElementById('app').innerHTML = `
          <div class="fade-in" style="text-align:center; max-width:420px; width:90%; margin:0 auto;">
            <h1 style="font-size:clamp(1.6rem, 4vw, 2.4rem); margin-bottom:10px; color:white; text-shadow:0 4px 0 rgba(0,0,0,0.2); word-break:break-word; overflow-wrap:anywhere; line-height:1.2;">${t('game_master')}</h1>
            <p style="color:rgba(255,255,255,0.7); margin-bottom:30px; font-weight:700; font-size:0.95rem; word-break:break-word; overflow-wrap:anywhere;">${t('console_access')}</p>
            
            <div class="card" style="border-top:12px solid var(--yellow); padding:30px; text-align:left;">
                <div class="form-group">
                  <label>${t('enter_your_name')}</label>
                  <input type="text" id="adminName" class="form-control" placeholder="${t('teacher_name')}"
                    value="${user ? Utils.escapeHtml(user.name) : ''}" style="text-align:center; font-weight:700;">
                </div>
                <div class="form-group">
                  <label>${t('admin_password')}</label>
                  <input type="password" id="adminPassword" class="form-control" placeholder="${t('enter_password')}"
                    style="text-align:center; font-weight:700; letter-spacing:3px;">
                </div>
                <button type="button" id="adminLoginBtn" class="btn btn-block" style="background:var(--yellow); color:#333; font-size:1.2rem; padding:18px; border-bottom:5px solid var(--yellow-shadow);">
                  ${t('enter_console')}
                </button>
              <div id="loginError" style="color:white; font-weight:700; text-align:center; margin-top:15px; padding:12px; border-radius:8px; background:var(--red); display:none;"></div>
            </div>

            <a href="${user ? 'tests.html' : 'index.html'}" class="btn" style="background:rgba(255,255,255,0.1); border:none; color:rgba(255,255,255,0.6); margin-top:20px; font-size:0.9rem;">${user ? t('back_to_lobby') : t('back_to_login')}</a>
          </div>
        `;

        function tryAdminLogin() {
          const name = document.getElementById('adminName').value.trim();
          const pass = document.getElementById('adminPassword').value.trim();

          if (!name) {
            showLoginError(t('enter_your_name'));
            return;
          }
          if (!pass) {
            showLoginError(t('password_required'));
            return;
          }

          const correctPass = localStorage.getItem('ct_admin_password') || 'admin';

          if (pass === correctPass) {
            user = { name, role: 'admin', group: '' };
            Storage.setUser(user);
            initAdmin(user);
          } else {
            showLoginError(t('wrong_password'));
          }
        }

        function showLoginError(msg) {
          const errEl = document.getElementById('loginError');
          errEl.textContent = msg;
          errEl.style.display = 'block';
          errEl.style.animation = 'none';
          errEl.offsetHeight;
          errEl.style.animation = 'popIn 0.3s';
        }

        document.getElementById('adminLoginBtn').addEventListener('click', tryAdminLogin);
        document.getElementById('adminPassword').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') tryAdminLogin();
        });
      }

      function initAdmin(user) {
        let currentTab = 'tests';
        let editingTest = null;

        function render() {
          // Custom Header for Admin
          const headerHtml = `
          <div class="admin-header">
            <div style="font-weight: 900; font-size: 1.4rem; text-transform: uppercase; letter-spacing:1px;">
              TEST ARENA <span style="opacity:0.5; margin:0 5px;">//</span> <span style="color:var(--yellow);">${t('game_master')}</span>
            </div>
            <div style="font-weight: 700; font-size: 0.9rem; display:flex; align-items:center; gap:15px;">
              ${renderLangSwitcher()}
              <span>${Utils.escapeHtml(user.name)}</span>
              <button onclick="Storage.logout()" class="btn btn-outline" style="color:white; border-color:rgba(255,255,255,0.4); background:rgba(255,255,255,0.15); padding:5px 15px; font-size:0.8rem;">${t('logout')}</button>
            </div>
          </div>
        `;

          document.getElementById('app').innerHTML = `
          ${headerHtml}
          <div class="fade-in">
            <nav class="tab-nav">
              <button class="tab-btn ${currentTab === 'tests' ? 'active' : ''}" onclick="switchTab('tests')">${t('tab_challenges')}</button>
              <button class="tab-btn ${currentTab === 'editor' ? 'active' : ''}" onclick="switchTab('editor')">
                ${editingTest ? t('tab_edit') : t('tab_create')}
              </button>
              <button class="tab-btn ${currentTab === 'results' ? 'active' : ''}" onclick="switchTab('results')">${t('tab_results')}</button>
              <button class="tab-btn ${currentTab === 'settings' ? 'active' : ''}" onclick="switchTab('settings')">${t('tab_settings')}</button>
            </nav>

            <div id="tabContent"></div>
          </div>
        `;

          switch (currentTab) {
            case 'tests': renderTestsList(); break;
            case 'editor': renderEditor(); break;
            case 'results': renderResults(); break;
            case 'settings': renderSettings(); break;
          }
        }

        window.switchTab = function (tab) {
          currentTab = tab;
          if (tab === 'editor' && !editingTest) {
            editingTest = createEmptyTest();
          }
          render();
        };

        // ——— Tests List ———
        function renderTestsList() {
          const tests = Storage.getTests();
          document.getElementById('tabContent').innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px;">
            <p style="color:#666; font-weight:700;">${t('total_challenges')}: ${tests.length}</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button onclick="document.getElementById('excelImportInput').click()" class="btn btn-outline" style="padding:10px 16px; font-size:0.9rem; background:#f0fff4; border-color:var(--green); color:var(--green);">
                &#x1F4CA; ${t('import_excel')}
              </button>
              <input type="file" id="excelImportInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importFromExcel(this)">
              <button onclick="createNewTest()" class="btn btn-primary" style="padding:10px 20px;">${t('new_challenge')}</button>
            </div>
          </div>
          ${tests.length === 0 ? `
            <div class="empty-state card" style="text-align:center; padding:50px;">
              <div style="font-size:4rem; margin-bottom:10px;">📭</div>
              <p style="font-size:1.5rem; font-weight:700; color:#555;">${t('no_challenges_found')}</p>
              <p style="color:#888;">${t('create_first')}</p>
            </div>
          ` : `
            <div style="display:grid; gap:20px;">
              ${tests.map(test => {
            const results = Storage.getResultsForTest(test.id);
            return `
                  <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; padding:20px;">
                    <div>
                      <h3 style="margin:0 0 5px 0; font-size:1.3rem; color:#333;">${Utils.escapeHtml(test.title)}</h3>
                      <div style="font-size:0.9rem; color:#888; font-weight:600;">
                        ${test.questions.length} ${t('questions')} • ${Utils.formatTime(test.timeLimit)} • ${results.length} ${t('attempts')}
                      </div>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                      <button onclick="previewTest('${test.id}')" class="btn btn-outline" style="padding:8px 15px; background:#f0f9ff; border-color:var(--blue); color:var(--blue);">&#9654; ${t('preview')}</button>
                      <button onclick="shareTest('${test.id}')" class="btn btn-outline" style="padding:8px 15px; background:#eef2ff; border-color:#6366f1; color:#4338ca;">&#x1F517; ${t('share')}</button>
                      <button onclick="startBattle('${test.id}')" class="btn btn-outline" style="padding:8px 15px; background:#fff8e1; border-color:#f59e0b; color:#b45309;">&#9876; ${t('battle')}</button>
                      <button onclick="editTest('${test.id}')" class="btn btn-outline" style="padding: 8px 15px;">${t('edit')}</button>
                      <button onclick="confirmDeleteTest('${test.id}', '${Utils.escapeHtml(test.title).replace(/'/g, "\\'")}')" class="btn btn-danger" style="padding: 8px 15px;">${t('delete')}</button>
                    </div>
                  </div>
                `;
          }).join('')}
            </div>
          `}
        `;
        }

        window.previewTest = function (testId) {
          window.open('test.html?id=' + testId, '_blank');
        };

        window.shareTest = function (testId) {
          const nextPath = 'test.html?id=' + testId;
          const shareUrl = location.origin + location.pathname.replace(/admin\.html$/, 'index.html') + '?next=' + encodeURIComponent(nextPath);
          navigator.clipboard.writeText(shareUrl).then(() => {
            Utils.showNotification(t('link_copied'), 'success');
          }).catch(() => {
            prompt('Copy this link:', shareUrl);
          });
        };

        window.startBattle = function (testId) {
          window.open('battle.html?test=' + testId, '_blank');
        };

        window.createNewTest = function () {
          editingTest = createEmptyTest();
          currentTab = 'editor';
          render();
        };

        window.editTest = function (id) {
          editingTest = JSON.parse(JSON.stringify(Storage.getTest(id)));
          currentTab = 'editor';
          render();
        };

        window.confirmDeleteTest = function (id, title) {
          showConfirmModal(t('confirm_delete', title), t('cannot_undo'), () => {
            Storage.deleteTest(id);
            Utils.showNotification(t('deleted_notif'), 'success');
            render();
          });
        };

        // ——— Editor ———
        function createEmptyTest() {
          return {
            id: Storage.generateId(),
            title: '',
            description: '',
            timeLimit: 300,
            createdAt: Date.now(),
            questions: [createEmptyQuestion()],
            battleSettings: {
              perQuestionMode: false,
              perQuestionTime: 20,
              ratingDuration: 4,
              chartType: 'vertical-bar',
              ratingTitle: 'Распределение ответов',
              showCorrectAnswer: true,
              showPlayerCount: true,
            },
          };
        }

        function createEmptyQuestion() {
          return {
            id: Storage.generateId(),
            text: '',
            options: ['', '', '', ''],
            correct: 0,
          };
        }

        function renderEditor() {
          if (!editingTest) return;
          // Expose references so global image-upload handlers can access closure state
          window._editingTestRef = editingTest;
          window._rerenderEditor = renderEditor;
          const te = editingTest;
          if (!te.battleSettings) te.battleSettings = { perQuestionMode: false, perQuestionTime: 20, ratingDuration: 4, chartType: 'vertical-bar', ratingTitle: '\u0420\u0430\u0441\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u0438\u0435 \u043e\u0442\u0432\u0435\u0442\u043e\u0432', showCorrectAnswer: true, showPlayerCount: true };
          const bs = te.battleSettings;
          document.getElementById('tabContent').innerHTML = `
          <div class="editor-section">
            <h2 style="margin-bottom:20px; color:#333;">${t('challenge_settings')}</h2>
            <div class="form-group">
              <label>${t('title')}</label>
              <input type="text" id="testTitle" class="form-control" value="${Utils.escapeHtml(te.title)}" placeholder="${t('placeholder_title')}" style="font-weight:700;">
            </div>
            <div class="form-group">
              <label>${t('description')}</label>
              <textarea id="testDesc" class="form-control" rows="2" placeholder="${t('placeholder_desc')}">${Utils.escapeHtml(te.description || '')}</textarea>
            </div>
            <div class="form-group">
              <label>${t('time_limit_classic')}</label>
              <input type="number" id="testTime" class="form-control" value="${te.timeLimit}" min="30" max="7200" style="max-width:150px;">
            </div>

            <!-- Battle Settings -->
            <div style="margin-top:30px; padding:25px; background:#f0f0ff; border-radius:12px; border:2px solid #ddd;">
              <h3 style="margin:0 0 20px; color:#333; display:flex; align-items:center; gap:10px;">
                <span style="font-size:1.5rem;">⚔️</span> ${t('battle_settings')}
              </h3>
              <div class="form-group" style="margin-bottom:15px;">
                <div style="display:flex; align-items:center; gap:10px;">
                  <input type="checkbox" id="bsPerQuestion" ${bs.perQuestionMode ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--blue);">
                  <label for="bsPerQuestion" style="margin:0; text-transform:none; font-size:1rem; color:#333;">${t('enable_per_q')}</label>
                </div>
                <p style="color:#888; font-size:0.85rem; margin-top:5px; margin-left:30px;">${t('per_q_hint')}</p>
              </div>
              <div id="bsDetails" style="display:${bs.perQuestionMode ? 'block' : 'none'}; padding-left:10px; border-left:3px solid var(--blue);">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;">
                  <div class="form-group" style="margin:0;">
                    <label style="font-size:0.8rem;">\u0412\u0440\u0435\u043c\u044f \u043d\u0430 \u0432\u043e\u043f\u0440\u043e\u0441 (\u0441\u0435\u043a.)</label>
                    <input type="number" id="bsPerQTime" class="form-control" value="${bs.perQuestionTime}" min="5" max="300" style="max-width:120px;">
                  </div>
                  <div class="form-group" style="margin:0;">
                    <label style="font-size:0.8rem;">\u041f\u043e\u043a\u0430\u0437 \u0440\u0435\u0439\u0442\u0438\u043d\u0433\u0430 (\u0441\u0435\u043a.)</label>
                    <input type="number" id="bsRatingDur" class="form-control" value="${bs.ratingDuration}" min="2" max="30" style="max-width:120px;">
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                  <label style="font-size:0.8rem;">\u0422\u0438\u043f \u0434\u0438\u0430\u0433\u0440\u0430\u043c\u043c\u044b</label>
                  <select id="bsChartType" class="form-control" style="max-width:250px;">
                    <option value="vertical-bar" ${bs.chartType === 'vertical-bar' ? 'selected' : ''}>\u0421\u0442\u043e\u043b\u0431\u0447\u0430\u0442\u0430\u044f (\u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u0430\u044f)</option>
                    <option value="horizontal-bar" ${bs.chartType === 'horizontal-bar' ? 'selected' : ''}>\u0413\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u044c\u043d\u0430\u044f</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                  <label style="font-size:0.8rem;">\u0417\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u0440\u0435\u0439\u0442\u0438\u043d\u0433\u0430</label>
                  <input type="text" id="bsRatingTitle" class="form-control" value="${Utils.escapeHtml(bs.ratingTitle)}" style="max-width:300px;">
                </div>
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                  <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="bsShowCorrect" ${bs.showCorrectAnswer ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--green);">
                    <label for="bsShowCorrect" style="margin:0; text-transform:none; font-size:0.9rem; color:#555;">\u041f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0442\u044c \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442</label>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="bsShowCount" ${bs.showPlayerCount ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--blue);">
                    <label for="bsShowCount" style="margin:0; text-transform:none; font-size:0.9rem; color:#555;">\u041f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0442\u044c \u043a\u043e\u043b-\u0432\u043e \u0438\u0433\u0440\u043e\u043a\u043e\u0432</label>
                  </div>
                </div>
                <p style="color:#888; font-size:0.8rem; margin-top:15px;">
                  \u2139\ufe0f \u041f\u0440\u0438\u043c\u0435\u0440: \u0442\u0435\u0441\u0442 \u0438\u0437 ${te.questions.length} \u0432\u043e\u043f\u0440\u043e\u0441\u043e\u0432 \u0437\u0430\u0439\u043c\u0451\u0442
                  <strong>${Math.ceil((te.questions.length * (bs.perQuestionTime + bs.ratingDuration)) / 60)} \u043c\u0438\u043d.</strong>
                  (${te.questions.length}×${bs.perQuestionTime}\u0441 + ${te.questions.length}×${bs.ratingDuration}\u0441 \u0440\u0435\u0439\u0442\u0438\u043d\u0433)
                </p>
              </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin:40px 0 20px; flex-wrap:wrap;">
              <h2 style="margin:0; color:#333;">${t('questions_count', te.questions.length)}</h2>
              <button onclick="downloadCurrentTestXlsx()" class="btn btn-outline" style="color:var(--blue); border-color:var(--blue); background:#f0f9ff;">${t('download_xlsx')}</button>
            </div>

            <div id="questionsList">
              ${te.questions.map((q, qi) => renderQuestionEditor(q, qi)).join('')}
            </div>

            <div style="text-align:center; margin:24px 0 8px;">
              <button onclick="addQuestion()" class="btn btn-success" style="padding:12px 30px; font-size:1rem;">${t('add_question')}</button>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:15px; margin-top:24px; padding-top: 20px; border-top: 2px solid #eee; flex-wrap:wrap;">
               <button onclick="switchTab('tests')" class="btn btn-outline" style="color:#666; border-color:#ccc;">${t('discard')}</button>
               <button onclick="saveTest()" class="btn btn-primary" style="padding:12px 30px; font-size:1.1rem;">${t('save_challenge')}</button>
            </div>
          </div>
        `;

          document.getElementById('testTitle').addEventListener('input', (e) => { editingTest.title = e.target.value; });
          document.getElementById('testDesc').addEventListener('input', (e) => { editingTest.description = e.target.value; });
          document.getElementById('testTime').addEventListener('input', (e) => { editingTest.timeLimit = parseInt(e.target.value) || 300; });

          // Battle settings listeners
          document.getElementById('bsPerQuestion').addEventListener('change', (e) => {
            editingTest.battleSettings.perQuestionMode = e.target.checked;
            document.getElementById('bsDetails').style.display = e.target.checked ? 'block' : 'none';
          });
          document.getElementById('bsPerQTime').addEventListener('input', (e) => { editingTest.battleSettings.perQuestionTime = parseInt(e.target.value) || 20; });
          document.getElementById('bsRatingDur').addEventListener('input', (e) => { editingTest.battleSettings.ratingDuration = parseInt(e.target.value) || 4; });
          document.getElementById('bsChartType').addEventListener('change', (e) => { editingTest.battleSettings.chartType = e.target.value; });
          document.getElementById('bsRatingTitle').addEventListener('input', (e) => { editingTest.battleSettings.ratingTitle = e.target.value; });
          document.getElementById('bsShowCorrect').addEventListener('change', (e) => { editingTest.battleSettings.showCorrectAnswer = e.target.checked; });
          document.getElementById('bsShowCount').addEventListener('change', (e) => { editingTest.battleSettings.showPlayerCount = e.target.checked; });
        }

        function renderQuestionEditor(q, qi) {
          const imgSection = q.imageUrl ? `
            <div id="imgZone_${qi}" class="img-upload-zone">
              <div class="img-preview">
                <img src="${Utils.escapeHtml(q.imageUrl)}" alt="Question image">
                <button class="img-preview-remove" onclick="removeQuestionImage(${qi})" title="Remove image">&times;</button>
              </div>
            </div>
          ` : `
            <div id="imgZone_${qi}" class="img-upload-zone"
                 ondragover="event.preventDefault(); this.classList.add('drag-over')"
                 ondragleave="this.classList.remove('drag-over')"
                 ondrop="event.preventDefault(); this.classList.remove('drag-over'); handleImgDrop(event, ${qi})">
              <div class="img-drop-grid">
                <div class="img-drop-half img-drop-half--left"
                     onclick="document.getElementById('imgFileInput_${qi}').click()"
                     onmouseenter="window._lastActiveImgZone=${qi}">
                  <span class="img-drop-icon">&#x1F5BC;</span>
                  <strong>Выбрать файл</strong>
                  <span class="img-drop-hint">Нажмите или перетащите &middot; PNG, JPG, GIF, WebP</span>
                </div>
                <div class="img-drop-half img-drop-half--right"
                     onclick="handleClipboardPaste(${qi})"
                     onmouseenter="window._lastActiveImgZone=${qi}">
                  <span class="img-drop-icon">&#x1F4CB;</span>
                  <strong>Вставить</strong>
                  <span class="img-drop-hint">Нажмите или Ctrl+V</span>
                </div>
              </div>
              <input type="file" accept="image/*" id="imgFileInput_${qi}" style="display:none" onchange="handleImgUpload(this, ${qi})">
            </div>
          `;

          return `
          <div class="q-card" data-qi="${qi}">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
              <span style="font-weight:800; color:#888;">${t('question_n', qi + 1)}</span>
              ${editingTest.questions.length > 1 ? `
                <button onclick="removeQuestion(${qi})" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:700;">${t('remove')}</button>
              ` : ''}
            </div>
            <div class="form-group">
              <input type="text" class="form-control q-text" data-qi="${qi}"
                     value="${Utils.escapeHtml(q.text)}" placeholder="${t('q_placeholder')}" style="font-weight:600;">
            </div>
            ${imgSection}
            <div class="options-editor" style="margin-top:16px;">
              ${q.options.map((opt, oi) => `
                <div class="option-row">
                  <input type="radio" name="correct_${qi}" value="${oi}" ${q.correct === oi ? 'checked' : ''}
                         onchange="setCorrect(${qi}, ${oi})" style="width: 20px; height: 20px; accent-color: var(--green); cursor:pointer;">
                  <input type="text" class="form-control q-option" data-qi="${qi}" data-oi="${oi}"
                         value="${Utils.escapeHtml(opt)}" placeholder="${t('option_n', String.fromCharCode(65 + oi))}" style="border:1px solid ${q.correct === oi ? 'var(--green)' : '#ddd'};">
                </div>
              `).join('')}
            </div>
          </div>
        `;
        }

        document.addEventListener('input', (e) => {
          if (e.target.classList.contains('q-text')) {
            const qi = parseInt(e.target.dataset.qi);
            if (editingTest && editingTest.questions[qi]) {
              editingTest.questions[qi].text = e.target.value;
            }
          }
          if (e.target.classList.contains('q-option')) {
            const qi = parseInt(e.target.dataset.qi);
            const oi = parseInt(e.target.dataset.oi);
            if (editingTest && editingTest.questions[qi]) {
              editingTest.questions[qi].options[oi] = e.target.value;
            }
          }
        });

        window.setCorrect = function (qi, oi) {
          if (editingTest && editingTest.questions[qi]) editingTest.questions[qi].correct = oi;
          renderEditor();
        };
        window.addQuestion = function () {
          editingTest.questions.push(createEmptyQuestion());
          renderEditor();
          setTimeout(() => {
            const list = document.getElementById('questionsList');
            if (list) list.lastElementChild.scrollIntoView({ behavior: 'smooth' });
          }, 100);
        };
        window.removeQuestion = function (qi) {
          editingTest.questions.splice(qi, 1);
          renderEditor();
        };
        window.saveTest = function () {
          const t = editingTest;
          if (!t.title.trim()) { Utils.showNotification(t('title_required'), 'error'); return; }
          if (t.questions.some(q => !q.text.trim())) { Utils.showNotification(t('empty_questions'), 'error'); return; }
          if (t.questions.some(q => q.options.some(o => !o.trim()))) { Utils.showNotification(t('empty_options'), 'error'); return; }
          Storage.saveTest(t);
          Utils.showNotification(t('saved_notif'), 'success');
          editingTest = null;
          currentTab = 'tests';
          render();
        };

        // ——— Results ———
        function renderResults() {
          const tests = Storage.getTests();
          const allResults = Storage.getResults();

          document.getElementById('tabContent').innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <p style="color:#666; font-weight:700;">${t('total_records')}: ${allResults.length}</p>
            ${allResults.length > 0 ? `
              <button onclick="confirmClearResults()" class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);">${t('clear_history')}</button>
            ` : ''}
          </div>

          ${tests.map(test => {
            const results = Storage.getResultsForTest(test.id);
            if (results.length === 0) return '';
            return `
              <div class="card" style="margin-bottom:30px; padding:0; overflow:hidden;">
                <div class="card-header" style="background:#f9f9f9; padding:15px 20px; font-weight:800; color:#444; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                  <span>${Utils.escapeHtml(test.title)}</span>
                  <span style="background:var(--blue); color:white; padding:2px 8px; border-radius:10px; font-size:0.8rem;">${results.length}</span>
                </div>
                <table class="leaderboard-table" style="width:100%; border-collapse:collapse;">
                  <thead>
                    <tr style="background:white; border-bottom:2px solid #eee; text-align:left; color:#888; font-size:0.9rem;">
                      <th style="padding:12px 20px;">${t('rank')}</th>
                      <th style="padding:12px;">${t('player')}</th>
                      <th style="padding:12px;">${t('th_group')}</th>
                      <th style="padding:12px; text-align:right;">${t('score')}</th>
                      <th style="padding:12px; text-align:right;">${t('time')}</th>
                      <th style="padding:12px; text-align:right;">${t('date')}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${results.map((r, i) => `
                      <tr style="border-bottom:1px solid #f9f9f9;">
                        <td style="padding:12px 20px;"><strong>${i + 1}</strong></td>
                        <td style="padding:12px; color:#333; font-weight:700;">${Utils.escapeHtml(r.userName)}</td>
                        <td style="padding:12px; color:#888;">${Utils.escapeHtml(r.userGroup || '-')}</td>
                        <td style="padding:12px; text-align:right; color:var(--blue); font-weight:800;">${r.score}%</td>
                        <td style="padding:12px; text-align:right; font-family:monospace;">${Utils.formatTime(r.timeSpent)}</td>
                        <td style="padding:12px; text-align:right; color:#999; font-size:0.85rem;">${new Date(r.completedAt).toLocaleDateString()}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
          }).join('') || `<div class="empty-state card" style="text-align:center; padding:40px;"><p>${t('no_results')}</p></div>`}
        `;
        }

        window.confirmClearResults = function () {
          showConfirmModal(t('clear_history') + '?', 'This will permanently delete all student results. Challenges will remain.', () => {
            Storage.clearAllResults();
            Utils.showNotification(t('history_cleared'), 'success');
            render();
          });
        };

        // ——— Settings ———
        function renderSettings() {
          const currentPassword = localStorage.getItem('ct_admin_password') || 'admin';
          document.getElementById('tabContent').innerHTML = `
          <div class="card" style="max-width:500px; margin:0 auto; padding:30px;">
            <h2 style="margin-bottom:25px; color:#333;">${t('system_config')}</h2>
            <div class="form-group">
              <label>${t('admin_password')}</label>
              <input type="text" id="adminPass" class="form-control" value="${Utils.escapeHtml(currentPassword)}">
            </div>
            <button onclick="saveSettings()" class="btn btn-primary btn-block" style="margin-top:20px;">${t('save_config')}</button>

            <div style="margin-top:50px; padding-top:25px; border-top:2px solid #eee;">
              <h3 style="margin-bottom:15px; color:var(--danger);">${t('danger_zone')}</h3>
              <p style="color:#666; margin-bottom:15px; font-size:0.9rem;">${t('reset_warning')}</p>
              <button onclick="confirmResetAll()" class="btn btn-block btn-outline" style="color:var(--danger); border-color:var(--danger);">${t('factory_reset')}</button>
            </div>
          </div>
        `;
        }

        window.saveSettings = function () {
          const pass = document.getElementById('adminPass').value.trim();
          if (!pass) { Utils.showNotification(t('password_required'), 'error'); return; }
          localStorage.setItem('ct_admin_password', pass);
          Utils.showNotification(t('settings_saved'), 'success');
        };

        window.confirmResetAll = function () {
          showConfirmModal(t('factory_reset') + '?', 'WARNING: This will delete ALL challenges and results. Are you sure?', () => {
            Storage.resetAllData();
            Utils.showNotification(t('system_reset'), 'success');
            render();
          });
        };

        function showConfirmModal(title, text, onConfirm) {
          const modal = document.getElementById('confirmModal');
          document.getElementById('modalTitle').textContent = title;
          document.getElementById('modalText').textContent = text;
          modal.classList.add('active');

          const confirmBtn = document.getElementById('modalConfirm');
          const cancelBtn = document.getElementById('modalCancel');

          // Clone to remove old listeners
          const newConfirm = confirmBtn.cloneNode(true);
          const newCancel = cancelBtn.cloneNode(true);
          confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
          cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

          const cleanup = () => {
            modal.classList.remove('active');
          };

          newConfirm.addEventListener('click', () => { cleanup(); onConfirm(); });
          newCancel.addEventListener('click', cleanup);
          modal.addEventListener('click', (e) => { if (e.target === modal) cleanup(); });
        }

        // Used by Excel import to open test in editor
        window.openImportedTest = function (test) {
          editingTest = test;
          currentTab = 'editor';
          render();
        };

        render();
      } // end initAdmin

      // ——— Image Upload Helpers (global) ———
      window.handleImgUpload = async function (input, qi) {
        const file = input.files[0];
        if (!file) return;

        const zone = document.getElementById('imgZone_' + qi);
        if (zone) {
          zone.innerHTML = '<div style="padding:14px; text-align:center; color:var(--blue); font-weight:700; background:#e8f0fe; border-radius:var(--radius-md); font-size:0.9rem;">Uploading image\u2026</div>';
        }

        const editingTest = window._editingTestRef;
        if (!editingTest) return;

        const q = editingTest.questions[qi];

        // Base64 encoding — instant, no network required, no CORS issues
        if (file.size > 500 * 1024) {
          Utils.showNotification('Для лучшей производительности используйте изображения < 500 KB', 'warning');
        }
        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (evt) => { q.imageUrl = evt.target.result; resolve(); };
          reader.onerror = () => { Utils.showNotification('Failed to read image', 'error'); resolve(); };
          reader.readAsDataURL(file);
        });

        // Trigger re-render via the exposed render function
        if (window._rerenderEditor) window._rerenderEditor();
      };

      window.handleClipboardPaste = async function (qi) {
        try {
          if (!navigator.clipboard || !navigator.clipboard.read) {
            Utils.showNotification('Используйте Ctrl+V в зоне загрузки', 'warning');
            return;
          }
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const imageType = item.types.find(t => t.startsWith('image/'));
            if (imageType) {
              const blob = await item.getType(imageType);
              const file = new File([blob], 'clipboard.png', { type: imageType });
              await window.handleImgUpload({ files: [file] }, qi);
              return;
            }
          }
          Utils.showNotification('Изображение в буфере не найдено', 'error');
        } catch (e) {
          Utils.showNotification('Нет доступа к буферу. Попробуйте Ctrl+V.', 'error');
        }
      };

      window.handleImgDrop = function (event, qi) {
        const file = event.dataTransfer.files[0];
        if (!file || !file.type.startsWith('image/')) {
          Utils.showNotification('Please drop an image file', 'error');
          return;
        }
        window.handleImgUpload({ files: [file] }, qi);
      };

      window.removeQuestionImage = function (qi) {
        const editingTest = window._editingTestRef;
        if (editingTest && editingTest.questions[qi]) {
          editingTest.questions[qi].imageUrl = null;
          if (window._rerenderEditor) window._rerenderEditor();
        }
      };

      window.downloadCurrentTestXlsx = function () {
        const test = window._editingTestRef;
        if (!test) return;

        if (typeof XLSX === 'undefined') {
          Utils.showNotification(t('excel_not_loaded'), 'error');
          return;
        }

        const wb = XLSX.utils.book_new();
        const rows = [
          [test.title || ''],
          ['Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Correct'],
        ];

        (test.questions || []).forEach((q) => {
          const options = Array.isArray(q.options) ? q.options : [];
          const padded = [
            options[0] || '',
            options[1] || '',
            options[2] || '',
            options[3] || '',
          ];
          const correctIdx = Number.isInteger(q.correct) ? q.correct : 0;
          const boundedCorrect = Math.max(0, Math.min(3, correctIdx));
          const correctLetter = String.fromCharCode(65 + boundedCorrect);
          const correctValue = padded[boundedCorrect] || correctLetter;

          rows.push([q.text || '', ...padded, correctValue]);
        });

        const ws = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, 'Test');

        const fileSafeTitle = (test.title || 'test')
          .replace(/[\\/:*?"<>|]+/g, ' ')
          .trim() || 'test';

        XLSX.writeFile(wb, `${fileSafeTitle}.xlsx`);
      };

      // ——— Excel Import (global) ———
      window.importFromExcel = function (input) {
        const file = input.files[0];
        if (!file) return;
        input.value = '';

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            if (typeof XLSX === 'undefined') {
              alert('Excel library not loaded. Please check your internet connection.');
              return;
            }
            const wb = XLSX.read(e.target.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

            if (!rows || rows.length < 2) {
              alert('The file appears to be empty or has too few rows.');
              return;
            }

            // Row 1: test title (cell A1)
            const testTitle = String(rows[0][0] || '').trim() || 'Imported Test';

            // Auto-detect if row 2 is a header row
            let startRow = 1;
            if (_looksLikeHeaderRow(rows[1])) {
              startRow = 2;
            }

            const questions = [];
            for (let i = startRow; i < rows.length; i++) {
              const row = rows[i];
              const text = String(row[0] || '').trim();
              if (!text) continue;

              const options = [
                String(row[1] || '').trim(),
                String(row[2] || '').trim(),
                String(row[3] || '').trim(),
                String(row[4] || '').trim(),
              ].filter(o => o);

              if (options.length < 1) continue;

              const correct = _resolveCorrectAnswer(row, options);
              questions.push({ id: Storage.generateId(), text, options, correct });
            }

            if (questions.length === 0) {
              alert('No valid questions found.\n\nExpected format:\nRow 1: Test title (cell A1)\nRow 2: (optional header)\nRows 3+: Question | Option A | Option B | Option C | Option D | Correct (A/B/C/D, 1/2/3/4, option text, or =B3/=C3/=D3/=E3).\nUse 1-4 filled option cells (B..E).');
              return;
            }

            const test = {
              id: Storage.generateId(),
              title: testTitle,
              description: 'Imported from Excel',
              timeLimit: 300,
              createdAt: Date.now(),
              questions,
            };

            Storage.saveTest(test);
            Utils.showNotification('\u2705 Imported ' + questions.length + ' questions!', 'success');

            if (window.openImportedTest) window.openImportedTest(test);
          } catch (err) {
            alert('Error reading file: ' + err.message);
          }
        };
        reader.onerror = function () { alert('Failed to read the file.'); };
        reader.readAsArrayBuffer(file);
      };

      function _looksLikeHeaderRow(row) {
        if (!row) return false;
        const q = String(row[0] || '').trim().toLowerCase();
        const c = String(row[5] || '').trim().toLowerCase();
        return q === 'question' || q === 'вопрос' || c === 'correct' || c === 'верный' || c === 'правильный ответ';
      }

      function _resolveCorrectAnswer(row, options) {
        const correctRaw = String(row[5] || '').trim();
        if (!correctRaw) return 0;

        const formulaMatch = correctRaw.match(/^=\s*([A-Z]+)\s*\d+$/i);
        if (formulaMatch) {
          const col = formulaMatch[1].toUpperCase();
          const map = { B: 0, C: 1, D: 2, E: 3 };
          if (Object.prototype.hasOwnProperty.call(map, col)) {
            return Math.min(map[col], options.length - 1);
          }
        }

        const upper = correctRaw.toUpperCase();
        if (/^[A-D]$/.test(upper)) return Math.min(upper.charCodeAt(0) - 65, options.length - 1);
        if (/^[1-4]$/.test(upper)) return Math.min(parseInt(upper, 10) - 1, options.length - 1);

        const byExact = options.findIndex(o => o === correctRaw);
        if (byExact >= 0) return byExact;

        const normalize = (v) => String(v || '').trim().toLowerCase().replace(/\s+/g, ' ');
        const normalized = normalize(correctRaw);
        const byNorm = options.findIndex(o => normalize(o) === normalized);
        if (byNorm >= 0) return byNorm;

        return 0;
      }

      // Global Ctrl+V paste listener — inserts clipboard image into the last hovered question zone
      document.addEventListener('paste', function (e) {
        const item = Array.from(e.clipboardData.items).find(i => i.type.startsWith('image/'));
        if (!item) return;
        const zones = document.querySelectorAll('[id^="imgZone_"]');
        if (!zones.length) return;
        const qi = parseInt(window._lastActiveImgZone != null ? window._lastActiveImgZone : 0);
        const file = item.getAsFile();
        if (file && window.handleImgUpload) window.handleImgUpload({ files: [file] }, qi);
      });
    })();
  </script>
