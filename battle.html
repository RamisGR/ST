<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Mode // TestArena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .avatar-bounce {
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="center-content">
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Storage.getUser();
      const roomParam = Utils.getQueryParam('room');

      // State
      let battle = null;
      let myPlayerId = null;
      let battleRef = null;
      let currentQuestion = 0;
      let answers = [];
      let testData = null;
      let timerInterval = null;
      let timeLeft = 0;
      let testStartTime = 0;
      let showingIntermediateResults = false;
      let joinLock = false;

      // Color/Shape mapping
      const optionConfigs = [
        { color: 'var(--red)', shape: 'shape-triangle', shadow: 'var(--red-shadow)' },
        { color: 'var(--blue)', shape: 'shape-diamond', shadow: 'var(--blue-shadow)' },
        { color: 'var(--yellow)', shape: 'shape-circle', shadow: 'var(--yellow-shadow)' },
        { color: 'var(--green)', shape: 'shape-square', shadow: 'var(--green-shadow)' }
      ];

      if (roomParam) {
        showJoinScreen(roomParam);
      } else {
        showCreateOrJoin();
      }

      function showCreateOrJoin() {
        const tests = Storage.getTests();
        document.getElementById('app').innerHTML = `
          <div class="container fade-in" style="text-align:center; max-width:800px; padding-top:40px;">
            <h1 style="font-size:3.5rem; margin-bottom:10px; text-shadow:none; color:white;">Battle Mode</h1>
            <p style="font-size:1.5rem; color:rgba(255,255,255,0.8); margin-bottom:40px;">Compete live with others!</p>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px; margin-bottom:30px;">
              <div class="card" style="border-top:10px solid var(--blue); text-align:left;">
                <h2 style="color:#333; font-size:1.8rem; margin-bottom:20px;">Host Game</h2>
                <div class="form-group">
                  <label>Select Challenge</label>
                  <select id="testSelect" class="form-control" style="font-size:1rem;">
                    ${tests.map(t => `<option value="${t.id}">${Utils.escapeHtml(t.title)}</option>`).join('')}
                  </select>
                </div>
                ${!user ? `
                  <div class="form-group">
                    <label>Your Name</label>
                    <input id="creatorName" class="form-control" placeholder="Prof. X">
                  </div>
                ` : ''}
                <button id="createBtn" class="btn btn-primary btn-block" style="background:var(--blue); border-bottom:4px solid var(--blue-shadow);">Create Room</button>
              </div>

              <div class="card" style="border-top:10px solid var(--green); text-align:left;">
                <h2 style="color:#333; font-size:1.8rem; margin-bottom:20px;">Join Game</h2>
                <div class="form-group">
                  <label>Room PIN</label>
                  <input id="roomCode" class="form-control" placeholder="123456" maxlength="6" style="letter-spacing:5px; font-size:1.5rem; text-align:center; font-weight:700;">
                </div>
                ${!user ? `
                  <div class="form-group">
                    <label>Your Name</label>
                    <input id="joinName" class="form-control" placeholder="Player 1">
                  </div>
                ` : ''}
                <button id="joinBtn" class="btn btn-primary btn-block" style="background:var(--green); border-bottom:4px solid var(--green-shadow);">Enter Room</button>
              </div>
            </div>
            
            <a href="tests.html" class="btn btn-outline" style="margin-top:20px; border:none; color:white;">Back to Menu</a>
          </div>
        `;

        document.getElementById('createBtn').addEventListener('click', () => {
          const testId = document.getElementById('testSelect').value;
          const name = user ? user.name : document.getElementById('creatorName').value.trim();
          if (!name) return alert('Name required');

          if (!user) Storage.setUser({ name, role: 'student' });

          const test = Storage.getTest(testId);
          const b = Storage.createBattle(testId, test.title, test.questions.length, test.timeLimit, name);

          myPlayerId = Storage.joinBattle(b.id, name, user ? user.group : '');
          localStorage.setItem('battle_player_id', myPlayerId);
          localStorage.setItem('battle_room', b.id);
          localStorage.setItem('battle_is_creator', 'true');

          history.replaceState(null, '', 'battle.html?room=' + b.id);
          showLobby(b.id);
        });

        document.getElementById('joinBtn').addEventListener('click', () => {
          const code = document.getElementById('roomCode').value.trim().toUpperCase();
          const name = user ? user.name : document.getElementById('joinName').value.trim();
          if (!code || !name) return alert('PIN and Name required');

          if (!user) Storage.setUser({ name, role: 'student' });
          showJoinScreen(code);
        });
      }

      function showJoinScreen(roomCode) {
        const savedRoom = localStorage.getItem('battle_room');
        const savedPlayerId = localStorage.getItem('battle_player_id');

        if (savedRoom === roomCode && savedPlayerId) {
          myPlayerId = savedPlayerId;
          showLobby(roomCode);
          return;
        }

        const name = user ? user.name : prompt("Enter your nickname:");
        if (!name) return;

        if (!user) Storage.setUser({ name, role: 'student' });

        myPlayerId = Storage.joinBattle(roomCode, name, user ? user.group : '');
        localStorage.setItem('battle_player_id', myPlayerId);
        localStorage.setItem('battle_room', roomCode);
        localStorage.setItem('battle_is_creator', 'false');
        showLobby(roomCode);
      }

      function showLobby(roomCode) {
        const isCreator = localStorage.getItem('battle_is_creator') === 'true';

        if (battleRef) Storage.offBattleChange(battleRef);
        battleRef = Storage.onBattleChange(roomCode, (data) => {
          if (!data) return;
          battle = data;

          if (data.status === 'countdown' && !showingIntermediateResults) {
            showCountdown(roomCode);
            return;
          }
          if (data.status === 'active' && !showingIntermediateResults) {
            startBattleTest(roomCode);
            return;
          }
          if (data.status === 'finished') {
            showFinalResults(roomCode);
            return;
          }

          renderLobby(roomCode, data, isCreator);
        });
      }

      function renderLobby(roomCode, data, isCreator) {
        const players = data.players ? Object.values(data.players) : [];

        document.getElementById('app').innerHTML = `
          <div class="container fade-in" style="text-align:center; padding-top:40px;">
             <div class="card" style="width:auto; display:inline-block; padding:10px 30px; margin-bottom:30px; border-radius:10px;">
               <div style="font-size:1rem; color:#888; font-weight:700;">GAME PIN</div>
               <div style="font-size:4rem; font-weight:900; letter-spacing:5px;">${roomCode}</div>
             </div>
             
             <h2 style="color:white; margin-bottom:30px; font-size:2rem;">Waiting for players...</h2>
             
             <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:20px; margin-bottom:40px; min-height:100px;">
               ${players.map((p, i) => `
                 <div class="avatar-bounce" style="text-align:center; animation-delay:${i * 0.1}s;">
                   <div class="avatar" style="width:60px; height:60px; font-size:1.5rem; background:white; color:#333; margin:0 auto 10px;">
                     ${p.name.charAt(0).toUpperCase()}
                   </div>
                   <div style="color:white; font-weight:700; font-size:1rem; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                     ${Utils.escapeHtml(p.name)}
                   </div>
                 </div>
               `).join('')}
             </div>

             <div style="color:rgba(255,255,255,0.7); font-weight:700; font-size:1.5rem; margin-bottom:40px;">
               ${players.length} Player${players.length !== 1 ? 's' : ''} Ready
             </div>

             ${isCreator ? `
               <button id="startBtn" class="btn btn-primary" style="font-size:1.8rem; padding:20px 60px; box-shadow: 0 8px 0 var(--blue-shadow);">Start Game</button>
             ` : `
               <div style="color:white; font-size:1.2rem; background:rgba(0,0,0,0.2); padding:20px; border-radius:10px; display:inline-block;">
                 Host will start the game soon...
               </div>
             `}
          </div>
        `;

        if (isCreator) {
          document.getElementById('startBtn').addEventListener('click', () => Storage.startBattle(roomCode));
        }
      }

      function showCountdown(roomCode) {
        let count = 3;
        const render = () => {
          const colors = ['var(--red)', 'var(--yellow)', 'var(--green)'];
          document.getElementById('app').innerHTML = `
            <div class="center-content" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
              <div style="font-size:15rem; font-weight:900; color:white; text-shadow:0 10px 0 rgba(0,0,0,0.2); animation:popIn 0.5s;">${count === 0 ? 'GO!' : count}</div>
              <h2 style="color:white; margin-top:20px; font-size:2rem; text-align:center; max-width:800px;">${Utils.escapeHtml(battle.testTitle)}</h2>
              ${count > 0 ? `<div style="width:100%; position:fixed; bottom:0; height:10px; background:rgba(255,255,255,0.2);">
                <div style="width:${(count / 3) * 100}%; height:100%; background:white; transition:width 1s linear;"></div>
              </div>` : ''}
            </div>
          `;
        };
        render();
        const iv = setInterval(() => {
          count--;
          if (count < 0) {
            clearInterval(iv);
            return;
          }
          render();
        }, 1000);
      }

      function startBattleTest(roomCode) {
        if (timerInterval) return;
        testData = Storage.getTest(battle.testId);
        if (!testData) return;

        answers = new Array(testData.questions.length).fill(-1);
        currentQuestion = 0;
        timeLeft = testData.timeLimit;
        testStartTime = Date.now();

        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) finishBattleTest(roomCode);
          else renderBattleQuestion(roomCode); // Update timer UI efficienty? Ideally separate but this is fine for now
        }, 1000);

        renderBattleQuestion(roomCode);
      }

      function renderBattleQuestion(roomCode) {
        if (showingIntermediateResults) return;
        const q = testData.questions[currentQuestion];
        const players = battle && battle.players ? Object.values(battle.players) : [];

        document.getElementById('app').innerHTML = `
          <div class="container center-content" style="max-width:900px; padding-top:20px; width:100%;">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center; margin-bottom:20px;">
               <div style="background:rgba(0,0,0,0.3); color:white; padding:5px 15px; border-radius:20px; font-weight:700;">
                 ${currentQuestion + 1} / ${testData.questions.length}
               </div>
               <div class="timer-circle" style="margin:0; width:60px; height:60px; font-size:1.5rem; background:white; color:#333;">${timeLeft}</div>
            </div>

            <div class="question-card" style="width:100%; min-height:180px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin-bottom:30px; text-align:center;">
              ${Utils.escapeHtml(q.text)}
            </div>

            <div class="answer-grid" style="width:100%; gap:20px;">
              ${q.options.map((opt, i) => {
          const cfg = optionConfigs[i % 4];
          const isSelected = answers[currentQuestion] === i;
          const opacity = (answers[currentQuestion] !== -1 && !isSelected) ? '0.4' : '1';

          return `
                  <button onclick="selectAnswer(${i})" class="btn pop-in" 
                    style="background:${cfg.color}; border-bottom-color:${cfg.shadow}; color:white; opacity:${opacity};
                           height:140px; font-size:1.4rem; padding:20px; width:100%; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2;">
                    <span class="shape-icon ${cfg.shape}" style="background:rgba(0,0,0,0.2); position:absolute; left:15px; top:15px; width:40px; height:40px;"></span>
                    <span>${Utils.escapeHtml(opt)}</span>
                  </button>
                `;
        }).join('')}
            </div>

            <!-- Mini Leaderboard / Progress -->
            <div style="margin-top:30px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
              ${players.map(p => {
          const isMe = p.id === myPlayerId;
          const score = p.correctCount || 0;
          return `
                   <div style="text-align:center; opacity:${p.finished ? 0.6 : 1}; margin:5px;">
                     <div class="avatar" style="width:40px; height:40px; font-size:1rem; border:2px solid ${isMe ? 'yellow' : 'transparent'}; background:${isMe ? 'white' : 'rgba(255,255,255,0.2)'}; color:${isMe ? '#333' : 'white'}; margin:0 auto 5px;">
                       ${p.name.charAt(0)}
                     </div>
                     <div style="color:white; font-size:0.8rem; font-weight:700;">${score}</div>
                   </div>
                 `;
        }).join('')}
            </div>
          </div>
        `;
      }

      window.selectAnswer = function (index) {
        if (answers[currentQuestion] !== -1) return; // Already answered

        answers[currentQuestion] = index;

        // Calculate correctness
        let correctCount = 0;
        answers.forEach((a, i) => {
          if (a >= 0 && a === testData.questions[i].correct) correctCount++;
        });

        Storage.updateBattlePlayer(localStorage.getItem('battle_room'), myPlayerId, {
          currentQuestion: currentQuestion,
          correctCount: correctCount,
          answeredCount: answers.filter(a => a >= 0).length
        });

        // Delay for visual feedback before next question
        setTimeout(() => {
          if (currentQuestion < testData.questions.length - 1) {
            currentQuestion++;
            renderBattleQuestion(localStorage.getItem('battle_room'));
          } else {
            finishBattleTest(localStorage.getItem('battle_room'));
          }
        }, 500);
      };

      function finishBattleTest(roomCode) {
        clearInterval(timerInterval);
        timerInterval = null;

        let correctCount = 0;
        answers.forEach((a, i) => {
          if (a >= 0 && a === testData.questions[i].correct) correctCount++;
        });

        const timeSpent = Math.round((Date.now() - testStartTime) / 1000);

        Storage.updateBattlePlayer(roomCode, myPlayerId, {
          finished: true,
          finishedAt: Date.now(),
          correctCount: correctCount,
          timeSpent: timeSpent
        });

        // Wait screen
        document.getElementById('app').innerHTML = `
           <div class="container fade-in center-content" style="text-align:center;">
             <h1 style="color:white; font-size:3rem; margin-bottom:20px;">Finished!</h1>
             <div class="card" style="display:inline-block; min-width:300px;">
               <div style="font-size:1.2rem; color:#888;">Your Score</div>
               <div style="font-size:4rem; font-weight:900; color:var(--primary);">${correctCount}/${testData.questions.length}</div>
             </div>
             <p style="color:rgba(255,255,255,0.8); font-size:1.5rem; margin-top:30px;">Waiting for other players...</p>
             <div class="battle-waiting-pulse" style="margin:20px auto; background:white;"></div>
           </div>
         `;

        // Host checks if all finished
        const isCreator = localStorage.getItem('battle_is_creator') === 'true';
        if (isCreator) {
          const checkAll = setInterval(() => {
            if (!battle || !battle.players) return;
            const players = Object.values(battle.players);
            if (players.every(p => p.finished)) {
              clearInterval(checkAll);
              Storage.finishBattle(roomCode);
            }
          }, 1000);
        }
      }

      function showFinalResults(roomCode) {
        if (!battle || !battle.players) return;
        const players = Object.values(battle.players).sort((a, b) => b.correctCount - a.correctCount);
        const top3 = players.slice(0, 3);

        // p1 is index 0. p2 index 1. p3 index 2.
        const p1 = top3[0];
        const p2 = top3[1];
        const p3 = top3[2];

        document.getElementById('app').innerHTML = `
          <div class="container fade-in" style="text-align:center; padding-top:40px;">
            <h1 style="color:white; text-shadow:none; font-size:3rem; margin-bottom:40px;">Podium</h1>
            
            <div class="podium-container" style="display:flex; align-items:flex-end; justify-content:center; gap:10px; height:350px; margin-bottom:40px;">
              ${p2 ? `
                <div class="podium-bar pop-in" style="animation-delay:0.2s; width:100px; display:flex; flex-direction:column; align-items:center;">
                   <div class="avatar" style="margin-bottom:10px; background:#C0C0C0; color:white; width:60px; height:60px; font-size:1.5rem; border:3px solid white;">${p2.name.charAt(0)}</div>
                   <div style="background:#C0C0C0; width:100%; height:180px; border-radius:10px 10px 0 0; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font-weight:900; color:white; font-size:2rem; box-shadow:0 4px 0 rgba(0,0,0,0.2);">2</div>
                   <div style="background:white; color:#333; width:100%; padding:8px 5px; font-weight:700; border-radius:0 0 5px 5px; font-size:0.9rem;">${Utils.escapeHtml(p2.name)}</div>
                   <div style="color:white; font-weight:700; margin-top:5px;">${p2.correctCount} pts</div>
                </div>
              ` : ''}

              <div class="podium-bar pop-in" style="width:120px; display:flex; flex-direction:column; align-items:center;">
                 <div class="avatar" style="margin-bottom:10px; background:#D89E00; color:white; width:90px; height:90px; font-size:2.5rem; border:4px solid white; box-shadow:0 0 20px rgba(255,215,0,0.5);">
                    ${p1.name.charAt(0)}
                 </div>
                 <div style="background:#D89E00; width:100%; height:260px; border-radius:10px 10px 0 0; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font-weight:900; font-size:3rem; color:white; box-shadow:0 4px 0 rgba(0,0,0,0.2);">1</div>
                 <div style="background:white; color:#333; width:100%; padding:10px 5px; font-weight:700; border-radius:0 0 5px 5px; font-size:1.1rem;">${Utils.escapeHtml(p1.name)}</div>
                 <div style="color:white; font-weight:700; margin-top:5px; font-size:1.2rem;">${p1.correctCount} pts</div>
              </div>

              ${p3 ? `
                <div class="podium-bar pop-in" style="animation-delay:0.4s; width:100px; display:flex; flex-direction:column; align-items:center;">
                   <div class="avatar" style="margin-bottom:10px; background:#CD7F32; color:white; width:60px; height:60px; font-size:1.5rem; border:3px solid white;">${p3.name.charAt(0)}</div>
                   <div style="background:#CD7F32; width:100%; height:130px; border-radius:10px 10px 0 0; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font-weight:900; color:white; font-size:2rem; box-shadow:0 4px 0 rgba(0,0,0,0.2);">3</div>
                   <div style="background:white; color:#333; width:100%; padding:8px 5px; font-weight:700; border-radius:0 0 5px 5px; font-size:0.9rem;">${Utils.escapeHtml(p3.name)}</div>
                   <div style="color:white; font-weight:700; margin-top:5px;">${p3.correctCount} pts</div>
                </div>
              ` : ''}
            </div>

            <a href="tests.html" class="btn btn-outline" style="color:white; border-color:white; padding:15px 40px; font-size:1.2rem;">Exit to Menu</a>
          </div>
        `;
      }
    })();
  </script>
</body>

</html>
