<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Mode // TestArena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Battle specific overrides */
    .pin-card {
      background: white;
      padding: 15px 40px;
      border-radius: var(--radius-md);
      display: inline-block;
      margin-bottom: 30px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
      transform: rotate(-2deg);
    }

    .player-pill {
      background: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Teacher Dashboard */
    .teacher-dashboard {
      background: white;
      border-radius: var(--radius-md);
      padding: 30px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 900px;
    }

    .teacher-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--yellow);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .stats-table th {
      padding: 12px 15px;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #888;
      border-bottom: 2px solid #eee;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .stats-table td {
      padding: 14px 15px;
      border-bottom: 1px solid #f4f4f4;
      font-weight: 600;
      color: #333;
    }

    .stats-table tr:hover {
      background: #f9f9ff;
    }

    .progress-bar-bg {
      background: #eee;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      min-width: 80px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .participate-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      padding: 12px 15px;
      background: #f4f4f4;
      border-radius: 10px;
    }

    .participate-toggle input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .participate-toggle label {
      margin: 0;
      text-transform: none;
      font-size: 0.95rem;
      color: #555;
      cursor: pointer;
    }

    /* Rating Screen */
    .rating-screen {
      background: white;
      border-radius: var(--radius-md);
      padding: 30px 30px 20px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 900px;
    }

    .rating-bars-vertical {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 20px;
      height: 260px;
      padding: 20px 0 0;
    }

    .rating-bar-col {
      flex: 1;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      position: relative;
    }

    .rating-bar-fill {
      width: 100%;
      border-radius: 10px 10px 0 0;
      transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 8px;
      position: relative;
    }

    .rating-bar-fill .bar-count {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: 1.1rem;
      color: #333;
      font-family: var(--font-display);
    }

    .rating-bar-label {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #555;
      text-align: center;
      word-break: break-word;
      max-height: 3.6em;
      overflow: hidden;
      line-height: 1.2;
      width: 100%;
    }

    .rating-bar-col.correct-answer .rating-bar-fill {
      box-shadow: 0 0 0 4px var(--green), 0 0 20px rgba(38, 137, 12, 0.3);
    }

    .rating-bar-col.correct-answer .rating-bar-label {
      color: var(--green);
      font-weight: 900;
    }

    /* Horizontal bars */
    .rating-bars-horizontal {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 15px 0;
    }

    .rating-hbar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rating-hbar-label {
      width: 120px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #555;
      text-align: right;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rating-hbar-track {
      flex: 1;
      height: 40px;
      background: #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .rating-hbar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      min-width: 0;
    }

    .rating-hbar-fill .bar-count {
      font-weight: 900;
      font-size: 0.9rem;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .rating-hbar-row.correct-answer .rating-hbar-track {
      box-shadow: 0 0 0 3px var(--green), 0 0 15px rgba(38, 137, 12, 0.25);
    }

    .rating-hbar-row.correct-answer .rating-hbar-label {
      color: var(--green);
      font-weight: 900;
    }

    .rating-timer-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin-top: 15px;
      overflow: hidden;
    }

    .rating-timer-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 3px;
      transition: width 0.3s linear;
    }
  </style>
</head>

<body class="center-content">
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Storage.getUser();
      const roomParam = Utils.getQueryParam('room');

      // State
      let battle = null;
      let myPlayerId = null;
      let battleRef = null;
      let currentQuestion = 0;
      let answers = [];
      let testData = null;
      let timerInterval = null;
      let timeLeft = 0;
      let testStartTime = 0;
      let showingIntermediateResults = false;
      let joinLock = false;
      let isObserver = false;
      let battleTestStarted = false; // Guard against re-entry
      let battleSettings = null;
      let perQuestionTimeLeft = 0;
      let ratingTimeLeft = 0;
      let currentRenderedQuestion = -1; // Track to avoid re-render

      // Color/Shape mapping
      const optionConfigs = [
        { color: 'var(--red)', shape: 'shape-triangle', shadow: 'var(--red-shadow)' },
        { color: 'var(--blue)', shape: 'shape-diamond', shadow: 'var(--blue-shadow)' },
        { color: 'var(--yellow)', shape: 'shape-circle', shadow: 'var(--yellow-shadow)' },
        { color: 'var(--green)', shape: 'shape-square', shadow: 'var(--green-shadow)' }
      ];

      if (roomParam) {
        // Check if returning as observer
        if (localStorage.getItem('battle_is_observer') === 'true' && localStorage.getItem('battle_room') === roomParam) {
          isObserver = true;
        }
        showJoinScreen(roomParam);
      } else {
        showCreateOrJoin();
      }

      function showCreateOrJoin() {
        const tests = Storage.getTests();
        const isAdmin = user && user.role === 'admin';

        document.getElementById('app').innerHTML = `
          <div class="container fade-in" style="text-align:center; max-width:900px; padding-top:40px;">
            <h1 style="font-size:clamp(3rem, 6vw, 4.5rem); margin-bottom:10px; text-shadow:none; color:white; line-height:1;">BATTLE MODE</h1>
            <p style="font-size:1.5rem; color:rgba(255,255,255,0.9); margin-bottom:50px; font-weight:700;">Compete live with your classmates!</p>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:30px; margin-bottom:40px;">
              <div class="card" style="border-top:12px solid var(--blue); text-align:left;">
                <h2 style="color:#222; font-size:2rem; margin-bottom:20px;">Host Game</h2>
                <div class="form-group">
                  <label>Select Challenge</label>
                  <select id="testSelect" class="form-control">
                    ${tests.map(t => `<option value="${t.id}">${Utils.escapeHtml(t.title)}</option>`).join('')}
                  </select>
                </div>
                ${!user ? `
                  <div class="form-group">
                    <label>Your Name</label>
                    <input id="creatorName" class="form-control" placeholder="Prof. X">
                  </div>
                ` : ''}
                ${isAdmin ? `
                  <div class="participate-toggle">
                    <input type="checkbox" id="participateToggle">
                    <label for="participateToggle">Participate in the game (play alongside students)</label>
                  </div>
                ` : ''}
                <button id="createBtn" class="btn btn-primary btn-block" style="font-size:1.2rem; padding:20px; margin-top:20px;">Create Room</button>
              </div>

              <div class="card" style="border-top:12px solid var(--green); text-align:left;">
                <h2 style="color:#222; font-size:2rem; margin-bottom:20px;">Join Game</h2>
                <div class="form-group">
                  <label>Room PIN</label>
                  <input id="roomCode" class="form-control" placeholder="123456" maxlength="6" style="letter-spacing:5px; font-size:1.8rem; text-align:center; font-weight:700; font-family:var(--font-display);">
                </div>
                ${!user ? `
                  <div class="form-group">
                    <label>Your Name</label>
                    <input id="joinName" class="form-control" placeholder="Player 1">
                  </div>
                ` : ''}
                <button id="joinBtn" class="btn btn-success btn-block" style="font-size:1.2rem; padding:20px;">Enter Room</button>
              </div>
            </div>
            
            <a href="tests.html" class="btn btn-outline" style="border:none; color:white; background:rgba(255,255,255,0.1);">Back to Menu</a>
          </div>
        `;

        // Pre-select test if ?test= param provided (e.g. from admin panel Battle button)
        const testParam = Utils.getQueryParam('test');
        if (testParam) {
          const sel = document.getElementById('testSelect');
          if (sel) sel.value = testParam;
        }

        document.getElementById('createBtn').addEventListener('click', () => {
          const testId = document.getElementById('testSelect').value;
          const name = user ? user.name : document.getElementById('creatorName').value.trim();
          if (!name) return alert('Name required');

          if (!user) Storage.setUser({ name, role: 'student' });

          const test = Storage.getTest(testId);
          const b = Storage.createBattle(testId, test.title, test.questions.length, test.timeLimit, name);

          // Check if admin wants to observe
          const participateEl = document.getElementById('participateToggle');
          const wantsToParticipate = participateEl ? participateEl.checked : true;

          if (isAdmin && !wantsToParticipate) {
            // Observer mode — don't join as player
            isObserver = true;
            myPlayerId = null;
            localStorage.removeItem('battle_player_id');
            localStorage.setItem('battle_is_observer', 'true');
          } else {
            // Join as player
            isObserver = false;
            myPlayerId = Storage.joinBattle(b.id, name, user ? (user.group || '') : '');
            localStorage.setItem('battle_player_id', myPlayerId);
            localStorage.setItem('battle_is_observer', 'false');
          }

          localStorage.setItem('battle_room', b.id);
          localStorage.setItem('battle_is_creator', 'true');

          history.replaceState(null, '', 'battle.html?room=' + b.id);
          showLobby(b.id);
        });

        document.getElementById('joinBtn').addEventListener('click', () => {
          const code = document.getElementById('roomCode').value.trim().toUpperCase();
          const name = user ? user.name : document.getElementById('joinName').value.trim();
          if (!code || !name) return alert('PIN and Name required');

          if (!user) Storage.setUser({ name, role: 'student' });
          showJoinScreen(code);
        });
      }

      function showJoinScreen(roomCode) {
        // Observer returning
        if (isObserver) {
          showLobby(roomCode);
          return;
        }

        const savedRoom = localStorage.getItem('battle_room');
        const savedPlayerId = localStorage.getItem('battle_player_id');

        if (savedRoom === roomCode && savedPlayerId) {
          myPlayerId = savedPlayerId;
          showLobby(roomCode);
          return;
        }

        const name = user ? user.name : prompt("Enter your nickname:");
        if (!name) return;

        if (!user) Storage.setUser({ name, role: 'student' });

        myPlayerId = Storage.joinBattle(roomCode, name, user ? user.group : '');
        localStorage.setItem('battle_player_id', myPlayerId);
        localStorage.setItem('battle_room', roomCode);
        localStorage.setItem('battle_is_creator', 'false');
        localStorage.setItem('battle_is_observer', 'false');
        showLobby(roomCode);
      }

      function showLobby(roomCode) {
        const isCreator = localStorage.getItem('battle_is_creator') === 'true';

        if (battleRef) Storage.offBattleChange(battleRef);
        battleRef = Storage.onBattleChange(roomCode, (data) => {
          if (!data) return;
          battle = data;
          battleSettings = data.battleSettings || null;

          if (data.status === 'countdown' && !showingIntermediateResults) {
            if (isObserver) {
              showTeacherCountdown(roomCode);
            } else {
              showCountdown(roomCode);
            }
            return;
          }
          if (data.status === 'active' && !showingIntermediateResults) {
            if (isObserver) {
              renderTeacherDashboard(roomCode);
            } else if (!battleTestStarted) {
              startBattleTest(roomCode);
            } else {
              // Only update timer display, not full re-render
              const timerEl = document.querySelector('.timer-circle');
              if (timerEl) {
                const bs = battleSettings;
                if (bs && bs.perQuestionMode) {
                  timerEl.textContent = perQuestionTimeLeft;
                } else {
                  timerEl.textContent = timeLeft;
                }
              }
            }
            return;
          }
          if (data.status === 'showing_rating') {
            if (isObserver) {
              renderTeacherRating(roomCode);
            }
            // Students see their own rating via local control
            return;
          }
          if (data.status === 'finished') {
            if (isObserver) {
              showTeacherResults(roomCode);
            } else {
              showFinalResults(roomCode);
            }
            return;
          }

          renderLobby(roomCode, data, isCreator);
        });
      }

      function renderLobby(roomCode, data, isCreator) {
        const players = data.players ? Object.values(data.players) : [];
        const joinUrl = location.protocol + '//' + location.host + location.pathname + '?room=' + roomCode;
        const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=' + encodeURIComponent(joinUrl) + '&margin=10&format=png';

        document.getElementById('app').innerHTML = `
          <div class="container fade-in" style="text-align:center; padding-top:40px;">
             ${isObserver ? `<div style="display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.45); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); padding:5px 14px; border-radius:20px; margin-bottom:18px;">👁 Observer mode</div>` : ''}

             <div class="pin-card">
               <div style="font-size:1rem; color:#888; font-weight:800; text-transform:uppercase;">Game PIN</div>
               <div style="font-size:5rem; font-weight:900; letter-spacing:8px; line-height:1; font-family:var(--font-display);">${roomCode}</div>

               <div style="margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:12px;">
                 <img src="${qrSrc}" alt="QR" style="width:min(420px,80vw); height:min(420px,80vw); border-radius:20px; box-shadow:0 8px 32px rgba(0,0,0,0.22); display:block;">
                 <span style="font-size:0.78rem; color:#aaa; font-weight:700; text-transform:uppercase; letter-spacing:1.5px;">Scan to join</span>
                 <button id="copyLinkBtn" style="margin-top:4px; background:var(--blue); color:white; border:none; border-radius:12px; padding:12px 28px; font-weight:800; font-size:1rem; cursor:pointer; box-shadow:0 4px 0 var(--blue-shadow);">&#128279; Copy Link</button>
               </div>
             </div>

             <h2 style="color:white; margin-bottom:40px; font-size:2.2rem; text-shadow:0 2px 0 rgba(0,0,0,0.2);">Waiting for players...</h2>
             
             <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:30px; margin-bottom:60px; min-height:150px;">
               ${players.map((p, i) => `
                 <div class="avatar-bounce" style="text-align:center; animation-delay:${i * 0.1}s;">
                   <div class="avatar" style="width:80px; height:80px; font-size:2rem; background:white; color:#333; margin:0 auto 10px; border:4px solid white; box-shadow:0 6px 0 rgba(0,0,0,0.2);">
                     ${p.name.charAt(0).toUpperCase()}
                   </div>
                   <div class="player-pill">
                     ${Utils.escapeHtml(p.name)}
                   </div>
                 </div>
               `).join('')}
             </div>

             <div style="color:rgba(255,255,255,0.8); font-weight:800; font-size:1.8rem; margin-bottom:40px;">
               ${players.length} Player${players.length !== 1 ? 's' : ''} Ready
             </div>

             ${isCreator ? `
               <button id="startBtn" class="btn btn-primary" style="font-size:2rem; padding:24px 80px; box-shadow: 0 10px 0 var(--blue-shadow); border-radius:var(--radius-lg);">start game</button>
             ` : `
               <div style="color:white; font-size:1.4rem; background:rgba(0,0,0,0.3); padding:20px 40px; border-radius:40px; display:inline-block; backdrop-filter:blur(10px);">
                 Host will start the game soon...
               </div>
             `}
          </div>
        `;

        document.getElementById('copyLinkBtn').addEventListener('click', function () {
          navigator.clipboard.writeText(joinUrl).then(() => {
            this.textContent = '✓ Copied!';
            setTimeout(() => { this.innerHTML = '&#128279; Copy Link'; }, 2000);
          }).catch(() => {
            prompt('Copy this link:', joinUrl);
          });
        });

        if (isCreator) {
          document.getElementById('startBtn').addEventListener('click', () => Storage.startBattle(roomCode));
        }
      }

      // ——— TEACHER OBSERVER VIEWS ———

      function showTeacherCountdown(roomCode) {
        let count = 3;
        const render = () => {
          document.getElementById('app').innerHTML = `
            <div class="center-content" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
              <div class="teacher-badge" style="margin-bottom:30px;">👁️ OBSERVER MODE</div>
              <div style="font-size:clamp(10rem, 30vw, 20rem); font-weight:900; color:white; text-shadow:0 10px 0 rgba(0,0,0,0.2); animation:popIn 0.5s; font-family:var(--font-display); line-height:1;">${count === 0 ? 'GO!' : count}</div>
              <h2 style="color:white; margin-top:40px; font-size:clamp(1.5rem, 4vw, 3rem); text-align:center; max-width:800px;">${Utils.escapeHtml(battle.testTitle)}</h2>
            </div>
          `;
        };
        render();
        const iv = setInterval(() => {
          count--;
          if (count < 0) { clearInterval(iv); return; }
          render();
        }, 1000);
      }

      function renderTeacherDashboard(roomCode) {
        if (!battle) return;
        const players = battle.players ? Object.values(battle.players) : [];
        testData = testData || Storage.getTest(battle.testId);
        if (!testData) return;

        const totalQ = testData.questions.length;
        const allFinished = players.length > 0 && players.every(p => p.finished);
        const finishedCount = players.filter(p => p.finished).length;
        const avgProgress = players.length > 0
          ? Math.round(players.reduce((sum, p) => sum + (p.answeredCount || 0), 0) / players.length)
          : 0;

        document.getElementById('app').innerHTML = `
          <div class="container fade-in" style="text-align:center; padding-top:30px; max-width:950px;">
            <div class="teacher-badge">👁️ LIVE DASHBOARD — ${Utils.escapeHtml(battle.testTitle)}</div>

            <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin:20px 0 30px;">
              <div style="background:rgba(255,255,255,0.15); padding:12px 25px; border-radius:12px; color:white; font-weight:800;">
                <div style="font-size:0.75rem; opacity:0.7; text-transform:uppercase; margin-bottom:4px;">Players</div>
                <div style="font-size:1.8rem; font-family:var(--font-display);">${players.length}</div>
              </div>
              <div style="background:rgba(255,255,255,0.15); padding:12px 25px; border-radius:12px; color:white; font-weight:800;">
                <div style="font-size:0.75rem; opacity:0.7; text-transform:uppercase; margin-bottom:4px;">Finished</div>
                <div style="font-size:1.8rem; font-family:var(--font-display);">${finishedCount}/${players.length}</div>
              </div>
              <div style="background:rgba(255,255,255,0.15); padding:12px 25px; border-radius:12px; color:white; font-weight:800;">
                <div style="font-size:0.75rem; opacity:0.7; text-transform:uppercase; margin-bottom:4px;">Avg Progress</div>
                <div style="font-size:1.8rem; font-family:var(--font-display);">${avgProgress}/${totalQ}</div>
              </div>
              <div style="background:rgba(255,255,255,0.15); padding:12px 25px; border-radius:12px; color:white; font-weight:800;">
                <div style="font-size:0.75rem; opacity:0.7; text-transform:uppercase; margin-bottom:4px;">Questions</div>
                <div style="font-size:1.8rem; font-family:var(--font-display);">${totalQ}</div>
              </div>
            </div>

            <div class="teacher-dashboard">
              <table class="stats-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Group</th>
                    <th>Progress</th>
                    <th style="text-align:center;">Correct</th>
                    <th style="text-align:center;">Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${players.sort((a, b) => (b.correctCount || 0) - (a.correctCount || 0)).map((p, i) => {
          const answered = p.answeredCount || 0;
          const correct = p.correctCount || 0;
          const pct = Math.round((answered / totalQ) * 100);
          const isFinished = p.finished;
          const barColor = isFinished ? 'var(--green)' : 'var(--blue)';
          const statusColor = isFinished ? '#26890C' : '#D89E00';

      // ——— STUDENT VIEWS (unchanged) ———

      function showCountdown(roomCode) {
        let count = 3;
        const render = () => {
          document.getElementById('app').innerHTML = `
            <div class="center-content" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
              <div style="font-size:clamp(10rem, 30vw, 20rem); font-weight:900; color:white; text-shadow:0 10px 0 rgba(0,0,0,0.2); animation:popIn 0.5s; font-family:var(--font-display); line-height:1;">${count === 0 ? 'GO!' : count}</div>
              <h2 style="color:white; margin-top:40px; font-size:clamp(1.5rem, 4vw, 3rem); text-align:center; max-width:800px;">${Utils.escapeHtml(battle.testTitle)}</h2>
              ${count > 0 ? `<div style="width:100%; position:fixed; bottom:0; height:20px; background:rgba(255,255,255,0.1);">
                <div style="width:${(count / 3) * 100}%; height:100%; background:var(--yellow); transition:width 1s linear;"></div>
              </div>` : ''}
            </div>
          `;
        };
        render();
        const iv = setInterval(() => {
          count--;
          if (count < 0) {
            clearInterval(iv);
            return;
          }
          render();
        }, 1000);
      }

      function startBattleTest(roomCode) {
        if (battleTestStarted) return;
        battleTestStarted = true;
        testData = Storage.getTest(battle.testId);
        if (!testData) return;
        const bs = battleSettings;
        answers = new Array(testData.questions.length).fill(-1);
        currentQuestion = 0;
        currentRenderedQuestion = -1;
        testStartTime = Date.now();
        if (bs && bs.perQuestionMode) {
          perQuestionTimeLeft = bs.perQuestionTime || 20;
          renderBattleQuestion(roomCode);
          startPerQuestionTimer(roomCode);
        } else {
          timeLeft = testData.timeLimit;
          renderBattleQuestion(roomCode);
          timerInterval = setInterval(() => {
            timeLeft--;
            const te = document.querySelector('.timer-circle');
            if (te) { te.textContent = timeLeft; if (timeLeft <= 10) te.style.background = 'var(--red)'; }
            if (timeLeft <= 0) finishBattleTest(roomCode);
          }, 1000);
        }
      }

      function startPerQuestionTimer(roomCode) {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          perQuestionTimeLeft--;
          const te = document.querySelector('.timer-circle');
          if (te) { te.textContent = perQuestionTimeLeft; if (perQuestionTimeLeft <= 5) te.style.background = 'var(--red)'; }
          if (perQuestionTimeLeft <= 0) {
            clearInterval(timerInterval); timerInterval = null;
            Storage.saveBattleAnswer(roomCode, myPlayerId, currentQuestion, answers[currentQuestion]);
            let cc = 0;
            answers.forEach((a, i) => { if (a >= 0 && a === testData.questions[i].correct) cc++; });
            Storage.updateBattlePlayer(roomCode, myPlayerId, { currentQuestion, correctCount: cc, answeredCount: answers.filter(a => a >= 0).length });
            showingIntermediateResults = true;
            renderRatingScreen(roomCode, currentQuestion);
          }
        }, 1000);
      }

      function renderBattleQuestion(roomCode) {
        if (showingIntermediateResults) return;
        if (currentRenderedQuestion === currentQuestion) return;
        currentRenderedQuestion = currentQuestion;
        const q = testData.questions[currentQuestion];
        const bs = battleSettings;
        const displayTime = (bs && bs.perQuestionMode) ? perQuestionTimeLeft : timeLeft;

        document.getElementById('app').innerHTML = `
          <div class="container center-content" style="max-width:1000px; padding-top:20px; width:100%;">
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center; margin-bottom:30px;">
               <div style="background:rgba(0,0,0,0.3); color:white; padding:10px 25px; border-radius:30px; font-weight:900; font-family:var(--font-display); font-size:1.2rem;">
                 ${currentQuestion + 1} / ${testData.questions.length}
               </div>
               <div class="timer-circle" style="margin:0;">${displayTime}</div>
            </div>

            <div class="question-card ${q.imageUrl ? 'question-card--with-img' : ''}">
              ${q.imageUrl ? `
                <div class="question-image-wrap">
                  <img src="${Utils.escapeHtml(q.imageUrl)}" class="question-image" alt="Question image" onerror="this.parentElement.style.display='none'">
                </div>
                <div class="question-card__text">${Utils.escapeHtml(q.text)}</div>
              ` : Utils.escapeHtml(q.text)}
            </div>

            <div class="answer-grid">
              ${q.options.map((opt, i) => {
          const cfg = optionConfigs[i % 4];
          return `<button onclick="selectAnswer(${i})" class="btn answer-btn pop-in" 
                    style="background:${cfg.color}; border-bottom-color:${cfg.shadow}; animation-delay:${i * 0.1}s;">
                    <span class="shape-icon ${cfg.shape}"></span>
                    <span>${Utils.escapeHtml(opt)}</span>
                  </button>`;
        }).join('')}
            </div>
          </div>
        `;
      }

      function buildChartHtml(q, qIndex, bs, players) {
        const chartType = (bs && bs.chartType) || 'vertical-bar';
        const showCorrect = !bs || bs.showCorrectAnswer !== false;
        const showCount = !bs || bs.showPlayerCount !== false;
        const totalPlayers = players.length || 1;
        const counts = new Array(q.options.length).fill(0);
        players.forEach(p => {
          if (p.answers && p.answers[qIndex] !== undefined && p.answers[qIndex] >= 0) {
            counts[p.answers[qIndex]]++;
          }
        });
        const maxCount = Math.max(...counts, 1);
        if (chartType === 'horizontal-bar') {
          return `<div class="rating-bars-horizontal">${q.options.map((opt, i) => {
            const cfg = optionConfigs[i % 4];
            const pct = Math.round((counts[i] / totalPlayers) * 100);
            const ic = showCorrect && i === q.correct;
            return `<div class="rating-hbar-row ${ic ? 'correct-answer' : ''}">
              <div class="rating-hbar-label">${Utils.escapeHtml(opt)}</div>
              <div class="rating-hbar-track"><div class="rating-hbar-fill" style="width:0%;background:${cfg.color};" data-target-width="${pct}%">${showCount ? `<span class="bar-count">${counts[i]}</span>` : ''}</div></div>
            </div>`;
          }).join('')}</div>`;
        }
        return `<div class="rating-bars-vertical">${q.options.map((opt, i) => {
          const cfg = optionConfigs[i % 4];
          const pct = maxCount > 0 ? Math.round((counts[i] / maxCount) * 100) : 0;
          const ic = showCorrect && i === q.correct;
          return `<div class="rating-bar-col ${ic ? 'correct-answer' : ''}">
            <div class="rating-bar-fill" style="height:0%;background:${cfg.color};" data-target-height="${pct}%">${showCount ? `<span class="bar-count">${counts[i]}</span>` : ''}</div>
            <div class="rating-bar-label">${Utils.escapeHtml(opt)}</div>
          </div>`;
        }).join('')}</div>`;
      }

      function renderRatingScreen(roomCode, qIndex) {
        const q = testData.questions[qIndex];
        const bs = battleSettings || {};
        const ratingDuration = bs.ratingDuration || 4;
        const ratingTitle = bs.ratingTitle || '\u0420\u0430\u0441\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u0438\u0435 \u043e\u0442\u0432\u0435\u0442\u043e\u0432';
        const players = battle && battle.players ? Object.values(battle.players) : [];
        const chartHtml = buildChartHtml(q, qIndex, bs, players);

        document.getElementById('app').innerHTML = `
          <div class="container center-content fade-in" style="max-width:950px;padding-top:20px;text-align:center;">
            <div style="background:rgba(0,0,0,0.3);color:white;padding:10px 25px;border-radius:30px;font-weight:900;font-family:var(--font-display);font-size:1rem;margin-bottom:15px;">
              \u0412\u043e\u043f\u0440\u043e\u0441 ${qIndex + 1} / ${testData.questions.length}
            </div>
            <div class="rating-screen">
              <h3 style="margin:0 0 5px;color:#888;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">${Utils.escapeHtml(ratingTitle)}</h3>
              <p style="font-size:1.1rem;font-weight:800;color:#333;margin-bottom:15px;line-height:1.3;">${Utils.escapeHtml(q.text)}</p>
              ${chartHtml}
              <div class="rating-timer-bar"><div class="rating-timer-fill" id="ratingTimerFill" style="width:100%;"></div></div>
            </div>
          </div>`;
        requestAnimationFrame(() => {
          setTimeout(() => {
            document.querySelectorAll('[data-target-height]').forEach(el => { el.style.height = el.dataset.targetHeight; });
            document.querySelectorAll('[data-target-width]').forEach(el => { el.style.width = el.dataset.targetWidth; });
          }, 50);
        });
        ratingTimeLeft = ratingDuration;
        const ratingIv = setInterval(() => {
          ratingTimeLeft--;
          const fill = document.getElementById('ratingTimerFill');
          if (fill) fill.style.width = `${(ratingTimeLeft / ratingDuration) * 100}%`;
          if (ratingTimeLeft <= 0) {
            clearInterval(ratingIv);
            showingIntermediateResults = false;
            if (currentQuestion < testData.questions.length - 1) {
              currentQuestion++;
              currentRenderedQuestion = -1;
              perQuestionTimeLeft = (battleSettings && battleSettings.perQuestionTime) || 20;
              renderBattleQuestion(roomCode);
              startPerQuestionTimer(roomCode);
            } else {
              finishBattleTest(roomCode);
            }
          }
        }, 1000);
      }

            <div class="rating-screen" style="margin-top:20px;">
              <h3 style="margin:0 0 5px;color:#888;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">${Utils.escapeHtml(ratingTitle)}</h3>

              ${chartHtml}
              <p style="margin-top:15px;color:#999;font-size:0.85rem;">${players.length} \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u043e\u0432</p>

          </div>`;

          }, 50);

      window.selectAnswer = function (index) {
        if (answers[currentQuestion] !== -1) return;
        answers[currentQuestion] = index;
        // Visual feedback via DOM, no re-render
        document.querySelectorAll('.answer-btn').forEach((btn, i) => {
          if (i === index) { btn.style.transform = 'scale(0.98)'; btn.style.opacity = '1'; }
          else { btn.style.opacity = '0.3'; }
        });
        let correctCount = 0;
        answers.forEach((a, i) => { if (a >= 0 && a === testData.questions[i].correct) correctCount++; });
        const room = localStorage.getItem('battle_room');
        const bs = battleSettings;
        if (bs && bs.perQuestionMode) {
          Storage.saveBattleAnswer(room, myPlayerId, currentQuestion, index);
          Storage.updateBattlePlayer(room, myPlayerId, { currentQuestion, correctCount, answeredCount: answers.filter(a => a >= 0).length });
        } else {
          Storage.updateBattlePlayer(room, myPlayerId, { currentQuestion, correctCount, answeredCount: answers.filter(a => a >= 0).length });
          setTimeout(() => {
            if (currentQuestion < testData.questions.length - 1) {
              currentQuestion++;
              currentRenderedQuestion = -1;
              renderBattleQuestion(room);
            } else {
              finishBattleTest(room);
            }
          }, 500);
        }
      };

      function finishBattleTest(roomCode) {
        clearInterval(timerInterval);
        timerInterval = null;

        let correctCount = 0;
        answers.forEach((a, i) => {
          if (a >= 0 && a === testData.questions[i].correct) correctCount++;
        });

        const timeSpent = Math.round((Date.now() - testStartTime) / 1000);

        Storage.updateBattlePlayer(roomCode, myPlayerId, {
          finished: true,
          finishedAt: Date.now(),
          correctCount: correctCount,
          timeSpent: timeSpent
        });

        // Wait screen
        document.getElementById('app').innerHTML = `
           <div class="container fade-in center-content" style="text-align:center;">
             <h1 style="color:white; font-size:clamp(3rem, 5vw, 4rem); margin-bottom:20px;">FINISHED!</h1>
             <div class="card" style="display:inline-block; min-width:320px; border-top:10px solid var(--primary);">
               <div style="font-size:1.2rem; color:#888; font-weight:800; text-transform:uppercase;">Your Score</div>
               <div style="font-size:6rem; font-weight:900; color:var(--text-main); font-family:var(--font-display); line-height:1; margin-top:10px;">${correctCount}<span style="font-size:3rem; color:#ccc;">/${testData.questions.length}</span></div>
             </div>
             <p style="color:rgba(255,255,255,0.8); font-size:1.5rem; margin-top:40px; font-weight:700;">Waiting for others...</p>
           </div>
         `;

        // Host checks if all finished
        const isCreator = localStorage.getItem('battle_is_creator') === 'true';
        if (isCreator) {
          const checkAll = setInterval(() => {
            if (!battle || !battle.players) return;
            const players = Object.values(battle.players);
            if (players.every(p => p.finished)) {
              clearInterval(checkAll);
              Storage.finishBattle(roomCode);
            }
          }, 1000);
        }
      }

              </div>

              ${p3 ? `
                <div class="podium-bar pop-in" style="animation-delay:0.4s; max-width:140px;">
                   <div class="avatar" style="margin-bottom:15px; background:#CD7F32; color:white; width:70px; height:70px; font-size:1.8rem;">${p3.name.charAt(0)}</div>
                   <div class="podium-rank-3" style="width:100%; border-radius:12px 12px 0 0; display:flex; align-items:flex-end; justify-content:center; padding-bottom:15px; font-weight:900; color:white; font-size:2.5rem; box-shadow:0 6px 0 rgba(0,0,0,0.2);">3</div>
                   <div style="background:white; color:#333; width:100%; padding:10px 5px; font-weight:800; border-radius:0 0 8px 8px; font-size:1rem; margin-top:4px;">${Utils.escapeHtml(p3.name)}</div>
                   <div style="color:white; font-weight:700; margin-top:10px; font-family:var(--font-display);">${p3.correctCount} pts</div>
                </div>
              ` : ''}
            </div>

            <a href="tests.html" class="btn btn-outline" style="color:white; border-color:white; background:rgba(255,255,255,0.1); padding:20px 40px; font-size:1.4rem;">Exit to Menu</a>
          </div>
        `;
      }
    })();
  </script>
</body>
