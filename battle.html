<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle_Mode // TestArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .battle-glow {
      animation: textGlow 2s infinite alternate;
    }

    @keyframes textGlow {
      from {
        text-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
      }

      to {
        text-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
      }
    }
  </style>
</head>

<body>
  <div id="app" class="container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/sample-tests.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Storage.initFirebase();
    (function () {
      const user = Storage.getUser();
      const roomParam = Utils.getQueryParam('room');

      // State
      let battle = null;
      let myPlayerId = null;
      let battleRef = null;
      let currentQuestion = 0;
      let answers = [];
      let testData = null;
      let timerInterval = null;
      let timeLeft = 0;
      let testStartTime = 0;
      let questionStartTimes = [];
      let showingIntermediateResults = false;
      let intermediateShownAt = new Set(); // track which checkpoints we've shown
      let joinLock = false; // prevent double-joining

      if (!Storage.isOnline()) {
        document.getElementById('app').innerHTML = `
          <div class="hero fade-in">
            <h1 class="battle-glow">OFFLINE_MODE_DETECTED</h1>
            <div class="card" style="max-width:500px;margin:0 auto;text-align:center;">
              <p style="color:var(--danger);font-family:var(--font-mono);">NETWORK CONNECTION REQUIRED FOR BATTLE MODE.</p>
              <a href="tests.html" class="btn" style="margin-top:20px;">RETURN TO BASE</a>
            </div>
          </div>
        `;
        return;
      }

      // If we have a room code, go directly to join/lobby
      if (roomParam) {
        showJoinScreen(roomParam);
      } else {
        showCreateOrJoin();
      }

      // ============ SCREENS ============

      function showCreateOrJoin() {
        const tests = Storage.getTests();
        document.getElementById('app').innerHTML = `
          ${user ? Utils.renderHeader(user, 'battle') : ''}
          <div class="container fade-in" style="max-width:800px;">
            <div style="text-align:center;margin:30px 0 40px;">
              <h1 class="battle-glow" style="font-size:3rem; margin-bottom: 8px;">BATTLE_MODE</h1>
              <p class="mono" style="color:var(--text-muted); text-transform:uppercase;">Real-time competitive assessment protocol</p>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 24px;">
              <div class="card" style="margin-bottom:0;">
                <div class="card-header">INITIATE_SESSION</div>
                ${!user ? `
                  <div class="form-group">
                    <label for="creatorName">OPERATOR_NAME</label>
                    <input type="text" id="creatorName" class="form-control" placeholder="ENTER IDENTIFIER" -required maxlength="50">
                  </div>
                  <div class="form-group">
                    <label for="creatorGroup">UNIT (OPTIONAL)</label>
                    <input type="text" id="creatorGroup" class="form-control" placeholder="UNIT-01" maxlength="30">
                  </div>
                ` : ''}
                <div class="form-group">
                  <label for="testSelect">SELECT_MODULE</label>
                  <select id="testSelect" class="form-control" style="font-family:var(--font-mono);">
                    ${tests.map(t => `<option value="${t.id}">${Utils.escapeHtml(t.title)} [${t.questions.length} PTS]</option>`).join('')}
                  </select>
                </div>
                <button id="createBtn" class="btn btn-block" style="background:var(--primary); color:white; margin-top:24px;">CREATE ROOM</button>
              </div>

              <div class="card" style="margin-bottom:0;">
                <div class="card-header">JOIN_SESSION</div>
                ${!user ? `
                  <div class="form-group">
                    <label for="joinName">OPERATOR_NAME</label>
                    <input type="text" id="joinName" class="form-control" placeholder="ENTER IDENTIFIER" required maxlength="50">
                  </div>
                  <div class="form-group">
                    <label for="joinGroup">UNIT (OPTIONAL)</label>
                    <input type="text" id="joinGroup" class="form-control" placeholder="UNIT-01" maxlength="30">
                  </div>
                ` : ''}
                <div class="form-group">
                  <label for="roomCode">ACCESS_CODE</label>
                  <input type="text" id="roomCode" class="form-control" placeholder="X-X-X-X" maxlength="6" style="text-transform:uppercase;font-size:1.5rem;text-align:center;letter-spacing:6px;font-weight:700; font-family:var(--font-mono);">
                </div>
                <button id="joinBtn" class="btn btn-outline btn-block" style="margin-top:24px;">CONNECT</button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('createBtn').addEventListener('click', function () {
          this.disabled = true;
          this.textContent = 'INITIALIZING...';
          let name, group;
          if (user) {
            name = user.name;
            group = user.group;
          } else {
            name = document.getElementById('creatorName').value.trim();
            group = document.getElementById('creatorGroup') ? document.getElementById('creatorGroup').value.trim() : '';
            if (!name) { alert('NAME REQUIRED'); this.disabled = false; this.textContent = 'CREATE ROOM'; return; }
            Storage.setUser({ name, group, role: 'student' });
          }
          const testId = document.getElementById('testSelect').value;
          const test = Storage.getTest(testId);
          if (!test) { alert('MODULE NOT FOUND'); this.disabled = false; this.textContent = 'CREATE ROOM'; return; }

          const b = Storage.createBattle(testId, test.title, test.questions.length, test.timeLimit, name);
          myPlayerId = Storage.joinBattle(b.id, name, group);
          joinLock = true;
          localStorage.setItem('battle_player_id', myPlayerId);
          localStorage.setItem('battle_room', b.id);
          localStorage.setItem('battle_is_creator', 'true');

          // Update URL without reload
          history.replaceState(null, '', 'battle.html?room=' + b.id);
          showLobby(b.id);
        });

        document.getElementById('joinBtn').addEventListener('click', function () {
          const code = document.getElementById('roomCode').value.trim().toUpperCase();
          if (!code || code.length < 4) { alert('INVALID CODE'); return; }
          this.disabled = true;
          this.textContent = 'CONNECTING...';
          showJoinScreen(code);
        });
      }

      function showJoinScreen(roomCode) {
        // Check if we're already in this room
        const savedRoom = localStorage.getItem('battle_room');
        const savedPlayerId = localStorage.getItem('battle_player_id');
        if (savedRoom === roomCode && savedPlayerId) {
          myPlayerId = savedPlayerId;
          showLobby(roomCode);
          return;
        }

        // Need to join
        let name, group;
        if (user) {
          name = user.name;
          group = user.group || '';
        } else {
          // Show name input
          document.getElementById('app').innerHTML = `
            <div class="hero fade-in">
              <h1 class="battle-glow">AUTHENTICATION</h1>
              <p class="mono" style="color:var(--text-muted);">TARGET_SESSION: <strong style="color:var(--primary);">${Utils.escapeHtml(roomCode)}</strong></p>
              <div class="card" style="max-width:420px;margin:20px auto 0;">
                <div class="card-header">OPERATOR_DETAILS</div>
                <div class="form-group">
                  <label for="playerName">OPERATOR_NAME</label>
                  <input type="text" id="playerName" class="form-control" placeholder="ENTER IDENTIFIER" required maxlength="50">
                </div>
                <div class="form-group">
                  <label for="playerGroup">UNIT (OPTIONAL)</label>
                  <input type="text" id="playerGroup" class="form-control" placeholder="UNIT-01" maxlength="30">
                </div>
                <button id="enterBtn" class="btn btn-primary btn-block">JOIN SESSION</button>
              </div>
            </div>
          `;
          document.getElementById('enterBtn').addEventListener('click', function () {
            const n = document.getElementById('playerName').value.trim();
            const g = document.getElementById('playerGroup').value.trim();
            if (!n) { alert('NAME REQUIRED'); return; }
            this.disabled = true;
            this.textContent = 'CONNECTING...';
            Storage.setUser({ name: n, group: g, role: 'student' });
            doJoin(roomCode, n, g);
          });
          return;
        }
        doJoin(roomCode, name, group);
      }

      function doJoin(roomCode, name, group) {
        // Prevent double-join
        if (joinLock || myPlayerId) {
          if (myPlayerId) showLobby(roomCode);
          return;
        }
        joinLock = true;

        // One-time check if room exists (NOT a persistent listener)
        Storage.getBattleOnce(roomCode, (data) => {
          if (!data) {
            joinLock = false;
            document.getElementById('app').innerHTML = `
              <div class="hero fade-in">
                <h1>SESSION_NOT_FOUND</h1>
                <div class="card" style="max-width:500px;margin:20px auto 0;text-align:center;">
                  <p class="mono" style="color:var(--danger);">SESSION ${Utils.escapeHtml(roomCode)} INVALID OR EXPIRED.</p>
                  <a href="battle.html" class="btn btn-primary" style="margin-top:20px;">RETURN</a>
                </div>
              </div>
            `;
            return;
          }

          if (data.status !== 'waiting') {
            joinLock = false;
            document.getElementById('app').innerHTML = `
              <div class="hero fade-in">
                <h1>SESSION_LOCKED</h1>
                <div class="card" style="max-width:500px;margin:20px auto 0;text-align:center;">
                  <p class="mono" style="color:var(--warning);">SESSION IN PROGRESS OR COMPLETED.</p>
                  <a href="battle.html" class="btn btn-primary" style="margin-top:20px;">NEW SESSION</a>
                </div>
              </div>
            `;
            return;
          }

          // Double-check myPlayerId hasn't been set while waiting for Firebase
          if (myPlayerId) {
            joinLock = false;
            showLobby(roomCode);
            return;
          }

          myPlayerId = Storage.joinBattle(roomCode, name, group);
          localStorage.setItem('battle_player_id', myPlayerId);
          localStorage.setItem('battle_room', roomCode);
          localStorage.setItem('battle_is_creator', 'false');

          showLobby(roomCode);
        });
      }

      function showLobby(roomCode) {
        const isCreator = localStorage.getItem('battle_is_creator') === 'true';

        // Listen to battle changes
        if (battleRef) Storage.offBattleChange(battleRef);
        battleRef = Storage.onBattleChange(roomCode, (data) => {
          if (!data) return;
          battle = data;

          // If battle started, transition to countdown/test
          if (data.status === 'countdown' && !showingIntermediateResults) {
            showCountdown(roomCode);
            return;
          }
          if (data.status === 'active' && !showingIntermediateResults) {
            startBattleTest(roomCode);
            return;
          }
          if (data.status === 'finished') {
            showFinalResults(roomCode);
            return;
          }

          // Render lobby
          renderLobby(roomCode, data, isCreator);
        });
      }

      function renderLobby(roomCode, data, isCreator) {
        const players = data.players ? Object.values(data.players) : [];
        const shareUrl = window.location.origin + window.location.pathname + '?room=' + roomCode;

        document.getElementById('app').innerHTML = `
          ${Storage.getUser() ? Utils.renderHeader(Storage.getUser(), 'battle') : ''}
          <div class="container fade-in" style="max-width:600px;">
            <div style="text-align:center;margin:20px 0;">
              <h2 class="battle-glow" style="margin-bottom:8px;">WAITING FOR DEPLOYMENT</h2>
              <p class="mono" style="color:var(--text-muted); text-transform:uppercase;">MODULE: <strong>${Utils.escapeHtml(data.testTitle)}</strong></p>
            </div>

            <div class="card battle-room-card" style="text-align:center;margin-bottom:20px; border:2px dashed var(--text-muted);">
              <div style="margin-bottom:24px;">
                <div class="mono" style="color:var(--text-muted);font-size:0.8rem;margin-bottom:8px;">SESSION_CODE</div>
                <div class="room-code-display" style="font-family:var(--font-mono); font-size:3rem; letter-spacing:8px; font-weight:700; color:var(--primary); line-height:1;">${roomCode}</div>
              </div>
              <div style="margin-bottom:8px;">
                <div class="mono" style="color:var(--text-muted);font-size:0.8rem;margin-bottom:4px;">SECURE_LINK</div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <input type="text" value="${shareUrl}" class="form-control" style="font-size:0.8rem;text-align:center; font-family:var(--font-mono);" readonly id="shareUrl">
                  <button onclick="copyLink()" class="btn btn-sm btn-outline" id="copyBtn">COPY</button>
                </div>
              </div>
            </div>

            <div class="card" style="margin-bottom:20px;">
              <div class="card-header">OPERATORS_DETECTED [${players.length}]</div>
              <div class="battle-players-list">
                ${players.map((p, i) => `
                  <div class="battle-player-item" style="display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border);">
                    <div class="battle-player-avatar" style="width:32px; height:32px; background:var(--bg-secondary); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-mono);">${p.name.charAt(0).toUpperCase()}</div>
                    <div>
                      <div style="font-weight:700;">${Utils.escapeHtml(p.name)}</div>
                      ${p.group ? `<div class="mono" style="color:var(--text-muted);font-size:0.7rem;">${Utils.escapeHtml(p.group)}</div>` : ''}
                    </div>
                    ${p.name === data.createdBy ? '<span class="mono" style="margin-left:auto; font-size:0.7rem; color:var(--primary); border:1px solid var(--primary); padding:2px 6px;">HOST</span>' : ''}
                  </div>
                `).join('')}
              </div>
              ${players.length < 2 ? `
                <p class="mono" style="color:var(--text-muted);text-align:center;margin-top:24px;font-size:0.8rem;">
                  // AWAITING ADDITIONAL OPERATORS...
                </p>
              ` : ''}
            </div>

            ${isCreator ? `
              <button id="startBattleBtn" class="btn btn-block btn-lg" style="background:var(--success); color:var(--bg);" ${players.length < 2 ? 'disabled style="opacity:0.5;"' : ''}>
                INITIATE SEQUENCE [${players.length} READY]
              </button>
            ` : `
              <div style="text-align:center;color:var(--text-muted);padding:20px;">
                <div class="battle-waiting-pulse" style="width:10px; height:10px; background:var(--primary); border-radius:50%; margin:0 auto 12px; animation:blink 1s infinite;"></div>
                <div class="mono" style="font-size:0.9rem;">AWAITING HOST SIGNAL...</div>
              </div>
            `}
          </div>
        `;

        if (isCreator && players.length >= 2) {
          document.getElementById('startBattleBtn').addEventListener('click', () => {
            Storage.startBattle(roomCode);
          });
        }
      }

      window.copyLink = function () {
        const input = document.getElementById('shareUrl');
        input.select();
        navigator.clipboard.writeText(input.value).then(() => {
          document.getElementById('copyBtn').textContent = 'COPIED';
          setTimeout(() => document.getElementById('copyBtn').textContent = 'COPY', 2000);
        }).catch(() => {
          document.execCommand('copy');
          document.getElementById('copyBtn').textContent = 'COPIED';
        });
      };

      function showCountdown(roomCode) {
        let count = 3;
        const render = () => {
          document.getElementById('app').innerHTML = `
            <div class="battle-countdown-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:80vh;">
              <div class="battle-countdown-number ${count === 0 ? 'go' : ''}" style="font-size:10rem; font-weight:900; font-family:var(--font-display); line-height:1;">${count === 0 ? 'GO' : count}</div>
              <p class="mono" style="color:var(--text-muted);margin-top:20px; text-transform:uppercase;">${battle.testTitle}</p>
            </div>
          `;
        };
        render();
        const iv = setInterval(() => {
          count--;
          if (count < 0) {
            clearInterval(iv);
            return;
          }
          render();
        }, 1000);
      }

      function startBattleTest(roomCode) {
        if (timerInterval) return; // already started
        testData = Storage.getTest(battle.testId);
        if (!testData) return;

        answers = new Array(testData.questions.length).fill(-1);
        questionStartTimes = new Array(testData.questions.length).fill(0);
        currentQuestion = 0;
        timeLeft = testData.timeLimit;
        testStartTime = Date.now();
        questionStartTimes[0] = Date.now();
        showingIntermediateResults = false;
        intermediateShownAt = new Set();

        timerInterval = setInterval(() => {
          timeLeft--;
          updateBattleTimer();
          if (timeLeft <= 0) {
            finishBattleTest(roomCode);
          }
        }, 1000);

        renderBattleQuestion(roomCode);
      }

      function updateBattleTimer() {
        const el = document.getElementById('battle-timer');
        if (!el) return;
        el.textContent = Utils.formatTime(timeLeft);
        if (timeLeft <= 30) el.style.color = 'var(--danger)';
        else if (timeLeft <= 60) el.style.color = 'var(--warning)';
      }

      function renderBattleQuestion(roomCode) {
        if (showingIntermediateResults) return;
        const q = testData.questions[currentQuestion];
        const progress = ((currentQuestion) / testData.questions.length) * 100;
        const players = battle && battle.players ? Object.values(battle.players) : [];

        // Build mini player progress indicators
        const playersProgress = players.map(p => {
          const pct = Math.round((p.answeredCount / testData.questions.length) * 100);
          const isMe = p.id === myPlayerId;
          return `<div class="battle-mini-player ${isMe ? 'me' : ''}" title="${Utils.escapeHtml(p.name)}" style="flex:1; margin-right:4px;">
            <div style="font-size:0.7rem; margin-bottom:2px;" class="mono">${p.name.charAt(0)}</div>
            <div class="battle-mini-bar" style="height:4px; background:var(--bg-secondary); position:relative;">
                <div class="battle-mini-fill" style="position:absolute; top:0; left:0; height:100%; width:${pct}%; background:${isMe ? 'var(--primary)' : 'var(--text-muted)'};"></div>
            </div>
          </div>`;
        }).join('');

        document.getElementById('app').innerHTML = `
          <div class="battle-test-header" style="display:flex; justify-content:space-between; align-items:center; padding: 20px 0; border-bottom: 2px solid var(--text); margin-bottom: 20px;">
            <div class="battle-test-info">
              <span class="badge mono" style="background:var(--danger); color:white; padding:2px 6px;">LIVE_COMBAT</span>
              <span style="font-weight:700; margin-left:12px;">${Utils.escapeHtml(testData.title)}</span>
            </div>
            <div id="battle-timer" class="timer" style="font-variant-numeric:tabular-nums; font-weight:700;">${Utils.formatTime(timeLeft)}</div>
          </div>

          <div class="battle-players-progress" style="display:flex; margin-bottom:40px;">${playersProgress}</div>

          <div class="container slide-in" style="max-width:900px;">
            <div class="progress-bar-container" style="height:2px; background:var(--bg-secondary); margin-bottom:40px;">
              <div class="progress-bar" style="width:${progress}%; height:100%; background:var(--text); transition:width 0.3s ease;"></div>
            </div>

            <div class="question-container">
               <div class="mono" style="margin-bottom: 16px; color: var(--primary); font-weight: 700;">
                TARGET ${currentQuestion + 1} / ${testData.questions.length}
              </div>
              <div class="question-text" style="font-weight:800; margin-bottom:32px;">${Utils.escapeHtml(q.text)}</div>
              <div class="options-list" style="display:grid; gap:12px;">
                ${q.options.map((opt, i) => `
                  <button class="option-btn ${answers[currentQuestion] === i ? 'selected' : ''}"
                          onclick="battleSelectAnswer(${i})" style="text-align:left; padding:16px;">
                    <span class="mono" style="opacity:0.5; margin-right:12px;">0${i + 1}</span> ${Utils.escapeHtml(opt)}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="question-nav" style="margin-top:60px; display:flex; justify-content:space-between; padding-top:24px; border-top:2px solid var(--text);">
              <button onclick="battlePrev()" class="btn btn-outline btn-sm" ${currentQuestion === 0 ? 'disabled style="opacity:0;pointer-events:none"' : ''}>
                PREV_TARGET
              </button>
              
              <div style="display:flex; gap:4px;">
                 ${testData.questions.map((_, i) => `
                  <div style="width: 6px; height: 6px; background: ${i === currentQuestion ? 'var(--primary)' : answers[i] >= 0 ? 'var(--text)' : '#ddd'};"></div>
                `).join('')}
              </div>

              ${currentQuestion === testData.questions.length - 1 ? `
                <button onclick="battleFinish()" class="btn btn-primary btn-sm">EXECUTE</button>
              ` : `
                <button onclick="battleNext()" class="btn btn-sm">NEXT_TARGET</button>
              `}
            </div>
          </div>
        `;
        updateBattleTimer();
      }

      window.battleSelectAnswer = function (index) {
        const wasUnanswered = answers[currentQuestion] === -1;
        answers[currentQuestion] = index;

        // Track correct count
        const q = testData.questions[currentQuestion];
        let correctCount = 0;
        let answeredCount = 0;
        answers.forEach((a, i) => {
          if (a >= 0) {
            answeredCount++;
            if (a === testData.questions[i].correct) correctCount++;
          }
        });

        // Update Firebase
        const roomCode = localStorage.getItem('battle_room');
        Storage.updateBattlePlayer(roomCode, myPlayerId, {
          currentQuestion: currentQuestion,
          correctCount: correctCount,
          answeredCount: answeredCount,
          ['answers/' + currentQuestion]: {
            selected: index,
            isCorrect: index === q.correct,
            answeredAt: Date.now(),
          }
        });

        // Check if we need intermediate results (every 5 answered questions)
        const checkpoint = Math.floor(answeredCount / 5) * 5;
        if (answeredCount > 0 && answeredCount % 5 === 0 && !intermediateShownAt.has(checkpoint) && answeredCount < testData.questions.length) {
          intermediateShownAt.add(checkpoint);
          showIntermediateResults(roomCode, checkpoint);
          return;
        }

        renderBattleQuestion(roomCode);
      };

      window.battlePrev = function () {
        if (currentQuestion > 0) {
          currentQuestion--;
          questionStartTimes[currentQuestion] = Date.now();
          renderBattleQuestion(localStorage.getItem('battle_room'));
        }
      };

      window.battleNext = function () {
        if (currentQuestion < testData.questions.length - 1) {
          currentQuestion++;
          questionStartTimes[currentQuestion] = questionStartTimes[currentQuestion] || Date.now();
          renderBattleQuestion(localStorage.getItem('battle_room'));
        }
      };

      window.battleFinish = function () {
        const unanswered = answers.filter(a => a === -1).length;
        if (unanswered > 0) {
          if (!confirm('WARNING: ' + unanswered + ' TARGETS REMAINING. CONFIRM EXECUTION?')) return;
        }
        finishBattleTest(localStorage.getItem('battle_room'));
      };

      function showIntermediateResults(roomCode, checkpoint) {
        showingIntermediateResults = true;
        const players = battle && battle.players ? Object.values(battle.players) : [];

        // Sort by correct count desc, then by speed
        const sorted = players.slice().sort((a, b) => {
          if (b.correctCount !== a.correctCount) return b.correctCount - a.correctCount;
          return a.answeredCount - b.answeredCount;
        });

        const renderIntermediate = () => {
          const medals = ['1ST', '2ND', '3RD'];
          document.getElementById('app').innerHTML = `
            <div class="battle-intermediate-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; bg:rgba(255,255,255,0.95); z-index:100; display:flex; align-items:center; justify-content:center;">
              <div class="card fade-in" style="width:100%; max-width:500px; border:4px solid var(--text);">
                <div style="text-align:center;margin-bottom:20px;">
                  <h2 class="mono" style="color:var(--primary); text-transform:uppercase;">CHECKPOINT [${checkpoint}]</h2>
                  <p class="mono" style="color:var(--text-muted);">STATUS REPORT</p>
                </div>

                <div class="battle-standings">
                  ${sorted.map((p, i) => {
            const isMe = p.id === myPlayerId;
            return `
                      <div class="battle-standing-row ${isMe ? 'is-me' : ''}" style="display:flex; align-items:center; padding:12px; border-bottom:1px solid #eee; ${isMe ? 'background:var(--bg-secondary); font-weight:700;' : ''}">
                        <div class="mono" style="width:40px; font-weight:700;">${i < 3 ? medals[i] : (i + 1)}</div>
                        <div style="flex:1;">${Utils.escapeHtml(p.name)}</div>
                        <div class="mono" style="text-align:right;">
                          <span style="color:var(--success); font-weight:700;">${p.correctCount}</span>
                        </div>
                      </div>
                    `;
          }).join('')}
                </div>

                <div style="text-align:center;margin-top:24px;">
                  <button id="continueBtn" class="btn btn-primary btn-block">RESUME <span id="countdownSec">(7)</span></button>
                </div>
              </div>
            </div>
          `;

          // Auto-continue after 7 seconds
          let sec = 7;
          const countdownEl = document.getElementById('countdownSec');
          const autoClose = setInterval(() => {
            sec--;
            if (countdownEl) countdownEl.textContent = '(' + sec + ')';
            if (sec <= 0) {
              clearInterval(autoClose);
              closeIntermediate();
            }
          }, 1000);

          document.getElementById('continueBtn').addEventListener('click', () => {
            clearInterval(autoClose);
            closeIntermediate();
          });
        };

        const closeIntermediate = () => {
          showingIntermediateResults = false;
          renderBattleQuestion(roomCode);
        };

        renderIntermediate();
      }

      function finishBattleTest(roomCode) {
        if (!testData) return;
        clearInterval(timerInterval);
        timerInterval = null;

        const timeSpent = Math.round((Date.now() - testStartTime) / 1000);
        let correctCount = 0;
        answers.forEach((a, i) => {
          if (a >= 0 && a === testData.questions[i].correct) correctCount++;
        });

        Storage.updateBattlePlayer(roomCode, myPlayerId, {
          finished: true,
          finishedAt: Date.now(),
          timeSpent: timeSpent,
          correctCount: correctCount,
          answeredCount: answers.filter(a => a >= 0).length,
        });

        // Also save as regular result
        const score = Math.round((correctCount / testData.questions.length) * 100);
        const result = {
          id: Storage.generateId(),
          testId: testData.id,
          testTitle: testData.title,
          userName: Storage.getUser().name,
          userGroup: Storage.getUser().group || '',
          score,
          correctCount,
          totalQuestions: testData.questions.length,
          timeSpent,
          answers: testData.questions.map((q, i) => ({
            questionId: q.id,
            selected: answers[i],
            correct: q.correct,
            isCorrect: answers[i] === q.correct,
          })),
          completedAt: Date.now(),
          battleRoom: roomCode,
        };
        Storage.saveResult(result);

        showWaitingForOthers(roomCode);
      }

      function showWaitingForOthers(roomCode) {
        // Listen for all players to finish
        const checkFinished = () => {
          if (!battle || !battle.players) return;
          const players = Object.values(battle.players);
          const allDone = players.every(p => p.finished);
          if (allDone) {
            Storage.finishBattle(roomCode);
          }
        };

        // Re-render waiting screen with live data
        const renderWaiting = () => {
          if (!battle) return;
          const players = Object.values(battle.players || {});
          const finished = players.filter(p => p.finished).length;
          const total = players.length;

          if (battle.status === 'finished') {
            showFinalResults(roomCode);
            return;
          }

          document.getElementById('app').innerHTML = `
            <div class="container fade-in" style="max-width:600px;text-align:center;margin-top:60px;">
              <h2 style="margin-bottom:16px;">MISSION COMPLETE</h2>
              <p class="mono" style="color:var(--text-muted);margin-bottom:40px;">AWAITING ALL UNITS...</p>

              <div class="card">
                <div class="battle-waiting-players">
                  ${players.map(p => `
                    <div class="battle-waiting-player" style="display:flex; align-items:center; padding:8px 0; border-bottom:1px solid #eee;">
                      <div class="battle-player-avatar" style="width:30px; height:30px; background:var(--bg-secondary); display:flex; align-items:center; justify-content:center; margin-right:12px; font-weight:700;">${p.name.charAt(0).toUpperCase()}</div>
                      <span style="font-weight:700;">${Utils.escapeHtml(p.name)}</span>
                      ${p.finished
              ? '<span class="mono" style="color:var(--success);margin-left:auto; font-size:0.8rem;">READY</span>'
              : '<span class="mono" style="color:var(--text-muted);margin-left:auto; font-size:0.8rem;">ACTIVE...</span>'}
                    </div>
                  `).join('')}
                </div>

                <div style="margin-top:20px;color:var(--text-muted);" class="mono">
                  ${finished} / ${total} REPORTING
                </div>
              </div>
            </div>
          `;

          checkFinished();
        };

        // Update on battle changes
        if (battleRef) Storage.offBattleChange(battleRef);
        battleRef = Storage.onBattleChange(roomCode, (data) => {
          battle = data;
          renderWaiting();
        });
      }

      function showFinalResults(roomCode) {
        clearInterval(timerInterval);
        timerInterval = null;
        showingIntermediateResults = false;

        if (!battle || !battle.players) return;
        const players = Object.values(battle.players);
        testData = testData || Storage.getTest(battle.testId);

        // Sort by correct count desc, then by time spent asc
        const sorted = players.slice().sort((a, b) => {
          if (b.correctCount !== a.correctCount) return b.correctCount - a.correctCount;
          return (a.timeSpent || 9999) - (b.timeSpent || 9999);
        });

        const topCount = Math.min(sorted.length, 3);
        const medals = ['1', '2', '3']; // Minimalist

        // Build podium (reorder for visual: 2nd, 1st, 3rd)
        let podiumOrder = [];
        if (topCount >= 2) podiumOrder.push({ ...sorted[1], rank: 1 });
        podiumOrder.push({ ...sorted[0], rank: 0 });
        if (topCount >= 3) podiumOrder.push({ ...sorted[2], rank: 2 });
        // If only 1 player
        if (topCount === 1) podiumOrder = [{ ...sorted[0], rank: 0 }];

        const totalQ = testData ? testData.questions.length : (battle.questionsCount || '?');

        document.getElementById('app').innerHTML = `
          ${Storage.getUser() ? Utils.renderHeader(Storage.getUser(), 'battle') : ''}
          <div class="container fade-in" style="max-width:800px;">
            <div style="text-align:center;margin:30px 0 40px;">
              <h1 class="battle-glow" style="margin-bottom:8px;">DEBRIEFING</h1>
              <p class="mono" style="color:var(--text-muted); text-transform:uppercase;">${Utils.escapeHtml(battle.testTitle)}</p>
            </div>

            <div class="battle-podium">
              ${podiumOrder.map(p => {
          const r = p.rank;
          const isMe = p.id === myPlayerId;
          const score = totalQ ? Math.round((p.correctCount / totalQ) * 100) : 0;
          // Height based on rank
          const barHeight = r === 0 ? 250 : r === 1 ? 180 : 120;

          return `
                  <div class="battle-podium-item rank-${r} ${isMe ? 'is-me' : ''}">
                    <div style="font-weight:700; text-transform:uppercase; margin-bottom:8px;">${Utils.escapeHtml(p.name)}</div>
                    <div class="battle-podium-bar" style="height:${barHeight}px; width:80px; background:${r === 0 ? 'var(--primary)' : 'var(--text)'}; color:var(--bg); display:flex; align-items:flex-end; justify-content:center; padding-bottom:12px; font-weight:800; font-size:2rem;">
                      ${medals[r]}
                    </div>
                    <div style="margin-top:12px; font-weight:700; color:var(--primary); font-size:1.2rem;">${p.correctCount} / ${totalQ}</div>
                    <div class="mono" style="color:var(--text-muted); font-size:0.8rem;">${p.timeSpent ? Utils.formatTime(p.timeSpent) : '--:--'}</div>
                  </div>
                `;
        }).join('')}
            </div>

            ${sorted.length > 3 ? `
              <div class="card" style="margin-top:40px;">
                <div class="card-header">UNIT_PERFORMANCE</div>
                <table class="leaderboard-table">
                  <thead>
                    <tr><th class="mono">RANK</th><th>OPERATOR</th><th style="text-align:right;">DATA</th><th style="text-align:right;">TIME</th></tr>
                  </thead>
                  <tbody>
                    ${sorted.map((p, i) => {
          const isMe = p.id === myPlayerId;
          const score = totalQ ? Math.round((p.correctCount / totalQ) * 100) : 0;
          return `
                        <tr class="${isMe ? 'highlight-row' : ''}" style="${isMe ? 'background:var(--bg-secondary);' : ''}">
                          <td class="rank-cell mono">${i + 1}</td>
                          <td class="name-cell" style="font-weight:700;">${Utils.escapeHtml(p.name)}</td>
                          <td class="score-cell">${p.correctCount}/${totalQ} (${score}%)</td>
                          <td class="time-cell">${p.timeSpent ? Utils.formatTime(p.timeSpent) : '--:--'}</td>
                        </tr>
                      `;
        }).join('')}
                  </tbody>
                </table>
              </div>
            ` : ''}

            <div style="display:flex;gap:12px;margin-top:40px;flex-wrap:wrap;justify-content:center; padding-bottom: 60px;">
              <a href="battle.html" class="btn btn-block" style="background:var(--primary); color:white;">NEW SESSION</a>
              <a href="tests.html" class="btn btn-outline btn-block">RETURN TO BASE</a>
            </div>
          </div>
        `;

        // Clear battle state from localStorage
        localStorage.removeItem('battle_player_id');
        localStorage.removeItem('battle_room');
        localStorage.removeItem('battle_is_creator');
      }

    })();
  </script>
</body>

</html>
